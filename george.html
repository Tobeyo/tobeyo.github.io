<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>George</title>
<meta name="description" content="Prank-App">
<meta name="theme-color" content="#0069b4">
<link rel="icon" type="image/png" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="George">
<style>
:root{
  --blue:#0069b4;
  --blue-d:#00548f;
  --cyan:#00a1e0;
  --sky:#41c0f0;
  --bg:#f0f2f5;
  --card:#ffffff;
  --text:#1a1c1f;
  --muted:#6b7280;
  --muted2:#9ca3af;
  --line:#e6e8ec;
  --green:#0f9d58;
  --red:#d93025;
  --sat:env(safe-area-inset-top);
  --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;font-size:16px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
#root{max-width:520px;margin:0 auto;min-height:100vh;position:relative;}
.hide{display:none !important;}

/* wordmark */
.wm{font-weight:800;letter-spacing:-1.2px;}
.wm i{font-style:normal;color:var(--sky);}

/* buttons */
.btn-b{background:var(--blue);color:#fff;font-weight:700;border-radius:26px;padding:16px;width:100%;font-size:16.5px;transition:transform .1s;}
.btn-b:active{transform:scale(.985);}
.btn-b:disabled{background:#c2c8d0;color:#fff;cursor:default;}
.btn-o{background:#fff;color:var(--blue);font-weight:700;border-radius:26px;padding:15px;width:100%;font-size:16px;border:1.5px solid var(--blue);}
.btn-g{background:#e8eaee;color:var(--text);font-weight:600;border-radius:26px;padding:15px;width:100%;font-size:16px;}
.danger{color:var(--red);font-weight:600;text-align:center;padding:15px;width:100%;}

/* ============ UNLOCK ============ */
#unlock{min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#fff;
  background:linear-gradient(165deg,#00548f 0%,#0069b4 42%,#00a1e0 100%);
  padding:0 24px calc(24px + var(--sab));position:relative;overflow:hidden;}
#unlock::after{content:"";position:absolute;width:150%;height:60%;left:-25%;bottom:-18%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.14),transparent 70%);}
#unlock>*{position:relative;z-index:1;}
#unlock .wm{font-size:44px;margin-top:calc(58px + var(--sat));}
#unlock .hi{margin-top:36px;font-size:23px;font-weight:600;text-align:center;}
#unlock .sub{margin-top:7px;font-size:15px;opacity:.85;text-align:center;}
.dots{display:flex;gap:19px;justify-content:center;margin:34px 0 4px;}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.65);transition:.15s;}
.dot.on{background:#fff;border-color:#fff;transform:scale(1.05);}
.uerr{height:20px;font-size:14px;text-align:center;color:#ffdede;}
.pad{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:320px;}
.key{width:74px;height:74px;justify-self:center;border-radius:50%;font-size:30px;font-weight:400;color:#fff;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);transition:background .12s;}
.key:active{background:rgba(255,255,255,.34);}
.key.blank{background:none;}
.face{margin-top:20px;text-align:center;font-size:15px;font-weight:600;opacity:.92;}

/* ============ APP ============ */
#app{display:none;min-height:100vh;padding-bottom:108px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + var(--sat)) 18px 10px;}
.topbar h1{font-size:27px;font-weight:800;letter-spacing:-.6px;}
.topbar .acts{display:flex;gap:9px;}
.iconbtn{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.09);position:relative;}
.iconbtn .bdg{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(140deg,var(--blue),var(--cyan));color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;}
.sect{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:20px 18px 9px;}
.sect.row{display:flex;align-items:center;justify-content:space-between;}
.sect .lnk{color:var(--blue);text-transform:none;letter-spacing:0;font-size:14px;}
.h2{font-size:21px;font-weight:800;padding:18px 18px 10px;letter-spacing:-.3px;}

/* account cards */
.cscroll{display:flex;gap:13px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 18px 8px;scrollbar-width:none;}
.cscroll::-webkit-scrollbar{display:none;}
.acard{min-width:83%;scroll-snap-align:center;border-radius:18px;padding:17px;color:#fff;position:relative;
  overflow:hidden;height:186px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 5px 16px rgba(20,40,70,.18);text-align:left;}
.acard::after{content:"";position:absolute;inset:0;background:linear-gradient(175deg,rgba(0,0,0,.04),rgba(0,0,0,.5));}
.acard>*{position:relative;z-index:1;}
.wp1{background:linear-gradient(135deg,#1e5799,#2989d8 55%,#7db9e8);}
.wp2{background:linear-gradient(135deg,#f2711c,#c1385f 55%,#5b2a86);}
.wp3{background:linear-gradient(135deg,#134e5e,#3a7d5d 60%,#71b280);}
.wp4{background:linear-gradient(135deg,#232526,#4a4d50);}
.wp5{background:linear-gradient(135deg,#a8801a,#d4af37 55%,#7a5f12);}
.wp6{background:linear-gradient(135deg,#5b2a86,#a83279 60%,#e04c8a);}
.wp7{background:linear-gradient(135deg,#0f2027,#203a43 50%,#2c5364);}
.wp8{background:linear-gradient(135deg,#00b09b,#96c93d);}
.acard .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.acard .nm{font-size:16.5px;font-weight:700;}
.acard .ib{font-size:12.5px;opacity:.92;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:.3px;}
.acard .tag{font-size:11.5px;background:rgba(255,255,255,.24);padding:4px 9px;border-radius:14px;font-weight:600;white-space:nowrap;}
.acard .bal{font-size:29px;font-weight:800;letter-spacing:-.6px;}
.acard .av{font-size:12.5px;opacity:.9;margin-top:2px;}
.cdots{display:flex;gap:6px;justify-content:center;padding:4px 0 2px;}
.cdots i{width:7px;height:7px;border-radius:50%;background:#c3c8d1;transition:.2s;}
.cdots i.on{background:var(--blue);width:19px;border-radius:4px;}

.tot{background:var(--card);border-radius:15px;margin:8px 18px 2px;padding:15px 17px;display:flex;
  justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.tot .l{color:var(--muted);font-size:14px;}
.tot .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;}

.qrow{display:flex;gap:10px;padding:12px 18px 2px;}
.q{flex:1;background:var(--card);border-radius:14px;padding:13px 5px;display:flex;flex-direction:column;
  align-items:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.q .c{width:40px;height:40px;border-radius:50%;background:#e6f1fa;display:flex;align-items:center;justify-content:center;}
.q span{font-size:12px;font-weight:600;}

/* transactions */
.feed{background:var(--card);border-radius:18px 18px 0 0;margin-top:14px;padding:8px 0 22px;min-height:44vh;}
.srch{display:flex;align-items:center;gap:10px;background:#eef0f4;border-radius:11px;padding:11px 14px;margin:10px 16px 2px;}
.srch input{flex:1;background:none;border:none;outline:none;font-size:15.5px;color:var(--text);}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:7px 13px;border-radius:16px;background:#eef0f4;font-size:13.5px;white-space:nowrap;color:#4b5563;}
.chip.on{background:var(--blue);color:#fff;font-weight:700;}
.day{font-size:12.5px;font-weight:700;color:var(--muted);padding:15px 18px 5px;}
.tx{display:flex;align-items:center;gap:13px;padding:11px 18px;width:100%;text-align:left;}
.tx:active{background:#f5f7fa;}
.tx .ci{width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;}
.tx .m{flex:1;min-width:0;}
.tx .m b{font-size:15.8px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx .m span{font-size:13px;color:var(--muted);}
.tx .a{font-weight:700;font-size:15.8px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.tx .a.pos{color:var(--green);}
.sep{height:1px;background:var(--line);margin-left:74px;}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px;}

/* lists */
.list{background:var(--card);border-radius:15px;margin:0 14px 16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.row{display:flex;align-items:center;gap:14px;padding:15px 16px;position:relative;width:100%;text-align:left;}
.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--line);}
.row .ico{width:26px;display:flex;justify-content:center;flex-shrink:0;color:var(--blue);}
.row .lbl{flex:1;font-size:16px;}
.row .lbl small{display:block;font-size:13px;color:var(--muted);margin-top:2px;}
.row .val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
.row .chev{color:var(--muted2);font-size:19px;}
.prow{background:var(--card);border-radius:15px;margin:0 14px 14px;padding:15px;display:flex;align-items:center;gap:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);width:calc(100% - 28px);text-align:left;}
.prow .av{width:52px;height:52px;border-radius:50%;background:linear-gradient(140deg,var(--blue),var(--cyan));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;flex-shrink:0;}
.prow .nm{flex:1;font-size:18px;font-weight:700;}
.prow .nm small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px;}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;color:var(--blue);font-weight:700;
  font-size:15.5px;width:calc(100% - 28px);margin:0 14px 16px;background:var(--card);border-radius:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;
  padding:7px 4px calc(7px + var(--sab));z-index:40;}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;color:var(--muted2);font-size:10.5px;
  padding:4px 0;position:relative;}
.tab.active{color:var(--blue);}
.tab .bdg{position:absolute;top:-1px;right:16px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;
  min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.tab.fab{flex:0 0 auto;}
.tab.fab .f{width:56px;height:56px;border-radius:50%;background:linear-gradient(140deg,var(--blue),var(--cyan));
  display:flex;align-items:center;justify-content:center;margin-top:-24px;box-shadow:0 5px 15px rgba(0,105,180,.42);}
.tab.fab span{margin-top:2px;color:var(--blue);font-weight:700;}

/* pages */
.page{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);z-index:60;overflow-y:auto;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,.28,1);padding-bottom:40px;}
.page.open{transform:translateX(0);}
.pbar{position:sticky;top:0;background:rgba(240,242,245,.94);backdrop-filter:blur(12px);display:flex;align-items:center;
  height:54px;padding:var(--sat) 8px 0;margin-top:var(--sat);z-index:5;}
.pbar .bk{width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--blue);}
.pbar h1{font-size:17px;font-weight:700;flex:1;text-align:center;padding-right:46px;}
.pbody{padding:6px 18px;}

/* forms */
.fld{margin-bottom:16px;}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;padding-left:2px;font-weight:600;}
.fld input,.fld select,.fld textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:14px;color:var(--text);font-size:16px;outline:none;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue);}
.fld select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}
.fld .hint{font-size:12px;color:var(--muted2);margin-top:6px;padding-left:2px;}
.frow{display:flex;gap:12px;} .frow .fld{flex:1;}
.facts{margin-top:22px;display:flex;flex-direction:column;gap:11px;}
.note{background:#e6f1fa;border-radius:12px;padding:13px 15px;margin-bottom:18px;color:#264b66;font-size:13.5px;line-height:1.5;}
.sw{width:51px;height:31px;border-radius:16px;background:#d0d4da;position:relative;transition:.2s;flex-shrink:0;}
.sw.on{background:var(--green);}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.sw.on::after{transform:translateX(20px);}
.wpgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.wpo{height:52px;border-radius:11px;border:3px solid transparent;}
.wpo.sel{border-color:var(--blue);}

/* detail head */
.dhead{padding:4px 18px 14px;}
.dhead .t{color:var(--muted);font-size:14.5px;}
.dhead .b{font-size:33px;font-weight:800;margin-top:2px;letter-spacing:-.7px;font-variant-numeric:tabular-nums;}
.dhead .i{color:var(--muted);font-size:13.5px;margin-top:5px;}
.dacts{display:flex;gap:9px;margin-top:14px;}
.dacts button{flex:1;background:var(--card);border-radius:13px;padding:12px 4px;display:flex;flex-direction:column;
  align-items:center;gap:7px;font-size:12px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06);}

/* review/success */
.rev{background:var(--card);border-radius:15px;padding:2px 16px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.rev .r{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);}
.rev .r:last-child{border-bottom:none;}
.rev .k{color:var(--muted);font-size:14.5px;flex-shrink:0;}
.rev .v{text-align:right;font-weight:600;word-break:break-word;font-size:15px;}
.rev .v.amt{color:var(--blue);font-size:21px;font-weight:800;}
.succ{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14vh 24px 24px;}
.chk{width:92px;height:92px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;
  margin-bottom:22px;animation:pop .42s cubic-bezier(.2,1.4,.5,1);}
@keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}
.succ h2{font-size:23px;margin-bottom:10px;}
.succ p{color:var(--muted);font-size:15.5px;line-height:1.5;margin-bottom:4px;}

/* savings goal */
.goal{background:var(--card);border-radius:15px;padding:16px;margin-bottom:13px;box-shadow:0 1px 3px rgba(0,0,0,.06);
  width:100%;text-align:left;}
.goal .g1{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.goal .gn{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:9px;}
.goal .gp{font-size:13px;color:var(--muted);}
.goal .bar{height:9px;border-radius:5px;background:#e8eaee;overflow:hidden;margin-top:11px;}
.goal .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--cyan));}
.goal .g2{display:flex;justify-content:space-between;margin-top:8px;font-size:13.5px;color:var(--muted);}
.goal .g2 b{color:var(--text);}

/* bank card */
.bcard{border-radius:16px;padding:18px;height:198px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(135deg,#0069b4,#00a1e0);color:#fff;position:relative;overflow:hidden;margin-bottom:16px;
  box-shadow:0 6px 18px rgba(0,105,180,.28);}
.bcard.blk{filter:grayscale(1);opacity:.65;}
.bcard .wmk{position:absolute;top:16px;right:18px;font-size:19px;font-weight:800;letter-spacing:-.8px;}
.bcard .chp{width:38px;height:28px;border-radius:5px;background:linear-gradient(135deg,#e6d18a,#b3922f);}
.bcard .num{font-size:20px;letter-spacing:2.5px;font-variant-numeric:tabular-nums;}
.bcard .bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:12.5px;opacity:.95;}
.blktag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;
  font-weight:800;color:#fff;letter-spacing:2px;background:rgba(0,0,0,.32);}

/* stats */
.sgrid{display:flex;gap:11px;margin-bottom:16px;}
.stat{flex:1;background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.stat .l{font-size:12.5px;color:var(--muted);}
.stat .v{font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;}
.catrow{padding:12px 0;border-bottom:1px solid var(--line);}
.catrow:last-child{border-bottom:none;}
.catrow .t{display:flex;align-items:center;gap:11px;}
.catrow .d{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
.catrow .n{flex:1;font-size:15.5px;}
.catrow .v{font-weight:700;font-variant-numeric:tabular-nums;}
.catrow .bar{height:8px;border-radius:4px;background:#e8eaee;overflow:hidden;margin-top:8px;}
.catrow .bar i{display:block;height:100%;border-radius:4px;}

/* plugin */
.plug{background:var(--card);border-radius:15px;padding:15px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start;
  box-shadow:0 1px 3px rgba(0,0,0,.06);}
.plug .pi{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.plug .pm{flex:1;}
.plug .pm b{font-size:16px;display:block;}
.plug .pm span{font-size:13.5px;color:var(--muted);display:block;margin-top:3px;line-height:1.4;}
.plug .pb{padding:8px 15px;border-radius:18px;font-size:13.5px;font-weight:700;white-space:nowrap;align-self:center;}
.plug .pb.add{background:var(--blue);color:#fff;}
.plug .pb.has{background:#e8eaee;color:var(--muted);}

/* sheet */
.bd{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:75;opacity:0;pointer-events:none;transition:.28s;}
.bd.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fff;
  border-radius:20px 20px 0 0;z-index:80;transform:translateY(110%);transition:transform .32s cubic-bezier(.32,.72,.28,1);
  padding:10px 0 calc(14px + var(--sab));}
.sheet.open{transform:translateY(0);}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:#d3d6dc;margin:0 auto 8px;}
.sheet h3{font-size:15px;font-weight:700;padding:9px 18px;text-align:center;color:var(--muted);}
.sheet .si{display:flex;align-items:center;gap:14px;padding:15px 20px;font-size:16.5px;width:100%;text-align:left;}
.sheet .si:active{background:#f2f4f7;}
.sheet .si .ico{width:24px;display:flex;justify-content:center;color:var(--blue);}

.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%) translateY(16px);background:#1a1c1f;color:#fff;
  padding:12px 22px;border-radius:24px;font-size:15px;z-index:100;opacity:0;transition:.25s;pointer-events:none;

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.accounts)return mig(s);}catch(e){}
  return structuredClone(DEFAULT_STATE);}
function mig(s){const d=DEFAULT_STATE;
  s.profile=s.profile||structuredClone(d.profile);
  ['goals','cards','standing','templates','messages'].forEach(k=>s[k]=s[k]||structuredClone(d[k]));
  s.plugins=Object.assign(structuredClone(d.plugins),s.plugins||{});
  s.notif=Object.assign(structuredClone(d.notif),s.notif||{});
  s.settings=Object.assign(structuredClone(d.settings),s.settings||{});
  return s;}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2300);}

  try{return new Date(d+'T00:00').toLocaleDateString('de-AT',{weekday:'long',day:'2-digit',month:'long'});}catch(e){return d;}}

let tab='start';
function scrUnlock(){root().innerHTML=vUnlock();bindUnlock();window.scrollTo(0,0);}
function enterApp(){root().innerHTML='<div id="app" style="display:block"></div>';tab='start';paint();}
function paint(){const a=document.getElementById('app');if(!a)return;
  a.innerHTML=({start:tStart,fin:tFin,prod:tProd,more:tMore})[tab]()+tabbar();bindTabs();}
function go(t){tab=t;paint();window.scrollTo(0,0);}

/* ---------- unlock ---------- */
function vUnlock(){
  return `<div id="unlock">
    <div class="wm">george<i>.</i></div>
    <div class="hi">Hallo ${esc(state.profile.name.split(' ')[0])}</div>
    <div class="sub">Bitte gib deinen Verfügercode ein</div>
    <div class="dots" id="uDots"></div>
    <div class="uerr" id="uErr"></div>
    <div class="pad" id="uPad"></div>
    <div class="face">Face ID verwenden</div>
  </div>`;
}
function bindUnlock(){keypad(document.getElementById('uPad'),document.getElementById('uDots'),
  document.getElementById('uErr'),()=>enterApp());}

function keypad(pad,dots,err,ok){
  let v='';const n=state.pin.length;
  const draw=()=>dots.innerHTML=Array.from({length:n},(_,i)=>`<span class="dot ${i<v.length?'on':''}"></span>`).join('');
  pad.innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>
    k===''?'<div class="key blank"></div>':`<button class="key" data-k="${k==='⌫'?'del':k}">${k}</button>`).join('');
  draw();
  pad.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='del')v=v.slice(0,-1);else if(v.length<n)v+=k;
    draw();if(err)err.textContent='';
    if(v.length===n)setTimeout(()=>{
      if(v===state.pin)ok();
      else{if(err)err.textContent='Falscher Code. Bitte erneut versuchen.';v='';draw();
        if(navigator.vibrate)navigator.vibrate(180);}},150);
  });
}

/* ---------- chrome ---------- */
function topbar(title){
  const un=state.messages.filter(m=>!m.read).length;
  return `<div class="topbar"><h1>${esc(title)}</h1><div class="acts">
    <button class="iconbtn" data-msgs>${un?`<span class="bdg">${un}</span>`:''}${IC.bell('#1a1c1f')}</button>
    <button class="iconbtn" data-go="more">${IC.gear('#1a1c1f')}</button>
    <button class="avatar" data-profile>${esc(ini(state.profile.name))}</button></div></div>`;
}
function tabbar(){
  const un=state.messages.filter(m=>!m.read).length;
  const t=(k,ic,l,b)=>`<button class="tab ${tab===k?'active':''}" data-go="${k}">
    ${b?`<span class="bdg">${b}</span>`:''}${ic(tab===k?'#0069b4':'#9ca3af')}<span>${l}</span></button>`;
  return `<nav class="tabbar">${t('start',IC.home,'Start')}${t('fin',IC.pie,'Finanzstatus')}
    <button class="tab fab" data-newtr><span class="f">${IC.swap}</span><span>Beauftragen</span></button>
    ${t('prod',IC.grid,'Produkte')}${t('more',IC.menu,'Mehr',un||'')}</nav>`;
}

/* ---------- START ---------- */
let feedQ='',feedF='alle';
function tStart(){
  const cards=state.accounts.map(a=>`<button class="acard ${a.wp||'wp1'}" data-det="${a.id}">
    <div class="r1"><div><div class="nm">${esc(a.type)}</div><div class="ib">${esc(a.iban)}</div></div>
      <div class="tag">${(a.tx||[]).length} Umsätze</div></div>
    <div><div class="bal">${shown(a.balance)}</div><div class="av">verfügbar ${shown(a.available??a.balance)}</div></div>
  </button>`).join('');
  const dots=state.accounts.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');
  const goals=state.goals.slice(0,2).map(g=>{
    const p=Math.min(100,Math.round(g.saved/Math.max(1,g.target)*100));
    return `<button class="goal" data-goals><div class="g1"><span class="gn">${g.icon} ${esc(g.name)}</span>
      <span class="gp">${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div>
      <div class="g2"><span><b>${fmt(g.saved)}</b> gespart</span><span>Ziel ${fmt(g.target)}</span></div></button>`;}).join('');

  return topbar('Hallo '+state.profile.name.split(' ')[0])+`
    <div class="cscroll" id="csc">${cards}</div>
    <div class="cdots" id="cdots">${dots}</div>
    <div class="tot"><span class="l">Vermögen gesamt</span><span class="v">${shown(totalAll())}</span></div>
    <div class="qrow">
      <button class="q" data-newtr><span class="c">${IC.send}</span><span>Überweisen</span></button>
      <button class="q" data-scanpay><span class="c">${IC.qr}</span><span>Scan &amp; Pay</span></button>
      <button class="q" data-goals><span class="c">${IC.pig}</span><span>Sparziele</span></button>
    </div>
    ${state.goals.length?`<div class="sect row">Sparziele <button class="lnk" data-goals>Alle anzeigen ›</button></div>
      <div style="padding:0 18px">${goals}</div>`:''}
    <div class="feed">
      <div class="srch">${IC.srch}<input id="fq" placeholder="Suche in Umsätzen" value="${esc(feedQ)}"></div>
      <div class="chips" id="fch">
        <button class="chip ${feedF==='alle'?'on':''}" data-f="alle">Alle</button>
        <button class="chip ${feedF==='in'?'on':''}" data-f="in">Eingänge</button>
        <button class="chip ${feedF==='out'?'on':''}" data-f="out">Ausgänge</button>
        ${Object.entries(CATS).filter(([k])=>k!=='sonstiges').map(([k,c])=>
          `<button class="chip ${feedF==='c:'+k?'on':''}" data-f="c:${k}">${c.l}</button>`).join('')}
      </div>
      <div id="feed"></div>
    </div>`;
}
function drawFeed(){
  const el=document.getElementById('feed');if(!el)return;
  let all=[];state.accounts.forEach(a=>(a.tx||[]).forEach(t=>all.push({...t,_a:a})));
  all.sort((x,y)=>y.date.localeCompare(x.date));
  if(feedQ)all=all.filter(t=>(t.title+' '+(t.purpose||'')).toLowerCase().includes(feedQ));
  if(feedF==='in')all=all.filter(t=>t.amount>0);else if(feedF==='out')all=all.filter(t=>t.amount<0);
  else if(feedF.startsWith('c:'))all=all.filter(t=>(t.cat||'sonstiges')===feedF.slice(2));
  let h='',last='';
  all.slice(0,40).forEach(t=>{if(t.date!==last){h+=`<div class="day">${dLabel(t.date)}</div>`;last=t.date;}
    const c=cat(t);
    h+=`<button class="tx" data-tx="${t._a.id}:${t.id}"><span class="ci" style="background:${c.c}1f;color:${c.c}">${c.e}</span>
      <span class="m"><b>${esc(t.title)}</b><span>${esc(t.purpose||c.l)} · ${esc(t._a.type)}</span></span>
      <span class="a ${t.amount>0?'pos':''}">${t.amount>0?'+':''}${fmt(t.amount)}</span></button><div class="sep"></div>`;});
  el.innerHTML=h||'<div class="empty">Keine Umsätze gefunden.</div>';
  el.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{
    const [aid,tid]=b.dataset.tx.split(':');pgTx(state.accounts.find(a=>a.id===aid),tid);});
}

/* ---------- FINANZSTATUS ---------- */
function tFin(){
  const all=state.accounts.flatMap(a=>a.tx||[]);
  const inc=all.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const exp=all.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  const by={};all.filter(t=>t.amount<0).forEach(t=>{const k=t.cat||'sonstiges';by[k]=(by[k]||0)+Math.abs(t.amount);});
  const mx=Math.max(1,...Object.values(by));
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{const c=CATS[k]||CATS.sonstiges;
    return `<div class="catrow"><div class="t"><span class="d" style="background:${c.c}1f;color:${c.c}">${c.e}</span>

/* ==========================================================================
   PAGES
   ========================================================================== */
function openPage(html,after){
  const p=document.createElement('div');p.className='page';p.innerHTML=html;
  document.body.appendChild(p);requestAnimationFrame(()=>p.classList.add('open'));
  p.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closePage(p));
  after&&after(p);return p;
}
function closePage(p){p.classList.remove('open');setTimeout(()=>p.remove(),300);paint();}
const pbar=t=>`<div class="pbar"><button class="bk" data-close>‹</button><h1>${esc(t)}</h1></div>`;

let sheetEl=null;
function openSheet(title,items){
  closeSheet();const bd=document.getElementById('bd');
  const s=document.createElement('div');s.className='sheet';
  s.innerHTML=`<div class="grab"></div>${title?`<h3>${esc(title)}</h3>`:''}`+
    items.map((it,i)=>`<button class="si" data-i="${i}"><span class="ico">${it.ic||''}</span><span>${esc(it.l)}</span></button>`).join('');
  document.body.appendChild(s);sheetEl=s;
  requestAnimationFrame(()=>{s.classList.add('open');bd.classList.add('open');});
  bd.onclick=closeSheet;
  s.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];closeSheet();it.fn&&it.fn();});
}
function closeSheet(){const bd=document.getElementById('bd');bd.classList.remove('open');
  if(sheetEl){const s=sheetEl;s.classList.remove('open');setTimeout(()=>s.remove(),320);sheetEl=null;}}

function pgGoalMove(g,dir,after){
  const opts=state.accounts.map(a=>`<option value="${a.id}">${esc(a.type)} · ${eur(a.balance)}</option>`).join('');
  const p=openPage(pbar(dir==='in'?'Einzahlen':'Entnehmen')+`
    <div class="pbody">
      <div class="note">${esc(g.name)} · aktuell ${fmt(g.saved)} von ${fmt(g.target)} EUR</div>
      <div class="fld"><label>${dir==='in'?'Von Konto':'Auf Konto'}</label><select id="gA">${opts}</select></div>
      <div class="fld"><label>Betrag (EUR)</label><input id="gV" inputmode="decimal" placeholder="0,00"></div>
      <div class="facts"><button class="btn-b" id="gS">${dir==='in'?'Einzahlen':'Entnehmen'}</button></div>
    </div>`,p=>{
      p.querySelector('#gS').onclick=()=>{
        const a=state.accounts.find(x=>x.id===p.querySelector('#gA').value);const v=money(p.querySelector('#gV').value);
        if(!(v>0)){toast('Bitte Betrag eingeben');return;}
        if(dir==='in'&&v>a.balance){toast('Nicht genügend Deckung');return;}
        if(dir==='out'&&v>g.saved){toast('So viel ist nicht gespart');return;}
        const s=dir==='in'?-1:1;
        a.balance=Math.round((a.balance+s*v)*100)/100;a.available=Math.round(((a.available??a.balance)+s*v)*100)/100;
        g.saved=Math.round((g.saved-s*v)*100)/100;
        a.tx.unshift({id:uid(),title:g.name,purpose:'Sparziel',amount:s*v,date:iso(new Date()),
          cat:dir==='in'?'uebertrag':'einkommen'});
        save();closePage(p);after&&after();toast(dir==='in'?'Eingezahlt':'Entnommen');};
    });
}

          ${m.read?'':'<span style="width:9px;height:9px;border-radius:50%;background:var(--red)"></span>'}
          <span class="chev">›</span></button>`).join('')+`</div>`:'<div class="empty">Keine Nachrichten.</div>';
      p.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=state.messages.find(x=>x.id===b.dataset.m);
        m.read=true;save();
        openPage(pbar('Nachricht')+`<div class="pbody">
          <div style="font-size:20px;font-weight:700;margin:10px 0 4px">${esc(m.subject)}</div>
          <div style="color:var(--muted);font-size:13.5px;margin-bottom:18px">${esc(m.from)} · ${dShort(m.date)}</div>
          <div style="line-height:1.6;white-space:pre-wrap">${esc(m.body)}</div></div>`);draw();});
    };draw();});
}

/* ==========================================================================
   BINDINGS
   ========================================================================== */
function bindTabs(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>pgAccount(b.dataset.det));
  document.querySelectorAll('[data-newtr]').forEach(b=>b.onclick=()=>pgTransfer(state.accounts[0]?.id));
  document.querySelectorAll('[data-scanpay]').forEach(b=>b.onclick=pgScanPay);
  document.querySelectorAll('[data-goals]').forEach(b=>b.onclick=pgGoals);
  document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=pgProfile);
  document.querySelectorAll('[data-msgs]').forEach(b=>b.onclick=pgMessages);
  document.querySelector('[data-code]')?.addEventListener('click',pgCode);
  document.querySelector('[data-manage]')?.addEventListener('click',pgManage);
  document.querySelector('[data-wp]')?.addEventListener('click',pgWallpaper);
  document.querySelector('[data-notif]')?.addEventListener('click',pgNotif);
  document.querySelector('[data-display]')?.addEventListener('click',pgDisplay);
  document.querySelector('[data-store]')?.addEventListener('click',pgStore);
  document.querySelector('[data-hotline]')?.addEventListener('click',pgHotline);
  document.querySelector('[data-branch]')?.addEventListener('click',pgBranch);
  document.querySelectorAll('[data-cards]').forEach(b=>b.onclick=pgCards);
  document.querySelector('[data-standing]')?.addEventListener('click',pgStanding);
  document.querySelector('[data-templates]')?.addEventListener('click',pgTemplates);
  document.querySelector('[data-addacct]')?.addEventListener('click',()=>pgEditAccount(null));
  document.querySelector('[data-logout]')?.addEventListener('click',scrUnlock);
  document.querySelector('[data-reset]')?.addEventListener('click',()=>{
    if(confirm('Prank komplett zurücksetzen?')){state=structuredClone(DEFAULT_STATE);save();toast('Zurückgesetzt');scrUnlock();}});
  const sc=document.getElementById('csc');
  if(sc)sc.addEventListener('scroll',()=>{const i=Math.round(sc.scrollLeft/sc.clientWidth);
    document.querySelectorAll('#cdots i').forEach((d,x)=>d.classList.toggle('on',x===i));});
  const fq=document.getElementById('fq');
  if(fq){fq.addEventListener('input',e=>{feedQ=e.target.value.toLowerCase().trim();drawFeed();});
    document.querySelectorAll('#fch .chip').forEach(b=>b.onclick=()=>{feedF=b.dataset.f;
      document.querySelectorAll('#fch .chip').forEach(x=>x.classList.toggle('on',x===b));drawFeed();});
    drawFeed();}
}

/* boot */
scrUnlock();
