      hint.className = 'empty-hint';
      hint.textContent = 'Für ' + MONTH_NAMES[curM] + ' ' + curY + ' ist noch kein Essensplan hinterlegt.';
      foodView.appendChild(hint);
    }
  }

  function foodWeek(mon, days) {
    var a = days[0].date, b = days[days.length - 1].date;
    var range;
    if (a.getMonth() !== b.getMonth()) {
      range = a.getDate() + '. ' + MONTH_NAMES[a.getMonth()] + ' – ' + b.getDate() + '. ' + MONTH_NAMES[b.getMonth()];
    } else {
      range = (a.getDate() === b.getDate() ? a.getDate() + '. ' : a.getDate() + '.–' + b.getDate() + '. ') +
              MONTH_NAMES[b.getMonth()];
    }

    var html = '<div class="week-head"><div class="wk">KW ' + isoWeek(mon) + '<small>' + range + '</small></div>' +
               '<div class="food-note">Mittagessen</div></div>';

    days.forEach(function (x) {
      var s = shiftOf(x.key);
      var isToday = x.key === todayKey;
      html += '<div class="food-day' + (isToday ? ' today' : '') + '">' +
        '<div class="fd-head">' +
          '<div class="fd-date">' + DAY_LONG[x.date.getDay()] +
            '<small>' + pad(x.date.getDate()) + '.' + pad(x.date.getMonth() + 1) + '.</small>' +
            (isToday ? '<span class="fd-badge">Heute</span>' : '') + '</div>' +
          '<button type="button" class="fd-shift ' + s.cls + '" data-key="' + x.key + '"' +
            ' aria-label="' + escapeHtml(s.aria) + ' – antippen zum Ändern">' + escapeHtml(s.txt) + '</button>' +
        '</div>' +
        menusHtml(x.menu, foodFilter) +
        '</div>';
    });

    var block = document.createElement('div');
    block.className = 'week-block';
    block.innerHTML = html;
    // Das Essen steht hier schon da – der Dienst-Knopf führt gleich zu den Einstellungen
    block.querySelectorAll('.fd-shift').forEach(function (btn) {
      btn.addEventListener('click', function () { openModal(btn.getAttribute('data-key'), 1); });
    });
    return block;
  }

  // Beim Öffnen der Ansicht gleich zum heutigen Tag springen
  function scrollToFoodToday() {
    var el = foodView.querySelector('.food-day.today');
    if (!el || !el.scrollIntoView) return;
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'center' });
  }

  // Im Tages-Fenster: was es an dem Tag zu Mittag gibt – liefert,
  // ob es überhaupt eine Essens-Seite gibt
  function renderModalFood(key) {
    var box = document.getElementById('mFood');
    var day = foodOf(key);
    box.innerHTML = day
      ? '<div class="mf-title">Mittagessen im Haus</div>' + menusHtml(day, '') +
        '<button type="button" class="m-next">Wischen für die Tageseinstellungen<span aria-hidden="true">›</span></button>'
      : '';
    return !!day;
  }

  /* ---------- Modal ---------- */

  var overlay = document.getElementById('overlay');
  var fVon = document.getElementById('fVon');
  var fBis = document.getElementById('fBis');
  var fPause = document.getElementById('fPause');
  var fArt = document.getElementById('fArt');
  var fStd = document.getElementById('fStd');
  var fNeutral = document.getElementById('fNeutral');
  var tagPicker = document.getElementById('tagPicker');
  var lastFocus = null;

  /* ---------- Wisch-Ansicht im Tages-Fenster ----------
     Seite 0 ist das Essen, Seite 1 die Tageseinstellungen. Das
     Wischen selbst macht der Browser (Scroll-Snap); hier wird nur
     die Höhe mitgeführt, damit das Fenster nicht so hoch bleibt
     wie die längere Seite, und der Reiter oben nachgezogen.     */

  var modal = document.getElementById('modal');
  var mPager = document.getElementById('mPager');
  var mPages = [document.getElementById('mFood'), document.getElementById('mDay')];
  var mTabs = document.getElementById('mTabs');
  var tabBtns = mTabs.querySelectorAll('[role="tab"]');
  var hasFoodPage = false;
  var curPage = -1;
  var pagerW = 0;

  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  // 0 = Essen, 1 = Einstellungen, dazwischen mitten im Wischen
  function pagerPos() {
    var w = mPager.clientWidth;
    return w ? Math.max(0, Math.min(1, mPager.scrollLeft / w)) : 0;
  }

  function markPage(p) {
    curPage = p;
    tabBtns.forEach(function (b, i) {
      b.classList.toggle('active', i === p);
      b.setAttribute('aria-selected', i === p ? 'true' : 'false');
      b.tabIndex = i === p ? 0 : -1;
    });
  }

  function fitPager() {
    pagerW = mPager.clientWidth;
    if (!hasFoodPage) { mPager.style.height = ''; return; }
    var pos = pagerPos();
    var h0 = mPages[0].offsetHeight, h1 = mPages[1].offsetHeight;
    mPager.style.height = Math.round(h0 + (h1 - h0) * pos) + 'px';
    mTabs.style.setProperty('--pos', pos.toFixed(3));
    var p = Math.round(pos);
    if (p !== curPage) markPage(p);
  }

  function showPage(p, smooth) {
    var left = p * mPager.clientWidth;
    if (smooth && !reducedMotion() && mPager.scrollTo) {
      try { mPager.scrollTo({ left: left, behavior: 'smooth' }); return; } catch (e) {}
    }
    mPager.scrollLeft = left;
    fitPager();
  }

  // Andere Art des Tages, gedrehtes Handy … die Höhe zieht mit. Ist das
  // Fenster breiter oder schmäler geworden, wird neu eingerastet.
  function refitPager() {
    if (!overlay.classList.contains('open')) return;
    if (hasFoodPage && curPage > -1 && mPager.clientWidth !== pagerW) showPage(curPage, false);
    else fitPager();
  }

  mPager.addEventListener('scroll', fitPager, { passive: true });
  window.addEventListener('resize', refitPager);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(refitPager);
    mPages.forEach(function (el) { ro.observe(el); });
  }

  tabBtns.forEach(function (b) {
    b.addEventListener('click', function () { showPage(+b.getAttribute('data-page'), true); });
  });
  // Pfeiltasten auf den Reitern
  mTabs.addEventListener('keydown', function (ev) {
    if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
    ev.preventDefault();
    var p = ev.key === 'ArrowLeft' ? 0 : 1;
    showPage(p, true);
    tabBtns[p].focus();
  });
  // "Wischen für die Tageseinstellungen" lässt sich auch antippen
  mPages[0].addEventListener('click', function (ev) {
    var t = ev.target.closest && ev.target.closest('.m-next');
    if (t) showPage(1, true);
  });

  function buildTagPicker() {
    tagPicker.innerHTML = '';
    person().tags.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('data-tag', t);
      b.textContent = t;
      b.addEventListener('click', function () {
        var i = editTags.indexOf(t);
        if (i > -1) editTags.splice(i, 1); else editTags.push(t);
        b.classList.toggle('on', i === -1);
      });
      tagPicker.appendChild(b);
    });
  }
  buildTagPicker();

  // Pausenwerte, die nicht in der Liste stehen, trotzdem anbieten
  function setPause(v) {
    var val = String(v);
    if (!Array.prototype.some.call(fPause.options, function (o) { return o.value === val; })) {
      var opt = document.createElement('option');
      opt.value = val;
      opt.textContent = fmtHm(parseFloat(val) || 0) + ' Std.';
      fPause.appendChild(opt);
    }
    fPause.value = val;
  }

  function syncArtFields() {
    var isDienst = fArt.value === 'dienst';
    document.getElementById('dienstFields').style.display = isDienst ? '' : 'none';
    document.getElementById('artFields').style.display = isDienst ? 'none' : '';
    document.getElementById('mCalcSub').textContent = isDienst
      ? 'Arbeitszeit abzüglich Pause'
      : 'angerechnete Stunden';
    updatePreview();
    refitPager();
  }

  // page: 0 = mit dem Essen beginnen (Standard), 1 = gleich die Einstellungen
  function openModal(key, page) {
    editKey = key;
    lastFocus = document.activeElement;
    var parts = key.split('-');
    var date = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    var e = getEntry(key);
    var def = person().defaults;

    document.getElementById('mTitle').textContent =
      DAY_LONG[date.getDay()] + ', ' + (+parts[2]) + '. ' + MONTH_NAMES[date.getMonth()] + ' ' + parts[0];
    var raw = rawEntry(key);
    var sub = e
      ? (e.custom ? 'Von Hand eingetragen' : 'Laut Dienstplan')
      : (raw && raw.frei ? 'Von Hand freigestellt' : 'Dienstfrei – trage hier einen Dienst ein');
    if (raw && raw.neutral) sub += ' · zählt nicht aufs Konto';
    document.getElementById('mSub').textContent = sub;

    fArt.value = e && e.art ? e.art : 'dienst';
    if (fArt.value !== 'dienst' && !ART_LABELS[fArt.value]) fArt.value = 'dienst';

    fVon.value = e && !e.art ? e.von : def.von;
    fBis.value = e && !e.art ? e.bis : def.bis;
    setPause(e && !e.art ? e.pause : def.pause);
    fStd.value = numField(e && e.art ? e.h : 0);

    fNeutral.checked = !!(raw && raw.neutral);

    editTags = e && !e.art ? e.tags.slice() : [];
    tagPicker.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('on', editTags.indexOf(b.getAttribute('data-tag')) > -1);
    });

    renderMeta(key);
    renderModalTeam(key);
    hasFoodPage = renderModalFood(key);
    modal.classList.toggle('has-food', hasFoodPage);
    syncArtFields();
    overlay.classList.add('open');
    modal.scrollTop = 0;

    // Erst jetzt ist das Fenster sichtbar und hat eine Breite.
    // Ohne Essen sind die Einstellungen die einzige Seite und stehen ganz links.
    var foodFirst = hasFoodPage && page !== 1;
    curPage = -1;
    showPage(hasFoodPage && !foodFirst ? 1 : 0, false);

    if (foodFirst) tabBtns[0].focus({ preventScroll: true });
    else document.getElementById('mSave').focus();
  }

  // Über den Reitern: wer von den Kollegen an dem Tag mit welcher Zeit da
  // ist, darunter Urlaub und sonstige Vermerke aus dem Plan
  function renderModalTeam(key) {
    var box = document.getElementById('mTeam');
    if (!teamHasMonth(key.slice(0, 7))) { box.hidden = true; box.innerHTML = ''; return; }

    var tm = teamOf(key);
    var html = '<div class="mt-title">Kollegen im Dienst</div>';
    html += tm.da.length
      ? '<div class="mt-list">' + tm.da.map(function (k) {
          return '<span class="mt-k" title="' + escapeHtml(k.name) + '"><b>' + escapeHtml(k.kurz) + '</b>' +
                 escapeHtml(k.von) + '–' + escapeHtml(k.bis) + '</span>';
        }).join('') + '</div>'
      : '<div class="mt-none">Laut Plan ist niemand eingeteilt.</div>';

    var notes = [];
    var byTxt = {};
    tm.sonst.forEach(function (k) { (byTxt[k.txt] = byTxt[k.txt] || []).push(k.kurz); });
    Object.keys(byTxt).forEach(function (t) { notes.push(t + ': ' + byTxt[t].join(', ')); });
    if (tm.urlaub.length) notes.push('Urlaub: ' + tm.urlaub.map(function (k) { return k.kurz; }).join(', '));
    if (notes.length) html += '<div class="mt-note">' + escapeHtml(notes.join(' · ')) + '</div>';

    box.innerHTML = html;
    box.hidden = false;
  }

  // Zeigt, wer den Tag zuletzt geändert hat – plus Knopf zum Zurücksetzen.
  // Gilt auch für freigestellte Tage, die ja ebenfalls eine Änderung sind.
  function renderMeta(key) {
    var box = document.getElementById('mMeta');
    var raw = rawEntry(key);
    if (!raw) { box.innerHTML = ''; return; }

    var txt = raw.frei ? 'Freigestellt' : 'Geändert';
    if (raw.by) txt += ' von ' + raw.by;
    if (raw.ts) {
      txt += ' am ' + new Date(raw.ts).toLocaleString('de-AT', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
      });
    }
    box.innerHTML = escapeHtml(txt) + '<br><button type="button" id="mRevert">Änderung zurücknehmen</button>';
    document.getElementById('mRevert').addEventListener('click', function () { revertDay(key); });
  }

  function closeModal() {
    if (!overlay.classList.contains('open')) return;
    overlay.classList.remove('open');
    editKey = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }

  function updatePreview() {
    var h = fArt.value === 'dienst'
      ? hoursOf({ von: fVon.value, bis: fBis.value, pause: parseFloat(fPause.value) || 0 })
      : Math.max(0, parseNum(fStd.value) || 0);
    document.getElementById('mCalc').textContent =
      fmtMode === 'hm' ? fmtHm(h) + ' Std.' : fmtDec(h) + ' h';
  }

  [fVon, fBis, fPause, fStd].forEach(function (el) {
    el.addEventListener('input', updatePreview);
    el.addEventListener('change', updatePreview);
  });
  fArt.addEventListener('change', syncArtFields);

  document.getElementById('mSave').addEventListener('click', function () {
    if (!editKey) return;
    var val;

    if (fArt.value === 'dienst') {
      if (!fVon.value || !fBis.value) { alert('Bitte Von- und Bis-Zeit angeben.'); return; }
      val = {
        von: fVon.value,
        bis: fBis.value,
        pause: parseFloat(fPause.value) || 0,
        tags: editTags.slice()
      };
      if (hoursOf(val) <= 0) {
        if (!confirm('Damit ergibt der Tag 0 Stunden. Trotzdem speichern?')) return;
      }
    } else {
      var h = parseNum(fStd.value);
      if (!isFinite(h) || h < 0 || h > 24) { alert('Bitte gültige Stunden zwischen 0 und 24 angeben.'); return; }
      val = { art: fArt.value, h: Math.round(h * 100) / 100 };
    }

    // Ausdrücklich als "zählt nicht" markierte Tage bewegen das
    // Überstunden-Konto nicht – der Rechenkern setzt ihr Soll aufs Ist.
    if (fNeutral.checked) val.neutral = true;

    if (!userName && firebaseReady) askName();   // damit die Familie sieht, wer geändert hat
    val.by = userName || 'unbekannt';
    val.ts = Date.now();

    var key = editKey;
    closeModal();
    Store.set(key, val);
    render();
  });

  document.getElementById('mDelete').addEventListener('click', function () {
    if (!editKey) return;
    if (!userName && firebaseReady) askName();
    var key = editKey;
    var val = { frei: true, by: userName || 'unbekannt', ts: Date.now() };
    // Auch ein freigestellter Tag kann "zählt nicht" sein – sonst würde
    // ein gestrichener Dienst als Minusstunden im Konto landen.
    if (fNeutral.checked) val.neutral = true;
    closeModal();
    Store.set(key, val);
    render();
  });

  // Einzelnen Tag auf den gedruckten Dienstplan zurücksetzen
  function revertDay(key) {
    closeModal();
    Store.remove(key);
    render();
  }

  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('mClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeModal(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeModal(); });

  /* ---------- Navigation & Aktionen ---------- */

  document.getElementById('prevBtn').addEventListener('click', function () {
    curM--; if (curM < 0) { curM = 11; curY--; } render();
  });
  document.getElementById('nextBtn').addEventListener('click', function () {
    curM++; if (curM > 11) { curM = 0; curY++; } render();
  });
  document.getElementById('todayBtn').addEventListener('click', function () {
    curY = today.getFullYear(); curM = today.getMonth(); render();
    if (mode === 'food') scrollToFoodToday();
  });

  var btnCal = document.getElementById('viewCal');
  var btnList = document.getElementById('viewList');
  var btnFood = document.getElementById('viewFood');

  // Kalender, Liste oder Essen – "Essen" nur, wenn es einen Plan gibt
  function applyMode(m) {
    if (m === 'food' && !foodPlan()) m = 'cal';
    mode = m;
    btnCal.classList.toggle('active', m === 'cal');
    btnList.classList.toggle('active', m === 'list');
    btnFood.classList.toggle('active', m === 'food');
    document.getElementById('calendarView').style.display = m === 'cal' ? '' : 'none';
    listView.style.display = m === 'list' ? '' : 'none';
    foodView.style.display = m === 'food' ? '' : 'none';
  }
  btnCal.addEventListener('click', function () { applyMode('cal'); render(); });
  btnList.addEventListener('click', function () { applyMode('list'); render(); });
  btnFood.addEventListener('click', function () {
    var again = mode === 'food';
    applyMode('food');
    render();
    if (!again) scrollToFoodToday();
  });

  var btnDec = document.getElementById('fmtDec');
  var btnHm = document.getElementById('fmtHm');
  function setFmt(m) {
    fmtMode = m;
    try { localStorage.setItem(FMT_KEY, m); } catch (e) {}
    btnDec.classList.toggle('active', m === 'dec');
    btnHm.classList.toggle('active', m === 'hm');
    render();
    if (overlay.classList.contains('open')) updatePreview();
  }
  btnDec.addEventListener('click', function () { setFmt('dec'); });
  btnHm.addEventListener('click', function () { setFmt('hm'); });

  document.getElementById('resetBtn').addEventListener('click', function () {
    var who = person().fullName;
    var warn = 'Alle Änderungen bei ' + who + ' verwerfen und den Original-Dienstplan wiederherstellen?';
    if (firebaseReady) warn += '\n\nAchtung: Das gilt für alle in der Familie, nicht nur für dieses Gerät.';
    if (!confirm(warn)) return;
    Store.clear();
    render();
  });

  /* ---------- ICS-Export ---------- */

  function icsEscape(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  }
  function icsStamp(d) {
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
           pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  }

  document.getElementById('icsBtn').addEventListener('click', function () {
    var days = monthDays(curY, curM).filter(function (x) { return !!x.entry; });
    if (!days.length) { alert('In diesem Monat gibt es keine Dienste zum Exportieren.'); return; }

    var p = person();
    var stamp = icsStamp(new Date());
    var lines = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Nessie-Hub//Dienstplan//DE', 'CALSCALE:GREGORIAN',
      'X-WR-CALNAME:' + icsEscape('Dienstplan ' + p.fullName)
    ];

    days.forEach(function (x) {
      var dt = x.key.replace(/-/g, '');
      lines.push('BEGIN:VEVENT',
        'UID:' + dt + '-' + p.id + '@nessie-hub',
        'DTSTAMP:' + stamp);

      if (x.entry.art) {
        // Ganztägig: DTEND ist im ICS-Format exklusiv, also der Folgetag
        var next = new Date(curY, curM, x.d + 1);
        lines.push(
          'DTSTART;VALUE=DATE:' + dt,
          'DTEND;VALUE=DATE:' + keyOf(next.getFullYear(), next.getMonth(), next.getDate()).replace(/-/g, ''),
          'SUMMARY:' + icsEscape(artLabel(x.entry.art) + ' – ' + p.label),
          'DESCRIPTION:' + icsEscape(fmtDec(x.hours) + ' h angerechnet')
        );
      } else {
        lines.push(
          'DTSTART:' + dt + 'T' + x.entry.von.replace(':', '') + '00',
          'DTEND:' + dt + 'T' + x.entry.bis.replace(':', '') + '00',
          'SUMMARY:' + icsEscape('Dienst ' + p.label + (x.entry.tags.length ? ' (' + x.entry.tags.join(', ') + ')' : '')),
          'DESCRIPTION:' + icsEscape(fmtDec(x.hours) + ' h' +
            (x.entry.pause > 0 ? ', ' + fmtDec(x.entry.pause) + ' h unbezahlte Pause' : ''))
        );
      }
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');

    var blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'dienstplan-' + p.id + '-' + curY + '-' + pad(curM + 1) + '.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  /* ---------- Start ---------- */

  onChange = render;
  paintTabs();
  setFmt(fmtMode);          // rendert bereits mit dem lokalen Stand
  Store.initStatus();
  Store.watch(personId);    // danach live auf die geteilten Daten hören
})();
</script>
</body>
</html>
