<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbeitszeiten</title>
  <meta name="description" content="Dienstplan-Kalender mit allen Arbeitszeiten von Tobias und Daniel.">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1015">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arbeitszeiten">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

    :root {
      color-scheme: dark;
      --bg-color: #0f1015;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.09);
      --accent-1: #6c8cff;
      --accent-2: #00d2ff;
      --free: #6a6f85;
      --danger: #ff5470;
      --ok: #3ddc97;
      --text-main: #ffffff;
      --text-muted: #a0a4b8;

      /* Vermerke / Bereiche aus dem Personaleinsatzplan */
      --t-klub: #00d2ff;
      --t-seminar: #ffb454;
      --t-hw: #3ddc97;
      --t-n1: #6c8cff;
      --t-n2: #c792ea;
      --t-tx: #ff9f6e;
      --t-custom: #ff79c6;
      --t-other: #a0a4b8;

      /* Abwesenheits-Arten */
      --a-feiertag: #ffd166;
      --a-urlaub: #4ecdc4;
      --a-zeitausgleich: #9aa0b5;
      --a-fortbildung: #ffb454;
      --a-krank: #ff5470;
      --a-sonderurlaub: #7fd1ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(108, 140, 255, 0.16), transparent 30%),
        radial-gradient(circle at 85% 40%, rgba(0, 210, 255, 0.12), transparent 28%);
      background-attachment: fixed;
      overflow-x: hidden;
      padding-bottom: 40px;
    }

    /* ---------- Nav ---------- */
    .top-nav {
      width: 100%;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-nav a.home {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      transition: background 0.2s;
      white-space: nowrap;
    }
    .top-nav a.home:hover { background: rgba(255, 255, 255, 0.1); }

    .nav-title {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 14px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); }
    .icon-btn:active { transform: scale(0.94); }
    :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

    .container { max-width: 1000px; margin: 0 auto; padding: 24px 16px 0; }

    /* ---------- Personen-Tabs ---------- */
    .person-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 6px;
      margin-bottom: 16px;
    }
    .person-tab {
      background: transparent;
      border: none;
      border-radius: 15px;
      padding: 10px 12px;
      font-family: inherit;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      line-height: 1.2;
    }
    .person-tab .pt-name { font-size: 1rem; font-weight: 700; }
    .person-tab .pt-sub { font-size: 0.72rem; font-weight: 300; opacity: 0.85; }
    .person-tab:hover { background: rgba(255,255,255,0.06); color: var(--text-main); }
    .person-tab.active {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #0f1015;
    }
    .person-tab.active .pt-sub { opacity: 0.75; }

    /* ---------- Sync-Leiste ---------- */
    .sync-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      font-size: 0.82rem;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-muted);
      font-weight: 600;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 13px;
      border-radius: 20px;
    }
    .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--free); flex-shrink: 0; }
    .status.live i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .status.live { color: var(--ok); }
    .status.err i { background: var(--danger); }
    .status.err { color: var(--danger); }

    .name-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .name-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-main); }

    .notice {
      background: rgba(255, 84, 112, 0.12);
      border: 1px solid rgba(255, 84, 112, 0.3);
      color: #ff9db0;
      border-radius: 14px;
      padding: 11px 14px;
      margin-bottom: 16px;
      font-size: 0.88rem;
      font-weight: 300;
      line-height: 1.5;
    }

    /* ---------- Monatskopf ---------- */
    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .month-name { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
    .month-name span { color: var(--text-muted); font-weight: 300; margin-left: 6px; }

    /* ---------- Statistik ---------- */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 12px;
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .stat .val { font-size: 1.5rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat .lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; font-weight: 300; }
    .stat .val.pos { color: var(--ok); }
    .stat .val.neg { color: var(--danger); }

    /* ---------- Umschalter ---------- */
    .switch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .view-switch {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 5px;
      width: fit-content;
    }
    .view-switch button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-switch button.active {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #0f1015;
    }
    .view-switch.small button { font-size: 0.82rem; padding: 7px 13px; }

    /* ---------- Kalender ---------- */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .weekdays div {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day {
      position: relative;
      min-height: 92px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 8px 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
      overflow: hidden;
      font: inherit;
      color: inherit;
      text-align: center;
      width: 100%;
    }
    .day:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.25); }
    .day.empty { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
    .day.weekend { background: rgba(255,255,255,0.015); }
    .day.today { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2), 0 0 18px rgba(0,210,255,0.2); }
    .day.work { background: linear-gradient(160deg, rgba(108,140,255,0.16), rgba(0,210,255,0.05)); }
    .day.special { background: linear-gradient(160deg, rgba(255,255,255,0.11), rgba(255,255,255,0.03)); }

    .day .dnum { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    .day.work .dnum, .day.special .dnum { color: var(--text-main); }
    .day .time { font-size: 0.72rem; font-weight: 600; line-height: 1.25; }
    .day .art { font-size: 0.68rem; font-weight: 600; line-height: 1.2; margin-top: 2px; }
    .day .hrs {
      font-size: 0.95rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .day .free-lbl { font-size: 0.7rem; color: var(--free); font-weight: 300; margin-top: auto; margin-bottom: 6px; }

    .dots { display: flex; gap: 4px; margin-top: 3px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: var(--t-other); }
    .dot.klub { background: var(--t-klub); }
    .dot.seminar { background: var(--t-seminar); }
    .dot.hw { background: var(--t-hw); }
    .dot.n1 { background: var(--t-n1); }
    .dot.n2 { background: var(--t-n2); }
    .dot.tx { background: var(--t-tx); }
    .dot.custom { background: var(--t-custom); }

    /* ---------- Listenansicht ---------- */
    .week-block {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 6px 16px 12px;
      margin-bottom: 14px;
    }
    .week-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 10px 0 8px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 4px;
    }
    .week-head .wk { font-weight: 600; font-size: 0.95rem; }
    .week-head .wk small { color: var(--text-muted); font-weight: 300; margin-left: 6px; }
    .week-head .sum { font-weight: 800; color: var(--accent-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      width: 100%;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      font: inherit;
      color: inherit;
      text-align: left;
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: rgba(255,255,255,0.03); }
    .row .rdate { width: 74px; flex-shrink: 0; font-weight: 600; font-size: 0.9rem; }
    .row .rdate small { display: block; color: var(--text-muted); font-weight: 300; font-size: 0.75rem; }
    .row .rtime { flex-grow: 1; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
    .row .rtime .muted { color: var(--free); font-weight: 300; }
    .row .rhrs { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .chip {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 8px;
      margin-left: 6px;
      vertical-align: middle;
      color: var(--t-other);
      border: 1px solid currentColor;
      background: rgba(255,255,255,0.05);
    }
    .chip.klub { color: var(--t-klub); }
    .chip.seminar { color: var(--t-seminar); }
    .chip.hw { color: var(--t-hw); }
    .chip.n1 { color: var(--t-n1); }
    .chip.n2 { color: var(--t-n2); }
    .chip.tx { color: var(--t-tx); }
    .chip.custom { color: var(--t-custom); }

    .empty-hint {
      text-align: center;
      color: var(--text-muted);
      font-weight: 300;
      padding: 50px 20px;
      line-height: 1.6;
    }

    /* ---------- Legende / Footer-Aktionen ---------- */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin: 24px 0 10px;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 300;
    }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .legend .dot { width: 9px; height: 9px; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
    .actions button, .actions .action-link {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .actions button:hover, .actions .action-link:hover { background: rgba(255,255,255,0.08); color: var(--text-main); }
    .actions .action-link { text-decoration: none; display: inline-block; }

    /* ---------- Modal ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }
    .overlay.open { display: flex; }

    .modal {
      background: #16171f;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      max-height: 88vh;
      overflow-y: auto;
      animation: pop 0.25s ease-out;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .day:hover { transform: none; }
    }

    .modal h3 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.4px; }
    .modal .sub { color: var(--text-muted); font-weight: 300; margin-bottom: 18px; font-size: 0.92rem; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
    .field input, .field select {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 11px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
    }
    .field input:focus, .field select:focus { outline: none; border-color: var(--accent-1); }
    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; }

    .tag-picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag-picker button {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
    }
    .tag-picker button.on { border-color: var(--accent-2); color: var(--accent-2); background: rgba(0,210,255,0.12); }

    .calc-preview {
      background: rgba(108,140,255,0.1);
      border: 1px solid rgba(108,140,255,0.25);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      margin-bottom: 16px;
    }
    .calc-preview .big { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .calc-preview .small { font-size: 0.78rem; color: var(--text-muted); font-weight: 300; }

    .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
    .btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #0f1015; }
    .btn.ghost { background: rgba(255,255,255,0.06); color: var(--text-main); border: 1px solid var(--card-border); }
    .btn.danger { background: rgba(255,84,112,0.15); color: var(--danger); border: 1px solid rgba(255,84,112,0.35); flex: 0 0 auto; padding: 12px 16px; }

    .modal-meta {
      margin-top: 14px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 300;
    }
    .modal-meta:empty { margin-top: 0; }
    .modal-meta button {
      background: none;
      border: none;
      color: var(--accent-2);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }

    footer { text-align: center; color: var(--text-muted); font-size: 0.85rem; opacity: 0.75; padding: 30px 20px 10px; line-height: 1.5; }

    @media (max-width: 700px) {
      .container { padding: 18px 12px 0; }
      .month-name { font-size: 1.45rem; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .grid, .weekdays { gap: 5px; }
      .day { min-height: 74px; padding: 6px 2px 4px; border-radius: 12px; }
      .day .time { font-size: 0.6rem; }
      .day .art { font-size: 0.58rem; }
      .day .hrs { font-size: 0.85rem; }
      .day .dnum { font-size: 0.78rem; }
      .row .rdate { width: 62px; font-size: 0.85rem; }
      .row .rtime { font-size: 0.88rem; }
      .switch-row { gap: 8px; }
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="index.html" class="home"><span>🏠</span> Hub</a>
    <div class="nav-title">🗓️ Arbeitszeiten</div>
    <button class="icon-btn" id="todayBtn" title="Zum heutigen Monat">Heute</button>
  </div>

  <!-- Firebase (Realtime Database, dieselbe Datenbank wie bei WM Wetten) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Die Dienstpläne selbst – dieselbe Datei nutzt der Überstunden-Rechner -->
  <script src="dienstplan-daten.js"></script>

  <div class="container">

    <div class="person-tabs" id="personTabs" role="tablist" aria-label="Person auswählen"></div>

    <div class="sync-bar">
      <div class="status" id="statusPill"><i></i><span id="statusText">Verbinde …</span></div>
      <button class="name-btn" id="nameBtn">👤 Name festlegen</button>
    </div>

    <div id="noticeArea"></div>

    <div class="month-bar">
      <button class="icon-btn" id="prevBtn" aria-label="Vorheriger Monat">‹</button>
      <div class="month-name" id="monthName">—</div>
      <button class="icon-btn" id="nextBtn" aria-label="Nächster Monat">›</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="val" id="stHours">0</div><div class="lbl">Stunden gesamt</div></div>
      <div class="stat"><div class="val" id="stDays">0</div><div class="lbl">Arbeitstage</div></div>
      <div class="stat"><div class="val" id="stAvg">0</div><div class="lbl">Ø pro Dienst</div></div>
      <div class="stat"><div class="val" id="stDiff">–</div><div class="lbl" id="stDiffLbl">Diff. zum Soll</div></div>
    </div>

    <div class="switch-row">
      <div class="view-switch">
        <button id="viewCal" class="active" type="button">Kalender</button>
        <button id="viewList" type="button">Liste</button>
      </div>
      <div class="view-switch small" title="Anzeige der Stunden">
        <button id="fmtDec" class="active" type="button">7,5 h</button>

  <!-- Detail / Bearbeiten -->
  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <h3 id="mTitle">Tag</h3>

      <div class="field">
        <label for="fArt">Art des Tages</label>
        <select id="fArt">
          <option value="dienst">Dienst</option>
          <option value="feiertag">Feiertag</option>
          <option value="urlaub">Urlaub</option>
          <option value="zeitausgleich">Zeitausgleich</option>
          <option value="fortbildung">Fortbildung</option>
          <option value="sonderurlaub">Sonderurlaub</option>
          <option value="krank">Krank</option>

      <div id="dienstFields">
        <div class="field-row">
          <div class="field">
            <label for="fVon">Von</label>
            <input type="time" id="fVon" step="300">
          </div>
          <div class="field">
            <label for="fBis">Bis</label>
            <input type="time" id="fBis" step="300">
          </div>
        </div>

        <div class="field">
          <label for="fPause">Unbezahlte Pause</label>
          <select id="fPause">
            <option value="0">keine Pause</option>
            <option value="0.25">15 Minuten</option>
            <option value="0.5">30 Minuten</option>
            <option value="0.75">45 Minuten</option>
            <option value="1">1 Stunde</option>
            <option value="1.5">1,5 Stunden</option>
          </select>

          <label>Vermerk / Bereich</label>
          <div class="tag-picker" id="tagPicker"></div>
        </div>

      <div id="artFields" style="display:none">
        <div class="field">
          <label for="fStd">Angerechnete Stunden</label>
          <input type="number" id="fStd" min="0" max="24" step="0.05" value="0">
        </div>

      <div class="modal-actions">
        <button class="btn ghost" id="mCancel" type="button">Schließen</button>
        <button class="btn danger" id="mDelete" type="button" title="Tag als frei markieren">Frei</button>
        <button class="btn primary" id="mSave" type="button">Speichern</button>
      </div>

      <div class="modal-meta" id="mMeta"></div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* =========================================================
     DIENSTPLÄNE
     ---------------------------------------------------------
     Die Pläne selbst stehen in "dienstplan-daten.js" – dort
     werden neue Monate eingetragen. Der Überstunden-Rechner
     liest dieselbe Datei, damit beide Seiten gleich rechnen.
     ========================================================= */

  var PEOPLE = (window.NESSIE_DIENSTPLAN && window.NESSIE_DIENSTPLAN.people) || [];

  if (!PEOPLE.length) {
    document.getElementById('noticeArea').innerHTML =
      '<div class="notice">Die Dienstplan-Daten konnten nicht geladen werden ' +
      '(dienstplan-daten.js fehlt oder wurde blockiert). Bitte die Seite neu laden.</div>';
    return;
  }

  /* =========================================================
     FIREBASE – dieselbe Realtime Database wie "WM Wetten",
     aber komplett eigene Tabellen: die Tipps liegen unter
     "bets/", dieser Dienstplan unter "dienstplan/<person>/".
     Die beiden Apps kommen sich also nicht in die Quere.
     ========================================================= */
  var FIREBASE_CONFIG = {
    databaseURL: 'https://wm-tippspiel-d4f4f-default-rtdb.europe-west1.firebasedatabase.app',
    projectId: 'wm-tippspiel-d4f4f'
  };
  var DB_ROOT   = 'dienstplan';          // neue Tabelle, getrennt von "bets"
  var DB_LEGACY = 'arbeitszeiten';       // Vorgänger-Tabelle (nur Tobias)

  var NAME_KEY   = 'nessie_dienstplan_name';
  var PERSON_KEY = 'nessie_dienstplan_person';
  var FMT_KEY    = 'nessie_dienstplan_format';
  var MIGR_KEY   = 'nessie_dienstplan_migrated';
  function localKey(pid) { return 'nessie_dienstplan_' + pid; }

  var MONTH_NAMES = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  var DAY_NAMES = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  var DAY_LONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

  var ART_LABELS = {
    feiertag: 'Feiertag',
    urlaub: 'Urlaub',
    zeitausgleich: 'Zeitausgleich',
    fortbildung: 'Fortbildung',
    krank: 'Krank',
    sonderurlaub: 'Sonderurlaub'
  };
  // Nur diese Kürzel bekommen eine eigene Farbe – alles andere wird grau
  var KNOWN_TAGS = ['klub','seminar','hw','n1','n2','tx','custom'];

  /* ---------- Kleine Helfer ---------- */

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Aus einem beliebigen (auch fremden) Vermerk eine sichere CSS-Klasse machen
  function tagClass(t) {
    var slug = String(t).toLowerCase().replace(/[^a-z0-9]/g, '');
    return KNOWN_TAGS.indexOf(slug) > -1 ? slug : 'other';
  }

  function showNotice(msg) {
    document.getElementById('noticeArea').innerHTML =
      '<div class="notice">' + escapeHtml(msg) + '</div>';
  }
  function clearNotice() { document.getElementById('noticeArea').innerHTML = ''; }

  function setStatus(state, text) {
    document.getElementById('statusPill').className = 'status' + (state ? ' ' + state : '');
    document.getElementById('statusText').textContent = text;
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function keyOf(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function monthKeyOf(y, m) { return y + '-' + pad(m + 1); }

  function toMinutes(t) {
    var p = String(t).split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }

  // Netto-Stunden eines Eintrags (Dienst über Mitternacht wird mitgerechnet)
  function hoursOf(e) {
    if (!e) return 0;
    if (e.art) return Math.max(0, parseFloat(e.h) || 0);
    if (!e.von || !e.bis) return 0;
    var diff = toMinutes(e.bis) - toMinutes(e.von);
    if (diff < 0) diff += 24 * 60;
    return Math.max(0, diff / 60 - (parseFloat(e.pause) || 0));
  }

  /* ---------- Stundenformat: 7,5 h  oder  7:30 ---------- */

  var fmtMode = 'dec';
  try { fmtMode = localStorage.getItem(FMT_KEY) === 'hm' ? 'hm' : 'dec'; } catch (e) {}

  function fmtDec(n) {
    var s = (Math.round(n * 100) / 100).toFixed(2).replace('.', ',');
    return s.replace(/,00$/, '').replace(/(,\d)0$/, '$1');
  }
  function fmtHm(n) {
    var sign = n < 0 ? '−' : '';
    var mins = Math.round(Math.abs(n) * 60);
    return sign + Math.floor(mins / 60) + ':' + pad(mins % 60);
  }
  // Stundenwert in der gewählten Anzeige – "h" nur im Dezimalmodus,
  // damit aus "7:30 h" kein Zeitpunkt gelesen wird.
  function fmtH(n) { return fmtMode === 'hm' ? fmtHm(n) : fmtDec(n) + ' h'; }
  function fmtSigned(n) {
    var pre = n > 0.001 ? '+' : n < -0.001 ? '−' : '±';
    return fmtMode === 'hm' ? pre + fmtHm(Math.abs(n)) : pre + fmtDec(Math.abs(n));
  }

  /* ---------- Firebase starten ---------- */

  var db = null, firebaseReady = false;
  try {
    if (typeof firebase !== 'undefined' && FIREBASE_CONFIG.databaseURL) {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      firebaseReady = true;
    }
  } catch (e) {
    console.warn('Firebase konnte nicht gestartet werden:', e);
  }

  /* ---------- Zustand ---------- */

  var today = new Date();
  var todayKey = keyOf(today.getFullYear(), today.getMonth(), today.getDate());

  var personId = PEOPLE[0].id;
  try {
    var savedPid = localStorage.getItem(PERSON_KEY);
    if (savedPid && PEOPLE.some(function (p) { return p.id === savedPid; })) personId = savedPid;
  } catch (e) {}

  function person() {
    for (var i = 0; i < PEOPLE.length; i++) if (PEOPLE[i].id === personId) return PEOPLE[i];
    return PEOPLE[0];
  }

  // Abweichungen vom gedruckten Plan – je Person ein eigener Topf
  var overridesByPerson = {};
  PEOPLE.forEach(function (p) { overridesByPerson[p.id] = loadLocal(p.id); });
  function overrides() { return overridesByPerson[personId]; }

  function loadLocal(pid) {
    try { return JSON.parse(localStorage.getItem(localKey(pid))) || {}; }
    catch (e) { return {}; }
  }
  function saveLocal(pid) {
    try { localStorage.setItem(localKey(pid), JSON.stringify(overridesByPerson[pid])); } catch (e) {}
  }

  // Einträge der Vorgänger-Versionen (nur Tobias, ohne Personen-Trennung) übernehmen
  (function migrateLocal() {
    try {
      var t = PEOPLE[0].id;
      if (localStorage.getItem(localKey(t))) return;
      var old = localStorage.getItem('nessie_arbeitszeiten_v2') || localStorage.getItem('nessie_arbeitszeiten_v1');
      if (!old) return;
      var o = JSON.parse(old) || {};
      Object.keys(o).forEach(function (k) {
        overridesByPerson[t][k] = o[k] ? o[k] : { frei: true };   // in v1 hieß "frei" noch null
      });
      saveLocal(t);
    } catch (e) {}
  })();

  var curY, curM;
  setStartMonth();
  function setStartMonth() {
    // Aktueller Monat, wenn es dafür Daten gibt – sonst der erste Monat des Plans
    var p = person();
    var mk = monthKeyOf(today.getFullYear(), today.getMonth());
    var hasCurrent = Object.keys(p.plan).some(function (k) { return k.indexOf(mk) === 0; });
    if (hasCurrent) { curY = today.getFullYear(); curM = today.getMonth(); return; }
    var keys = Object.keys(p.plan).sort();
    if (keys.length) {
      curY = +keys[0].slice(0, 4);
      curM = +keys[0].slice(5, 7) - 1;
    } else {
      curY = today.getFullYear(); curM = today.getMonth();
    }
  }

  var mode = 'cal';
  var editKey = null;
  var editTags = [];

  // Liefert den Eintrag eines Tages oder null (= dienstfrei)
  function getEntry(key) {
    var o = overrides()[key];
    if (o) {
      if (o.frei) return null;
      if (o.art) {
        return { art: o.art, h: parseFloat(o.h) || 0, tags: [], custom: true, by: o.by || '', ts: o.ts || 0 };
      }
      return {
        von: o.von, bis: o.bis, pause: parseFloat(o.pause) || 0,
        tags: Array.isArray(o.tags) ? o.tags.slice() : [],
        custom: true, by: o.by || '', ts: o.ts || 0
      };
    }
    if (o === null) return null;                 // Altbestand: null bedeutete "frei"
    var p = person().plan[key];
    if (!p) return null;
    if (p.art) return { art: p.art, h: p.h, tags: [], custom: false };
    return { von: p.von, bis: p.bis, pause: p.pause, tags: (p.tags || []).slice(), custom: false };
  }

  /* ---------- Speicher-Schicht: Firebase, sonst nur lokal ---------- */

  var entriesRef = null;
  var readFailed = false;
  var onChange = function () {};

  var Store = {
    // Verbindungsanzeige – wird nur einmal aufgesetzt
    initStatus: function () {
      if (!firebaseReady) { setStatus('', 'Nur auf diesem Gerät'); return; }
      setStatus('', 'Verbinde …');
      db.ref('.info/connected').on('value', function (snap) {
        if (readFailed) return;          // Lesefehler nicht mit "Live" überschreiben
        if (snap.val() === true) setStatus('live', 'Live – für die Familie sichtbar');
        else setStatus('', 'Offline – wird später abgeglichen');
      });
    },

    // Auf die Einträge der aktuell gewählten Person hören
    watch: function (pid) {
      if (!firebaseReady) { onChange(); return; }
      if (entriesRef) { entriesRef.off(); entriesRef = null; }

      var ref = db.ref(DB_ROOT + '/' + pid + '/entries');
      entriesRef = ref;
      ref.on('value',
        function (snap) {
          if (entriesRef !== ref) return;          // zwischenzeitlich umgeschaltet
          overridesByPerson[pid] = snap.val() || {};
          saveLocal(pid);
          migrateLegacyOnce(pid);
          clearNotice();
          onChange();
        },
        function (err) {
          if (entriesRef !== ref) return;
          firebaseReady = false;
          readFailed = true;
          entriesRef = null;
          setStatus('err', 'Verbindung gestört');
          showNotice('Die geteilte Datenbank ist gerade nicht erreichbar (' + err.message +
                     '). Der Plan wird angezeigt, Änderungen bleiben vorerst auf diesem Gerät.');
          overridesByPerson[pid] = loadLocal(pid);
          onChange();
        }
      );
    },

    set: function (key, val) {
      var pid = personId;
      overridesByPerson[pid][key] = val;
      saveLocal(pid);
      if (!firebaseReady) return Promise.resolve();
      return db.ref(DB_ROOT + '/' + pid + '/entries/' + key).set(val)
        .catch(function (err) { showNotice('Speichern fehlgeschlagen: ' + err.message); });
    },

    remove: function (key) {
      var pid = personId;
      delete overridesByPerson[pid][key];
      saveLocal(pid);
      if (!firebaseReady) return Promise.resolve();
      return db.ref(DB_ROOT + '/' + pid + '/entries/' + key).remove()
        .catch(function (err) { showNotice('Zurücksetzen fehlgeschlagen: ' + err.message); });
    },

    clear: function () {
      var pid = personId;
      overridesByPerson[pid] = {};
      saveLocal(pid);
      if (!firebaseReady) return Promise.resolve();
      return db.ref(DB_ROOT + '/' + pid + '/entries').remove()
        .catch(function (err) { showNotice('Zurücksetzen fehlgeschlagen: ' + err.message); });
    }
  };

  /* Einmalige Übernahme aus der alten Tabelle "arbeitszeiten/entries".
     Die gab es nur für Tobias und ohne Personen-Trennung.            */
  var migrationRunning = false;
  function migrateLegacyOnce(pid) {
    if (pid !== PEOPLE[0].id || !firebaseReady || migrationRunning) return;
    try { if (localStorage.getItem(MIGR_KEY)) return; } catch (e) { return; }
    migrationRunning = true;

    db.ref(DB_LEGACY + '/entries').once('value').then(function (snap) {
      var old = snap.val() || {};
      var target = overridesByPerson[pid];
      Object.keys(old).forEach(function (k) {
        if (target[k] !== undefined) return;        // neuer Stand gewinnt
        var v = old[k] ? old[k] : { frei: true };
        target[k] = v;
        db.ref(DB_ROOT + '/' + pid + '/entries/' + k).set(v);
      });
      try { localStorage.setItem(MIGR_KEY, '1'); } catch (e) {}
      saveLocal(pid);
      onChange();
    }).catch(function () { /* alte Tabelle nicht lesbar – dann eben nicht */ })
      .then(function () { migrationRunning = false; });
  }

  /* ---------- Name (steht bei den eigenen Änderungen) ---------- */

  var userName = '';
  try { userName = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}

  function updateNameBtn() {
    document.getElementById('nameBtn').textContent = userName ? '👤 ' + userName : '👤 Name festlegen';
  }

  function askName() {
    var n = window.prompt('Wie heißt du? Der Name steht dann bei deinen Änderungen.', userName || '');
    if (n === null) return;
    userName = n.trim().slice(0, 24);
    try { localStorage.setItem(NAME_KEY, userName); } catch (e) {}
    updateNameBtn();
  }

  updateNameBtn();
  document.getElementById('nameBtn').addEventListener('click', askName);

  /* ---------- Personen-Tabs ---------- */

  var personTabs = document.getElementById('personTabs');
  PEOPLE.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'person-tab';
    b.setAttribute('role', 'tab');
    b.setAttribute('data-person', p.id);
    b.innerHTML = '<span class="pt-name">' + escapeHtml(p.label) + '</span>' +
                  '<span class="pt-sub">' + escapeHtml(p.lastName) + '</span>';
    b.addEventListener('click', function () { selectPerson(p.id); });
    personTabs.appendChild(b);
  });

  function paintTabs() {
    personTabs.querySelectorAll('.person-tab').forEach(function (b) {
      var on = b.getAttribute('data-person') === personId;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }

  function selectPerson(pid) {
    if (pid === personId) return;
    personId = pid;
    try { localStorage.setItem(PERSON_KEY, pid); } catch (e) {}
    paintTabs();
    buildTagPicker();
    setStartMonth();
    render();
    Store.watch(pid);
  }

  /* ---------- Monatsdaten sammeln ---------- */

  function monthDays(y, m) {
    var days = [], last = new Date(y, m + 1, 0).getDate();
    for (var d = 1; d <= last; d++) {
      var key = keyOf(y, m, d);
      var e = getEntry(key);
      days.push({
        d: d,
        key: key,
        dow: new Date(y, m, d).getDay(),
        entry: e,
        hours: hoursOf(e)
      });
    }
    return days;
  }

  // ISO-Kalenderwoche
  function isoWeek(date) {
    var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }

  /* ---------- Rendering ---------- */

  var grid = document.getElementById('grid');
  var listView = document.getElementById('listView');

  function render() {
    var days = monthDays(curY, curM);

    document.getElementById('monthName').innerHTML =
      MONTH_NAMES[curM] + ' <span>' + curY + '</span>';
    document.getElementById('footerInfo').innerHTML =
      'Dienstplan ' + escapeHtml(person().fullName) + '<br>' + escapeHtml(person().meta);

    renderLegend();
    renderStats(days);
    if (mode === 'cal') renderCalendar(days); else renderList(days);
  }

  function renderLegend() {
    var html = person().tags.map(function (t) {
      return '<span><i class="dot ' + tagClass(t) + '"></i> ' + escapeHtml(t) + '</span>';
    }).join('');
    html += '<span><i class="dot custom"></i> von Hand geändert</span>';
    document.getElementById('legend').innerHTML = html;
  }

  function renderStats(days) {
    var total = 0, workHours = 0, workDays = 0;
    days.forEach(function (x) {
      if (!x.entry) return;
      total += x.hours;
      if (!x.entry.art) { workHours += x.hours; workDays++; }
    });

    document.getElementById('stHours').textContent = fmtH(total);
    document.getElementById('stDays').textContent = workDays;
    document.getElementById('stAvg').textContent = workDays ? fmtH(workHours / workDays) : '–';

    var diffEl = document.getElementById('stDiff');
    var lblEl = document.getElementById('stDiffLbl');
    var soll = person().soll[monthKeyOf(curY, curM)];

    if (soll != null) {
      var diff = total - soll;
      diffEl.textContent = fmtSigned(diff);
      diffEl.className = 'val' + (diff > 0.001 ? ' pos' : diff < -0.001 ? ' neg' : '');
      lblEl.textContent = 'Diff. zu ' + fmtH(soll) + ' Soll';
      return;
    }

    // Ohne Monats-Soll: Schnitt der Wochen, die komplett in diesem Monat liegen
    var avg = fullWeekAverage(days);
    if (avg == null) {
      diffEl.textContent = '–';
      diffEl.className = 'val';
      lblEl.textContent = 'kein Soll hinterlegt';
    } else {
      diffEl.textContent = fmtH(avg);
      diffEl.className = 'val';
      lblEl.textContent = 'Ø pro volle Woche';
    }
  }

  // Nur Wochen zählen, deren Montag bis Sonntag komplett im Monat liegen –
  // sonst würde eine angeschnittene Woche den Schnitt verfälschen.
  function fullWeekAverage(days) {
    var byNum = {};
    days.forEach(function (x) { byNum[x.d] = x; });
    var last = days.length, sums = [];

    for (var d = 1; d <= last; d++) {
      if (byNum[d].dow !== 1) continue;            // Wochenstart = Montag
      if (d + 6 > last) break;                     // Woche ragt in den Folgemonat
      var sum = 0, any = false;
      for (var i = 0; i < 7; i++) {
        sum += byNum[d + i].hours;
        if (byNum[d + i].entry) any = true;
      }
      if (any) sums.push(sum);
    }
    if (!sums.length) return null;
    return sums.reduce(function (a, b) { return a + b; }, 0) / sums.length;
  }

  function dotsFor(entry) {
    var dots = entry.tags.map(function (t) {
      return '<span class="dot ' + tagClass(t) + '" title="' + escapeHtml(t) + '"></span>';
    }).join('');
    if (entry.custom) dots += '<span class="dot custom" title="von Hand geändert"></span>';
    return dots ? '<div class="dots">' + dots + '</div>' : '';
  }

  function artLabel(art) { return ART_LABELS[art] || art; }
  function artColor(art) { return ART_LABELS[art] ? 'var(--a-' + art + ')' : 'var(--text-muted)'; }

  function renderCalendar(days) {
    grid.innerHTML = '';

    // Führende Leerzellen (Woche beginnt Montag)
    var firstDow = new Date(curY, curM, 1).getDay();
    var lead = (firstDow + 6) % 7;
    for (var i = 0; i < lead; i++) {
      var blank = document.createElement('div');
      blank.className = 'day empty';
      grid.appendChild(blank);
    }

    var frag = document.createDocumentFragment();
    days.forEach(function (x) {
      var cell = document.createElement('button');
      cell.type = 'button';
      var cls = 'day';
      if (x.dow === 0 || x.dow === 6) cls += ' weekend';
      if (x.entry) cls += x.entry.art ? ' special' : ' work';
      if (x.key === todayKey) cls += ' today';
      cell.className = cls;

      var html = '<div class="dnum">' + x.d + '</div>';
      if (x.entry && x.entry.art) {
        html += '<div class="art" style="color:' + artColor(x.entry.art) + '">' +
                escapeHtml(artLabel(x.entry.art)) + '</div>';
        html += '<div class="hrs">' + fmtH(x.hours) + '</div>';
        html += dotsFor(x.entry);
      } else if (x.entry) {
        html += '<div class="time">' + escapeHtml(x.entry.von) + '<br>' + escapeHtml(x.entry.bis) + '</div>';
        html += '<div class="hrs">' + fmtH(x.hours) + '</div>';
        html += dotsFor(x.entry);
      } else {
        html += '<div class="free-lbl">frei</div>';
      }
      cell.innerHTML = html;
      cell.setAttribute('aria-label',
        x.d + '. ' + MONTH_NAMES[curM] + ' – ' +
        (x.entry ? (x.entry.art ? artLabel(x.entry.art) : x.entry.von + ' bis ' + x.entry.bis) : 'frei'));
      cell.addEventListener('click', function () { openModal(x.key); });
      frag.appendChild(cell);
    });
    grid.appendChild(frag);
  }

  function renderList(days) {
    listView.innerHTML = '';
    if (!days.some(function (x) { return !!x.entry; })) {
      listView.innerHTML = '<div class="empty-hint">Für diesen Monat sind keine Arbeitszeiten hinterlegt.<br>' +
        'Tippe im Kalender auf einen Tag, um einen Dienst einzutragen.</div>';
      return;
    }

    // Nach Kalenderwoche gruppieren (neue Gruppe an jedem Montag)
    var weeks = [], cur = null;
    days.forEach(function (x) {
      if (!cur || x.dow === 1) { cur = { days: [], sum: 0 }; weeks.push(cur); }
      cur.days.push(x);
      cur.sum += x.hours;
    });

    weeks.forEach(function (w) {
      var used = w.days.filter(function (x) { return !!x.entry; });
      if (!used.length) return;

      var block = document.createElement('div');
      block.className = 'week-block';

      var first = w.days[0], last = w.days[w.days.length - 1];
      var range = (first.d === last.d ? first.d + '.' : first.d + '.–' + last.d + '.') + ' ' + MONTH_NAMES[curM];
      // Am Monatsanfang/-ende ist die Woche angeschnitten – dann ist auch die Summe nur ein Teil
      if (w.days.length < 7) range += ' · Teilwoche';
      var head = '<div class="week-head"><div class="wk">KW ' + isoWeek(new Date(curY, curM, first.d)) +
        '<small>' + range + '</small></div>' +
        '<div class="sum">' + fmtH(w.sum) + '</div></div>';

      var rows = used.map(function (x) {
        var chips = x.entry.tags.map(function (t) {
          return '<span class="chip ' + tagClass(t) + '">' + escapeHtml(t) + '</span>';
        }).join('');
        if (x.entry.custom) chips += '<span class="chip custom">geändert</span>';

        var middle;
        if (x.entry.art) {
          middle = '<span style="color:' + artColor(x.entry.art) + ';font-weight:600">' +
                   escapeHtml(artLabel(x.entry.art)) + '</span>';
        } else {
          middle = escapeHtml(x.entry.von) + ' – ' + escapeHtml(x.entry.bis) +
            (x.entry.pause > 0 ? ' <span class="muted">(' + fmtH(x.entry.pause) + ' Pause)</span>' : '');
        }

        return '<button type="button" class="row" data-key="' + x.key + '">' +
          '<span class="rdate">' + x.d + '.' + pad(curM + 1) + '.<small>' + DAY_NAMES[x.dow] + '</small></span>' +
          '<span class="rtime">' + middle + chips + '</span>' +
          '<span class="rhrs">' + fmtH(x.hours) + '</span>' +
          '</button>';
      }).join('');

      block.innerHTML = head + rows;
      block.querySelectorAll('.row').forEach(function (r) {
        r.addEventListener('click', function () { openModal(r.getAttribute('data-key')); });
      });
      listView.appendChild(block);
    });
  }

  /* ---------- Modal ---------- */

  var overlay = document.getElementById('overlay');
  var fVon = document.getElementById('fVon');
  var fBis = document.getElementById('fBis');
  var fPause = document.getElementById('fPause');
  var fArt = document.getElementById('fArt');
  var fStd = document.getElementById('fStd');
  var tagPicker = document.getElementById('tagPicker');
  var lastFocus = null;

  function buildTagPicker() {
    tagPicker.innerHTML = '';
    person().tags.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('data-tag', t);
      b.textContent = t;
      b.addEventListener('click', function () {
        var i = editTags.indexOf(t);
        if (i > -1) editTags.splice(i, 1); else editTags.push(t);
        b.classList.toggle('on', i === -1);
      });
      tagPicker.appendChild(b);
    });
  }
  buildTagPicker();

  // Pausenwerte, die nicht in der Liste stehen, trotzdem anbieten
  function setPause(v) {
    var val = String(v);
    if (!Array.prototype.some.call(fPause.options, function (o) { return o.value === val; })) {
      var opt = document.createElement('option');
      opt.value = val;
      opt.textContent = fmtHm(parseFloat(val) || 0) + ' Std.';
      fPause.appendChild(opt);
    }
    fPause.value = val;
  }

  function syncArtFields() {
    var isDienst = fArt.value === 'dienst';
    document.getElementById('dienstFields').style.display = isDienst ? '' : 'none';
    document.getElementById('artFields').style.display = isDienst ? 'none' : '';
    document.getElementById('mCalcSub').textContent = isDienst
      ? 'Arbeitszeit abzüglich Pause'
      : 'angerechnete Stunden';
    updatePreview();
  }

  function openModal(key) {
    editKey = key;
    lastFocus = document.activeElement;
    var parts = key.split('-');
    var date = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    var e = getEntry(key);
    var def = person().defaults;

    document.getElementById('mTitle').textContent =
      DAY_LONG[date.getDay()] + ', ' + (+parts[2]) + '. ' + MONTH_NAMES[date.getMonth()] + ' ' + parts[0];
    document.getElementById('mSub').textContent = e
      ? (e.custom ? 'Von Hand eingetragen' : 'Laut Dienstplan')
      : 'Dienstfrei – trage hier einen Dienst ein';

    fArt.value = e && e.art ? e.art : 'dienst';
    if (fArt.value !== 'dienst' && !ART_LABELS[fArt.value]) fArt.value = 'dienst';

    fVon.value = e && !e.art ? e.von : def.von;
    fBis.value = e && !e.art ? e.bis : def.bis;
    setPause(e && !e.art ? e.pause : def.pause);
    fStd.value = e && e.art ? (Math.round(e.h * 100) / 100) : 0;

    editTags = e && !e.art ? e.tags.slice() : [];
    tagPicker.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('on', editTags.indexOf(b.getAttribute('data-tag')) > -1);
    });

    renderMeta(key, e);
    syncArtFields();
    overlay.classList.add('open');
    document.getElementById('mSave').focus();
  }

  // Zeigt, wer den Tag zuletzt geändert hat – plus Knopf zum Zurücksetzen
  function renderMeta(key, e) {
    var box = document.getElementById('mMeta');
    if (!e || !e.custom) { box.innerHTML = ''; return; }

    var txt = 'Geändert';
    if (e.by) txt += ' von ' + e.by;
    if (e.ts) {
      txt += ' am ' + new Date(e.ts).toLocaleString('de-AT', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
      });
    }
    box.innerHTML = escapeHtml(txt) + '<br><button type="button" id="mRevert">Änderung zurücknehmen</button>';
    document.getElementById('mRevert').addEventListener('click', function () { revertDay(key); });
  }

  function closeModal() {
    if (!overlay.classList.contains('open')) return;
    overlay.classList.remove('open');
    editKey = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }

  function updatePreview() {
    var h = fArt.value === 'dienst'
      ? hoursOf({ von: fVon.value, bis: fBis.value, pause: parseFloat(fPause.value) || 0 })
      : Math.max(0, parseFloat(fStd.value) || 0);
    document.getElementById('mCalc').textContent =
      fmtMode === 'hm' ? fmtHm(h) + ' Std.' : fmtDec(h) + ' h';
  }

  [fVon, fBis, fPause, fStd].forEach(function (el) {
    el.addEventListener('input', updatePreview);
    el.addEventListener('change', updatePreview);
  });
  fArt.addEventListener('change', syncArtFields);

  document.getElementById('mSave').addEventListener('click', function () {
    if (!editKey) return;
    var val;

    if (fArt.value === 'dienst') {
      if (!fVon.value || !fBis.value) { alert('Bitte Von- und Bis-Zeit angeben.'); return; }
      val = {
        von: fVon.value,
        bis: fBis.value,
        pause: parseFloat(fPause.value) || 0,
        tags: editTags.slice()
      };
      if (hoursOf(val) <= 0) {
        if (!confirm('Damit ergibt der Tag 0 Stunden. Trotzdem speichern?')) return;
      }
    } else {
      var h = parseFloat(fStd.value);
      if (!isFinite(h) || h < 0 || h > 24) { alert('Bitte gültige Stunden zwischen 0 und 24 angeben.'); return; }
      val = { art: fArt.value, h: Math.round(h * 100) / 100 };
    }

    if (!userName && firebaseReady) askName();   // damit die Familie sieht, wer geändert hat
    val.by = userName || 'unbekannt';
    val.ts = Date.now();

    var key = editKey;
    closeModal();
    Store.set(key, val);
    render();
  });

  document.getElementById('mDelete').addEventListener('click', function () {
    if (!editKey) return;
    if (!userName && firebaseReady) askName();
    var key = editKey;
    closeModal();
    Store.set(key, { frei: true, by: userName || 'unbekannt', ts: Date.now() });
    render();
  });

  // Einzelnen Tag auf den gedruckten Dienstplan zurücksetzen
  function revertDay(key) {
    closeModal();
    Store.remove(key);
    render();
  }

  document.getElementById('mCancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeModal(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeModal(); });

  /* ---------- Navigation & Aktionen ---------- */

  document.getElementById('prevBtn').addEventListener('click', function () {
    curM--; if (curM < 0) { curM = 11; curY--; } render();
  });
  document.getElementById('nextBtn').addEventListener('click', function () {
    curM++; if (curM > 11) { curM = 0; curY++; } render();
  });
  document.getElementById('todayBtn').addEventListener('click', function () {
    curY = today.getFullYear(); curM = today.getMonth(); render();
  });

  var btnCal = document.getElementById('viewCal');
  var btnList = document.getElementById('viewList');
  btnCal.addEventListener('click', function () {
    mode = 'cal';
    btnCal.classList.add('active'); btnList.classList.remove('active');
    document.getElementById('calendarView').style.display = '';
    listView.style.display = 'none';
    render();
  });
  btnList.addEventListener('click', function () {
    mode = 'list';
    btnList.classList.add('active'); btnCal.classList.remove('active');
    document.getElementById('calendarView').style.display = 'none';
    listView.style.display = '';
    render();
  });

  var btnDec = document.getElementById('fmtDec');
  var btnHm = document.getElementById('fmtHm');
  function setFmt(m) {
    fmtMode = m;
    try { localStorage.setItem(FMT_KEY, m); } catch (e) {}
    btnDec.classList.toggle('active', m === 'dec');
    btnHm.classList.toggle('active', m === 'hm');
    render();
    if (overlay.classList.contains('open')) updatePreview();
  }
  btnDec.addEventListener('click', function () { setFmt('dec'); });
  btnHm.addEventListener('click', function () { setFmt('hm'); });

  document.getElementById('resetBtn').addEventListener('click', function () {
    var who = person().fullName;
    var warn = 'Alle Änderungen bei ' + who + ' verwerfen und den Original-Dienstplan wiederherstellen?';
    if (firebaseReady) warn += '\n\nAchtung: Das gilt für alle in der Familie, nicht nur für dieses Gerät.';
    if (!confirm(warn)) return;
    Store.clear();
    render();
  });

  /* ---------- ICS-Export ---------- */

  function icsEscape(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  }
  function icsStamp(d) {
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
           pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  }

  document.getElementById('icsBtn').addEventListener('click', function () {
    var days = monthDays(curY, curM).filter(function (x) { return !!x.entry; });
    if (!days.length) { alert('In diesem Monat gibt es keine Dienste zum Exportieren.'); return; }

    var p = person();
    var stamp = icsStamp(new Date());
    var lines = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Nessie-Hub//Dienstplan//DE', 'CALSCALE:GREGORIAN',
      'X-WR-CALNAME:' + icsEscape('Dienstplan ' + p.fullName)
    ];

    days.forEach(function (x) {
      var dt = x.key.replace(/-/g, '');
      lines.push('BEGIN:VEVENT',
        'UID:' + dt + '-' + p.id + '@nessie-hub',
        'DTSTAMP:' + stamp);

      if (x.entry.art) {
        // Ganztägig: DTEND ist im ICS-Format exklusiv, also der Folgetag
        var next = new Date(curY, curM, x.d + 1);
        lines.push(
          'DTSTART;VALUE=DATE:' + dt,
          'DTEND;VALUE=DATE:' + keyOf(next.getFullYear(), next.getMonth(), next.getDate()).replace(/-/g, ''),
          'SUMMARY:' + icsEscape(artLabel(x.entry.art) + ' – ' + p.label),
          'DESCRIPTION:' + icsEscape(fmtDec(x.hours) + ' h angerechnet')
        );
      } else {
        lines.push(
          'DTSTART:' + dt + 'T' + x.entry.von.replace(':', '') + '00',
          'DTEND:' + dt + 'T' + x.entry.bis.replace(':', '') + '00',
          'SUMMARY:' + icsEscape('Dienst ' + p.label + (x.entry.tags.length ? ' (' + x.entry.tags.join(', ') + ')' : '')),
          'DESCRIPTION:' + icsEscape(fmtDec(x.hours) + ' h' +
            (x.entry.pause > 0 ? ', ' + fmtDec(x.entry.pause) + ' h unbezahlte Pause' : ''))
        );
      }
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');

    var blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'dienstplan-' + p.id + '-' + curY + '-' + pad(curM + 1) + '.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  /* ---------- Start ---------- */

  onChange = render;
  paintTabs();
  setFmt(fmtMode);          // rendert bereits mit dem lokalen Stand
  Store.initStatus();
  Store.watch(personId);    // danach live auf die geteilten Daten hören
})();
</script>
</body>
</html>
