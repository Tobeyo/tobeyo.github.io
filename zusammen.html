<script>
(function () {
  'use strict';

  /* =========================================================
     ZUSAMMEN – Tobias & Daniel
     ---------------------------------------------------------
     Wann Tobias bei Daniel ist, was es abends zu essen gibt,
     die gemeinsame Einkaufsliste und Notizen. Alles liegt in
     derselben Realtime Database wie der Dienstplan, aber in
     einer eigenen Tabelle "zusammen/":

       zusammen/tage/<JJJJ-MM-TT>    { st, von, bis, notiz, by, ts }
       zusammen/essen/<JJJJ-MM-TT>   { gericht, koch, by, ts }
       zusammen/ideen/<id>           { name, zutaten[], by, ts }
       zusammen/einkauf/<id>         { text, kat, done, doneBy, doneTs, by, ts }
       zusammen/verlauf/<name>       { name, n, ts }   – für die Vorschläge
       zusammen/notizen/<id>         { text, pin, by, ts }

     Die Dienste kommen aus "dienstplan-daten.js" plus den
     Änderungen unter "dienstplan/<person>/entries" – hier
     wird nur mitgelesen, nie geschrieben.
     ========================================================= */

  var APP_STAND = '28.09.2026';          // steht unten in der Fusszeile

  var LEUTE = {
    tobias: { id: 'tobias', name: 'Tobias', kurz: 'T' },
    daniel: { id: 'daniel', name: 'Daniel', kurz: 'D' }
  };
  // Wer besucht wen: Tobias ist bei Daniel.
  var GAST = LEUTE.tobias;
  var GASTGEBER = LEUTE.daniel;

  var FIREBASE_CONFIG = {
    databaseURL: 'https://wm-tippspiel-d4f4f-default-rtdb.europe-west1.firebasedatabase.app',
    projectId: 'wm-tippspiel-d4f4f'
  };
  var DB_ROOT = 'zusammen';
  var COLLS = ['tage', 'essen', 'ideen', 'einkauf', 'verlauf', 'notizen'];

  var ME_KEY    = 'nessie_zusammen_ich';
  var TAB_KEY   = 'nessie_zusammen_tab';
  var CACHE_KEY = 'nessie_zusammen_daten';
  var FOOD_KEY  = 'nessie_dienstplan_essen';   // gewählte Menülinie aus dem Dienstplan

  var TABS = ['kalender', 'essen', 'einkauf', 'notizen'];

  var STATUS = {
    da:         { icon: '🏠', kurz: 'Da',         label: 'Bei ' + GASTGEBER.name, satz: GAST.name + ' ist bei ' + GASTGEBER.name },
    nacht:      { icon: '🌙', kurz: 'Übernachtet', label: 'Übernachtet',          satz: GAST.name + ' übernachtet bei ' + GASTGEBER.name },
    vielleicht: { icon: '❓', kurz: 'Vielleicht',  label: 'Vielleicht',           satz: GAST.name + ' kommt vielleicht' }
  };
  var ST_ORDER = ['', 'da', 'nacht', 'vielleicht'];

  var KOCH = {
    tobias: { kurz: 'Tobias',   satz: 'Tobias kocht' },
    daniel: { kurz: 'Daniel',   satz: 'Daniel kocht' },
    beide:  { kurz: 'Zusammen', satz: 'Zusammen kochen' },
    aus:    { kurz: 'Bestellen', satz: 'Bestellen / auswärts' }
  };

  var MONTH_NAMES = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  var DAY_NAMES = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  var DAY_LONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

  var ART_LABELS = {
    feiertag: 'Feiertag', urlaub: 'Urlaub', zeitausgleich: 'Zeitausgleich',
    fortbildung: 'Fortbildung', krank: 'Krank', sonderurlaub: 'Sonderurlaub'
  };

  /* Regale im Supermarkt – die Einkaufsliste sortiert sich danach.
     Ein Wort passt, wenn es genau so heißt oder (ab 3 Buchstaben)
     so endet: "Vollkornbrot" landet bei "brot". Das längste
     passende Stichwort gewinnt, darum wird "Reis" nicht zu "Eis". */
  var KATS = [
    { id: 'obst', icon: '🥦', label: 'Obst & Gemüse',
      w: 'obst gemüse apfel äpfel banane bananen birne birnen orange orangen mandarinen zitrone zitronen limette limetten trauben weintrauben beeren erdbeeren himbeeren heidelbeeren kiwi mango ananas melone salat häuptel rucola spinat tomate tomaten paradeiser gurke gurken paprika zucchini melanzani aubergine karotte karotten möhren kartoffel kartoffeln erdäpfel zwiebel zwiebeln knoblauch lauch porree brokkoli broccoli karfiol blumenkohl kohl kraut sellerie champignons pilze schwammerl kürbis avocado ingwer kräuter petersilie schnittlauch basilikum radieschen mais fisolen' },
    { id: 'kuehl', icon: '🧀', label: 'Milch, Käse & Eier',
      w: 'milch butter joghurt jogurt topfen quark käse gouda emmentaler mozzarella parmesan feta frischkäse sahne schlagobers obers rahm creme crème eier ei margarine skyr kefir pudding aufstrich' },
    { id: 'fleisch', icon: '🥩', label: 'Fleisch, Wurst & Fisch',
      w: 'fleisch faschiertes hackfleisch hack schnitzel huhn hühner hähnchen hendl hühnerfilet pute puten putenbrust rind rindfleisch schwein schweinefleisch speck schinken wurst würstel würstchen salami leberkäse fisch lachs thunfisch garnelen shrimps kebab gyros cevapcici' },
    { id: 'brot', icon: '🥖', label: 'Brot & Gebäck',
      w: 'brot semmel semmeln gebäck toast weckerl baguette brötchen kornspitz croissant kipferl brezel laugenstangerl striezel kuchen wraps tortillas' },
    { id: 'vorrat', icon: '🍝', label: 'Nudeln, Reis & Vorrat',
      w: 'nudeln spaghetti pasta penne fusilli lasagneblätter reis mehl zucker salz pfeffer öl olivenöl rapsöl sonnenblumenöl essig gewürz gewürze paprikapulver senf ketchup mayo mayonnaise sauce soße passata dosentomaten konserve dose linsen bohnen kichererbsen haferflocken müsli cornflakes honig marmelade nutella kaffee tee kakao brühe suppe suppenwürfel couscous grieß backpulver hefe germ nüsse' },
    { id: 'tk', icon: '🧊', label: 'Tiefkühl',
      w: 'tiefkühl tk pizza speiseeis eis pommes fischstäbchen tiefkühlgemüse' },
    { id: 'getraenke', icon: '🥤', label: 'Getränke',
      w: 'wasser mineralwasser mineral saft cola fanta sprite limo limonade eistee bier wein sekt radler energy almdudler sirup' },
    { id: 'snacks', icon: '🍫', label: 'Süßes & Snacks',
      w: 'schokolade schoko chips kekse gummibärchen süßes snacks popcorn manner mannerschnitten riegel soletti' },
    { id: 'haushalt', icon: '🧻', label: 'Haushalt & Drogerie',
      w: 'klopapier toilettenpapier küchenrolle taschentücher spülmittel tabs geschirrspültabs waschmittel weichspüler müllsäcke müllbeutel alufolie frischhaltefolie backpapier schwamm schwämme duschgel shampoo zahnpasta zahnbürste deo seife rasierer putzmittel reiniger batterien glühbirne' }
  ];
  var KAT_SONST = { id: 'sonst', icon: '🧺', label: 'Sonstiges' };
  var KAT_WORDS = {};
  KATS.forEach(function (k) { k.w.split(' ').forEach(function (w) { if (w) KAT_WORDS[w] = k.id; }); });
  function katById(id) {
    for (var i = 0; i < KATS.length; i++) if (KATS[i].id === id) return KATS[i];
    return KAT_SONST;
  }

  /* ---------- Kleine Helfer ---------- */

  function $(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function readLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function writeLS(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* privater Modus */ } }
  function readJSON(k) { try { return JSON.parse(readLS(k)) || null; } catch (e) { return null; } }
  // Kopie ohne "undefined" – Firebase lehnt solche Felder ab
  function clone(v) { return v == null ? null : JSON.parse(JSON.stringify(v)); }
  function trim(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
  function lower(s) { return trim(s).toLowerCase(); }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function keyOf(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function keyOfDate(d) { return keyOf(d.getFullYear(), d.getMonth(), d.getDate()); }
  function dateOf(k) { return new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10)); }
  function addDays(k, n) { var d = dateOf(k); d.setDate(d.getDate() + n); return keyOfDate(d); }
  function weekStart(k) { var d = dateOf(k); return addDays(k, -((d.getDay() + 6) % 7)); }
  function weekEnd(k) { return addDays(weekStart(k), 6); }
  function dayNum(k) { return dateOf(k).getDate() + '.' + (dateOf(k).getMonth() + 1) + '.'; }
  function dayLong(k) { var d = dateOf(k); return DAY_LONG[d.getDay()] + ', ' + d.getDate() + '. ' + MONTH_NAMES[d.getMonth()]; }

  var todayKey = keyOfDate(new Date());

  // "heute", "morgen", "Fr" …
  function relShort(k) {
    if (k === todayKey) return 'Heute';
    if (k === addDays(todayKey, 1)) return 'Morgen';
    return DAY_NAMES[dateOf(k).getDay()];
  }
  function relLong(k) {
    if (k === todayKey) return 'heute';
    if (k === addDays(todayKey, 1)) return 'morgen';
    var d = dateOf(k);
    return DAY_LONG[d.getDay()] + ', ' + dayNum(k);
  }

  function ago(ts) {
    if (!ts) return '';
    var s = (Date.now() - ts) / 1000;
    if (s < 60) return 'gerade eben';
    if (s < 3600) return 'vor ' + Math.floor(s / 60) + ' Min.';
    var d = new Date(ts);
    var k = keyOfDate(d);
    if (k === todayKey) return 'heute ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (k === addDays(todayKey, -1)) return 'gestern';
    return 'am ' + dayNum(k);
  }
  function byLine(o) {
    if (!o) return '';
    var who = o.by && LEUTE[o.by] ? LEUTE[o.by].name : '';
    var when = ago(o.ts);
    return [who, when].filter(Boolean).join(' · ');
  }

  // Menge vorne weg ("2x", "500 g", "1 Pkg.") – für Vorschläge und Regal
  var MENGE_RE = /^\s*\d+([.,]\d+)?\s*(x|×|stk\.?|stück|g|gr|kg|l|ml|pkg\.?|pck\.?|packung(en)?|dose(n)?|fl\.?|flasche(n)?|becher|bund|netz)?\.?\s+/i;
  function ohneMenge(s) { return trim(String(s).replace(MENGE_RE, '')) || trim(s); }

  function autoKat(text) {
    var words = lower(ohneMenge(text)).split(/[^a-zäöüß]+/).filter(Boolean);
    var best = '', bestLen = 0;
    words.forEach(function (w) {
      Object.keys(KAT_WORDS).forEach(function (kw) {
        var hit = w === kw || (kw.length >= 3 && w.length > kw.length && w.slice(-kw.length) === kw);
        if (hit && kw.length > bestLen) { best = KAT_WORDS[kw]; bestLen = kw.length; }
      });
    });
    return best || 'sonst';
  }
  function katOf(it) { return it.kat && (it.kat === 'sonst' || katById(it.kat) !== KAT_SONST) ? it.kat : autoKat(it.text); }

  function verlaufKey(name) {
    return lower(ohneMenge(name)).replace(/[.#$\/\[\]]/g, '_').slice(0, 60) || '_';
  }

  /* ---------- Anzeige-Helfer ---------- */

  function showNotice(msg) { $('noticeArea').innerHTML = '<div class="notice">' + escapeHtml(msg) + '</div>'; }
  function clearNotice() { $('noticeArea').innerHTML = ''; }
  function setStatus(state, text) {
    $('statusPill').className = 'status' + (state ? ' ' + state : '');
    $('statusText').textContent = text;
  }

  var toastTimer = null;
  function hideToast() { $('toast').hidden = true; }
  function toast(msg, undo) {
    var el = $('toast');
    el.innerHTML = '<span>' + escapeHtml(msg) + '</span>' + (undo ? '<button type="button">Rückgängig</button>' : '');
    el.hidden = false;
    el.classList.remove('show');
    void el.offsetWidth;                        // Einblenden neu starten
    el.classList.add('show');
    if (undo) el.querySelector('button').onclick = function () { hideToast(); undo(); };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, undo ? 5500 : 2600);
  }

  /* ---------- Daten ---------- */

  function normalize(v) {
    v = v && typeof v === 'object' ? v : {};
    var out = {};
    COLLS.forEach(function (k) { out[k] = v[k] && typeof v[k] === 'object' ? v[k] : {}; });
    return out;
  }

  var D = normalize(readJSON(CACHE_KEY));
  function persist() { writeLS(CACHE_KEY, JSON.stringify(D)); }

  var me = LEUTE[readLS(ME_KEY)] ? readLS(ME_KEY) : '';

  /* ---------- Dienstpläne (nur lesen) ---------- */

  var PLAN = {};
  ((window.NESSIE_DIENSTPLAN && window.NESSIE_DIENSTPLAN.people) || []).forEach(function (p) { PLAN[p.id] = p; });
  // Solange Firebase noch lädt: der Stand, den der Kalender auf diesem Gerät zuletzt gesehen hat
  var dienstOverrides = {
    tobias: readJSON('nessie_dienstplan_tobias') || {},
    daniel: readJSON('nessie_dienstplan_daniel') || {}
  };
  var RANGE = {};
  // Von wann bis wann es überhaupt einen Plan gibt – danach heißt es "noch kein Plan", nicht "frei"
  function updateRanges() {
    Object.keys(LEUTE).forEach(function (pid) {
      var keys = Object.keys((PLAN[pid] && PLAN[pid].plan) || {})
        .concat(Object.keys(dienstOverrides[pid] || {}))
        .filter(function (k) { return /^\d{4}-\d{2}-\d{2}$/.test(k); })
        .sort();
      RANGE[pid] = keys.length ? { von: weekStart(keys[0]), bis: weekEnd(keys[keys.length - 1]) } : null;
    });
  }
  updateRanges();

  // { bekannt, arbeitet, txt }
  function dienst(pid, key) {
    var p = PLAN[pid];
    if (!p) return { bekannt: false, arbeitet: false, txt: 'kein Plan' };
    var o = (dienstOverrides[pid] || {})[key];
    var e;
    if (o) e = o.frei ? null : o;
    else {
      var r = RANGE[pid];
      if (!r || key < r.von || key > r.bis) return { bekannt: false, arbeitet: false, txt: 'noch kein Plan' };
      e = (p.plan || {})[key] || null;
    }
    if (!e) return { bekannt: true, arbeitet: false, txt: 'frei' };
    if (e.art) return { bekannt: true, arbeitet: e.art === 'fortbildung', txt: ART_LABELS[e.art] || e.art };
    if (!e.von || !e.bis) return { bekannt: true, arbeitet: true, txt: 'Dienst' };
    return { bekannt: true, arbeitet: true, txt: e.von + '–' + e.bis };
  }
  function shiftCls(d) { return !d.bekannt ? 'unk' : d.arbeitet ? '' : 'free'; }

  // Was es für Tobias mittags im Haus gibt (nur an Diensttagen)
  var ESSEN_PLAN = window.NESSIE_ESSENSPLAN || null;
  function mittag(key) {
    var plan = ESSEN_PLAN && ESSEN_PLAN.plaene && ESSEN_PLAN.plaene[GAST.id];
    var day = plan && plan[key];
    if (!day || !dienst(GAST.id, key).arbeitet) return null;
    var nur = readLS(FOOD_KEY) || '';
    var menues = (ESSEN_PLAN.menues || []).filter(function (m) { return !nur || m.id === nur; });
    if (!menues.length) menues = ESSEN_PLAN.menues || [];
    return menues.map(function (m) {
      var items = (day[m.id] || []).filter(Boolean);
      // nur der Hauptgang – Suppe, Beilagen und Nachspeise lassen wir weg
      var main = items.length >= 3 ? items[1] : items[items.length - 1];
      return { label: m.kurz, gang: main || '' };
    }).filter(function (x) { return x.gang; });
  }

  /* ---------- Firebase ---------- */

  var db = null, firebaseReady = false, readFailed = false;
  try {
    if (typeof firebase !== 'undefined' && FIREBASE_CONFIG.databaseURL) {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      firebaseReady = true;
    }
  } catch (e) {
    console.warn('Firebase konnte nicht gestartet werden:', e);
  }

  function newId(coll) {
    if (firebaseReady) return db.ref(DB_ROOT + '/' + coll).push().key;
    return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function setIn(path, val) {
    var parts = path.split('/'), o = D;
    for (var i = 0; i < parts.length - 1; i++) {
      if (!o[parts[i]] || typeof o[parts[i]] !== 'object') o[parts[i]] = {};
      o = o[parts[i]];
    }
    if (val == null) delete o[parts[parts.length - 1]];
    else o[parts[parts.length - 1]] = val;
  }

  // Mehrere Stellen auf einmal ändern: { 'einkauf/abc': {...}, 'verlauf/milch': null }
  function saveMany(updates) {
    var clean = {};
    Object.keys(updates).forEach(function (p) {
      clean[p] = clone(updates[p]);
      setIn(p, clean[p]);
    });
    persist();
    renderAll();
    if (!firebaseReady) return;
    db.ref(DB_ROOT).update(clean).catch(function (err) {
      showNotice('Speichern hat nicht geklappt (' + err.message + '). Die Änderung ist erst einmal nur auf diesem Gerät.');
    });
  }
  function save(path, val) { var u = {}; u[path] = val; saveMany(u); }

  function stamp(o) { o.by = me || ''; o.ts = Date.now(); return o; }
  function sameFields(a, b, fields) {
    a = a || {}; b = b || {};
    return fields.every(function (f) { return JSON.stringify(a[f] || '') === JSON.stringify(b[f] || ''); });
  }

  function startSync() {
    if (!firebaseReady) { setStatus('', 'Nur auf diesem Gerät'); return; }
    setStatus('', 'Verbinde …');
    db.ref('.info/connected').on('value', function (snap) {
      if (readFailed) return;
      if (snap.val() === true) setStatus('live', 'Live – ihr seht beide dasselbe');
      else setStatus('', 'Offline – wird später abgeglichen');
    });
    db.ref(DB_ROOT).on('value',
      function (snap) {
        D = normalize(snap.val());
        persist();
        clearNotice();
        renderAll();
      },
      function (err) {
        readFailed = true;
        firebaseReady = false;
        setStatus('err', 'Verbindung gestört');
        showNotice('Die gemeinsame Datenbank ist gerade nicht erreichbar (' + err.message +
                   '). Angezeigt wird der letzte Stand, Änderungen bleiben vorerst auf diesem Gerät.');
      }
    );
    Object.keys(LEUTE).forEach(function (pid) {
      db.ref('dienstplan/' + pid + '/entries').on('value',
        function (snap) { dienstOverrides[pid] = snap.val() || {}; updateRanges(); renderAll(); },
        function () { /* dann eben nur der gedruckte Plan */ });
    });
  }

  /* ---------- Wer bin ich ---------- */

  function renderMe() {
    var b = $('meBtn');
    b.innerHTML = me ? '👤 ' + escapeHtml(LEUTE[me].name) : '👤 <span class="me-long">Wer bist du?</span>';
    b.classList.toggle('unset', !me);
  }

  function openMe() {
    openSheet(
      '<div class="m-head"><div><h3 id="mTitle">Wer bist du?</h3>' +
      '<div class="sub">Dein Name steht dann bei allem, was du einträgst. Gespeichert wird das nur auf diesem Gerät.</div></div>' +
      '<button class="m-x" type="button" data-close aria-label="Schließen">✕</button></div>' +
      '<div class="me-grid">' + Object.keys(LEUTE).map(function (pid) {
        return '<button type="button" data-me="' + pid + '" class="' + (me === pid ? 'on' : '') + '">' + LEUTE[pid].name + '</button>';
      }).join('') + '</div>'
    );
    $('modal').querySelectorAll('[data-me]').forEach(function (b) {
      b.addEventListener('click', function () {
        me = b.getAttribute('data-me');
        writeLS(ME_KEY, me);
        renderMe();
        closeSheet();
        toast('Hallo ' + LEUTE[me].name + '!');
      });
    });
  }
  $('meBtn').addEventListener('click', openMe);

  /* ---------- Reiter ---------- */

  var tab = (location.hash || '').slice(1);
  if (TABS.indexOf(tab) < 0) tab = readLS(TAB_KEY);
  if (TABS.indexOf(tab) < 0) tab = 'kalender';

  function setTab(t) {
    if (TABS.indexOf(t) < 0) t = 'kalender';
    var changed = t !== tab;
    tab = t;
    document.querySelectorAll('[data-pane]').forEach(function (p) { p.hidden = p.getAttribute('data-pane') !== t; });
    document.querySelectorAll('#tabs [data-tab]').forEach(function (b) {
      var on = b.getAttribute('data-tab') === t;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    writeLS(TAB_KEY, t);
    if (location.hash !== '#' + t) {
      try { history.replaceState(null, '', '#' + t); } catch (e) { /* egal */ }
    }
    if (changed && window.scrollY > 0) window.scrollTo(0, 0);
  }
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (b) setTab(b.getAttribute('data-tab'));
  });
  window.addEventListener('hashchange', function () { setTab(location.hash.slice(1)); });

  /* ---------- Fenster ---------- */

  var overlay = $('overlay'), modal = $('modal');
  var lastFocus = null;
  function openSheet(html) {
    if (!overlay.classList.contains('open')) lastFocus = document.activeElement;
    modal.innerHTML = html;
    overlay.classList.add('open');
    modal.scrollTop = 0;
    var f = modal.querySelector('[data-autofocus]');
    if (f && window.matchMedia('(hover: hover)').matches) f.focus();
  }
  function closeSheet() {
    overlay.classList.remove('open');
    modal.innerHTML = '';
    if (lastFocus && lastFocus.focus) try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* egal */ }
  }
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay || e.target.closest('[data-close]')) closeSheet();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeSheet();
  });

  function segHtml(name, opts, cur, cls) {
    return '<div class="seg' + (cls ? ' ' + cls : '') + '" data-seg="' + name + '" role="radiogroup">' +
      opts.map(function (o) {
        return '<button type="button" role="radio" data-v="' + o.v + '" class="' + (o.v === cur ? 'on' : '') + '" aria-checked="' + (o.v === cur) + '">' +
          (o.icon ? '<span class="si" aria-hidden="true">' + o.icon + '</span>' : '') + escapeHtml(o.label) + '</button>';
      }).join('') + '</div>';
  }
  function wireSeg(name, onPick) {
    var box = modal.querySelector('[data-seg="' + name + '"]');
    box.addEventListener('click', function (e) {
      var b = e.target.closest('[data-v]');
      if (!b) return;
      var v = b.getAttribute('data-v');
      // Nochmal auf die gewählte Option tippen hebt die Auswahl auf (nur wo es ein "leer" gibt)
      if (b.classList.contains('on') && box.hasAttribute('data-toggle')) v = '';
      box.querySelectorAll('[data-v]').forEach(function (x) {
        var on = x.getAttribute('data-v') === v;
        x.classList.toggle('on', on);
        x.setAttribute('aria-checked', on ? 'true' : 'false');
      });
      onPick(v);
    });
  }

  /* =========================================================
     KALENDER
     ========================================================= */

  var shown = dateOf(todayKey);
  var curY = shown.getFullYear(), curM = shown.getMonth();
  var quickMode = false;

  function stOf(key) {
    var t = D.tage[key];
    return t && STATUS[t.st] ? t.st : '';
  }
  function gerichtOf(key) {
    var e = D.essen[key];
    return e && e.gericht ? e.gericht : '';
  }

  function whoMark(pid, info) {
    var cls = !info.bekannt ? ' none' : info.arbeitet ? ' on' : '';
    return '<i class="w' + cls + '">' + LEUTE[pid].kurz + '</i>';
  }

  function renderToday() {
    var st = stOf(todayKey), t = D.tage[todayKey] || {};
    var main, sub = [];
    if (st) {
      main = STATUS[st].satz;
      if (t.von) sub.push('ab ' + t.von + (t.bis ? ' bis ' + t.bis : ''));
      else if (t.bis) sub.push('bis ' + t.bis);
    } else {
      main = 'Heute kein Besuch eingetragen';
      var next = Object.keys(D.tage).filter(function (k) { return k > todayKey && (stOf(k) === 'da' || stOf(k) === 'nacht'); }).sort()[0];
      sub.push(next ? 'Als Nächstes: ' + relLong(next) : 'Tippe hier, um heute einzutragen');
    }
    if (t.notiz) sub.push(t.notiz);

    var e = D.essen[todayKey] || {};
    var offen = Object.keys(D.einkauf).filter(function (id) { return !D.einkauf[id].done; })
      .map(function (id) { return D.einkauf[id]; })
      .sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });

    var dt = dienst('tobias', todayKey), dd = dienst('daniel', todayKey);

    $('todayCard').innerHTML =
      '<div class="tc-kicker">Heute · ' + escapeHtml(dayLong(todayKey)) + '</div>' +
      '<button type="button" class="tc-main' + (st ? ' st-' + st : '') + '" data-day="' + todayKey + '">' +
        '<span class="tc-ico" aria-hidden="true">' + (st ? STATUS[st].icon : '🏡') + '</span>' +
        '<span><b>' + escapeHtml(main) + '</b>' + (sub.length ? '<small>' + escapeHtml(sub.join(' · ')) + '</small>' : '') + '</span>' +
      '</button>' +
      '<div class="tc-grid">' +
        '<button type="button" class="tc-item" data-day="' + todayKey + '" data-focus="essen">' +
          '<span class="tc-lbl">🍽 Abendessen</span>' +
          (e.gericht ? '<span class="tc-val">' + escapeHtml(e.gericht) + '</span><small>' + escapeHtml(KOCH[e.koch] ? KOCH[e.koch].satz : 'Wer kocht?') + '</small>'
                     : '<span class="tc-val muted">Noch offen</span><small>Tippen zum Planen</small>') +
        '</button>' +
        '<button type="button" class="tc-item" data-go="einkauf">' +
          '<span class="tc-lbl">🛒 Einkauf</span>' +
          (offen.length ? '<span class="tc-val">' + offen.length + (offen.length === 1 ? ' Sache' : ' Sachen') + ' offen</span><small>' +
                          escapeHtml(offen.slice(0, 3).map(function (x) { return x.text; }).join(', ') + (offen.length > 3 ? ' …' : '')) + '</small>'
                        : '<span class="tc-val muted">Alles da</span><small>Liste ist leer</small>') +
        '</button>' +
        '<div class="tc-item wide">' +
          '<span class="tc-lbl">💼 Dienste heute</span>' +
          '<div class="tc-shift"><span>Tobias</span><b class="' + shiftCls(dt) + '">' + escapeHtml(dt.txt) + '</b></div>' +
          '<div class="tc-shift"><span>Daniel</span><b class="' + shiftCls(dd) + '">' + escapeHtml(dd.txt) + '</b></div>' +
        '</div>' +
      '</div>';
  }

  function renderKalender(calm) {
    $('monthName').innerHTML = MONTH_NAMES[curM] + '<span>' + curY + '</span>';
    var first = new Date(curY, curM, 1);
    var offset = (first.getDay() + 6) % 7;
    var days = new Date(curY, curM + 1, 0).getDate();
    var html = '';
    var nDa = 0, nNacht = 0;
    for (var i = 0; i < offset; i++) html += '<div class="day empty" aria-hidden="true"></div>';
    for (var d = 1; d <= days; d++) {
      var key = keyOf(curY, curM, d);
      var st = stOf(key), t = D.tage[key] || {};
      var wd = new Date(curY, curM, d).getDay();
      if (st === 'da' || st === 'nacht') nDa++;
      if (st === 'nacht') nNacht++;
      var dt = dienst('tobias', key), dd = dienst('daniel', key);
      var ger = gerichtOf(key);
      var cls = 'day';
      if (wd === 0 || wd === 6) cls += ' weekend';
      if (key < todayKey) cls += ' past';
      if (key === todayKey) cls += ' today';
      if (st) cls += ' st-' + st;
      var aria = DAY_LONG[wd] + ', ' + d + '. ' + MONTH_NAMES[curM] +
        (st ? ', ' + STATUS[st].label : '') + (ger ? ', Abendessen: ' + ger : '') +
        ', Tobias ' + dt.txt + ', Daniel ' + dd.txt;
      html += '<button type="button" class="' + cls + '" data-day="' + key + '" aria-label="' + escapeHtml(aria) + '">' +
        (t.notiz ? '<span class="note-dot" aria-hidden="true"></span>' : '') +
        (ger ? '<span class="meal" aria-hidden="true">🍽</span>' : '') +
        '<span class="dnum">' + d + '</span>' +
        '<span class="stay" aria-hidden="true">' + (st ? STATUS[st].icon : '') + '</span>' +
        '<span class="who" aria-hidden="true">' + whoMark('tobias', dt) + whoMark('daniel', dd) + '</span>' +
      '</button>';
    }
    var grid = $('grid');
    grid.classList.toggle('calm', !!calm);
    grid.innerHTML = html;

    $('calStats').innerHTML = nDa
      ? 'Im ' + MONTH_NAMES[curM] + ': <b>' + nDa + '</b> ' + (nDa === 1 ? 'Tag' : 'Tage') + ' bei ' + GASTGEBER.name +
        (nNacht ? ', davon <b>' + nNacht + '</b> ' + (nNacht === 1 ? 'Nacht' : 'Nächte') : '')
      : 'Im ' + MONTH_NAMES[curM] + ' noch kein Besuch eingetragen';
  }

  function renderLegend() {
    $('legend').innerHTML =
      '<span>🏠 bei ' + GASTGEBER.name + '</span><span>🌙 übernachtet</span><span>❓ vielleicht</span><span>🍽 Essen geplant</span>' +
      '<span><i class="w on">T</i><i class="w on">D</i> arbeitet</span><span><i class="w">T</i><i class="w">D</i> frei</span>';
  }

  function renderNext() {
    var keys = Object.keys(D.tage).filter(function (k) { return k >= todayKey && stOf(k); }).sort().slice(0, 6);
    if (!keys.length) {
      $('nextList').innerHTML = '<div class="empty-hint">Noch kein Besuch eingetragen.<br>Tippe oben auf einen Tag – oder auf „Schnell eintragen“.</div>';
      return;
    }
    $('nextList').innerHTML = keys.map(function (k) {
      var st = stOf(k), t = D.tage[k], ger = gerichtOf(k);
      var bits = [];
      if (t.von) bits.push('ab ' + t.von);
      if (t.bis) bits.push('bis ' + t.bis);
      if (ger) bits.push('🍽 ' + ger);
      if (t.notiz) bits.push(t.notiz);
      return '<button type="button" class="row' + (k === todayKey ? ' today' : '') + '" data-day="' + k + '">' +
        '<span class="rdate">' + relShort(k) + '<small>' + dayNum(k) + '</small></span>' +
        '<span class="rst" aria-hidden="true">' + STATUS[st].icon + '</span>' +
        '<span class="rmain"><b>' + escapeHtml(STATUS[st].label) + '</b>' + (bits.length ? '<small>' + escapeHtml(bits.join(' · ')) + '</small>' : '') + '</span>' +
        '<span class="rgo" aria-hidden="true">›</span></button>';
    }).join('');
  }

  function cycleDay(key) {
    var t = clone(D.tage[key]) || {};
    var i = ST_ORDER.indexOf(STATUS[t.st] ? t.st : '');
    var next = ST_ORDER[(i + 1) % ST_ORDER.length];
    if (next) t.st = next; else delete t.st;
    stamp(t);
    save('tage/' + key, (t.st || t.von || t.bis || t.notiz) ? t : null);
  }

  function setQuick(on) {
    quickMode = on;
    $('quickHint').hidden = !on;
    $('quickBtn').classList.toggle('on', on);
  }
  $('quickBtn').addEventListener('click', function () { setQuick(!quickMode); });
  $('quickDone').addEventListener('click', function () { setQuick(false); });

  $('prevBtn').addEventListener('click', function () {
    curM--; if (curM < 0) { curM = 11; curY--; }
    renderKalender();
  });
  $('nextBtn').addEventListener('click', function () {
    curM++; if (curM > 11) { curM = 0; curY++; }
    renderKalender();
  });

  // Ein Tag angetippt – egal ob im Kalender, in "Als Nächstes" oder beim Essen
  document.addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]');
    if (go && !modal.contains(go)) { setTab(go.getAttribute('data-go')); return; }
    var b = e.target.closest('[data-day]');
    if (!b || modal.contains(b)) return;
    var key = b.getAttribute('data-day');
    if (quickMode && b.classList.contains('day')) { cycleDay(key); return; }
    openDay(key, b.getAttribute('data-focus') || '');
  });

  /* ---------- Tages-Fenster ---------- */

  function ideaByName(name) {
    var n = lower(name);
    if (!n) return null;
    var ids = Object.keys(D.ideen);
    for (var i = 0; i < ids.length; i++) if (lower(D.ideen[ids[i]].name) === n) return D.ideen[ids[i]];
    return null;
  }

  function openDay(key, focus) {
    var t = D.tage[key] || {}, e = D.essen[key] || {};
    var selSt = STATUS[t.st] ? t.st : '';
    var selKoch = KOCH[e.koch] ? e.koch : '';
    var dt = dienst('tobias', key), dd = dienst('daniel', key);
    var lunch = mittag(key);
    var d = dateOf(key);

    var meta = [];
    if (t.ts) meta.push('Besuch: ' + byLine(t));
    if (e.ts) meta.push('Essen: ' + byLine(e));

    openSheet(
      '<div class="m-head"><div><h3 id="mTitle">' + DAY_LONG[d.getDay()] + '</h3>' +
      '<div class="sub">' + d.getDate() + '. ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear() +
        (key === todayKey ? ' · heute' : '') + '</div></div>' +
      '<button class="m-x" type="button" data-close aria-label="Schließen">✕</button></div>' +

      '<div class="m-sec">' + GAST.name + ' bei ' + GASTGEBER.name + '?</div>' +
      segHtml('st', [
        { v: '', icon: '–', label: 'Nein' },
        { v: 'da', icon: STATUS.da.icon, label: STATUS.da.kurz },
        { v: 'nacht', icon: STATUS.nacht.icon, label: 'Nacht' },
        { v: 'vielleicht', icon: STATUS.vielleicht.icon, label: 'Vielleicht' }
      ], selSt) +
      '<div class="field-row">' +
        '<div class="field"><label for="dsVon">Kommt um</label><input type="time" id="dsVon" value="' + escapeHtml(t.von || '') + '"></div>' +
        '<div class="field"><label for="dsBis">Geht um</label><input type="time" id="dsBis" value="' + escapeHtml(t.bis || '') + '"></div>' +
      '</div>' +
      '<div class="field"><label for="dsNotiz">Notiz zum Tag</label><input id="dsNotiz" maxlength="140" placeholder="z. B. bringt die Wäsche mit" value="' + escapeHtml(t.notiz || '') + '"></div>' +

      '<div class="m-sec">Dienste</div>' +
      '<div class="shifts">' +
        '<div class="shift"><span>Tobias</span><b class="' + shiftCls(dt) + '">' + escapeHtml(dt.txt) + '</b></div>' +
        '<div class="shift"><span>Daniel</span><b class="' + shiftCls(dd) + '">' + escapeHtml(dd.txt) + '</b></div>' +
      '</div>' +

      '<div class="m-sec">Abendessen</div>' +
      '<div class="field"><input id="dsEssen" list="gerichteListe" maxlength="80" placeholder="Was gibt’s? z. B. Spaghetti" value="' + escapeHtml(e.gericht || '') + '"' + (focus === 'essen' ? ' data-autofocus' : '') + '></div>' +
      segHtml('koch', Object.keys(KOCH).map(function (k) { return { v: k, label: KOCH[k].kurz }; }), selKoch, 'small') +
      '<button type="button" class="link-btn" id="dsZutaten" hidden></button>' +
      (lunch && lunch.length ? '<div class="lunch">Mittags im Haus (' + GAST.name + '): ' +
        lunch.map(function (l) { return (lunch.length > 1 ? escapeHtml(l.label) + ': ' : '') + '<b>' + escapeHtml(l.gang) + '</b>'; }).join(' · ') + '</div>' : '') +

      '<div class="modal-actions">' +
        '<button type="button" class="btn ghost" data-close>Abbrechen</button>' +
        '<button type="button" class="btn primary" id="dsSave">Speichern</button>' +
      '</div>' +
      '<div class="modal-meta">' + escapeHtml(meta.join(' · ')) + '</div>'
    );

    modal.querySelector('[data-seg="koch"]').setAttribute('data-toggle', '');
    wireSeg('st', function (v) { selSt = v; });
    wireSeg('koch', function (v) { selKoch = v; });

    var essenIn = $('dsEssen'), zBtn = $('dsZutaten');
    function updZutaten() {
      var idee = ideaByName(essenIn.value);
      var z = idee && Array.isArray(idee.zutaten) ? idee.zutaten : [];
      zBtn.hidden = !z.length;
      zBtn.textContent = '🛒 Zutaten für „' + (idee ? idee.name : '') + '“ auf die Einkaufsliste';
    }
    essenIn.addEventListener('input', updZutaten);
    updZutaten();
    zBtn.addEventListener('click', function () {
      var idee = ideaByName(essenIn.value);
      if (idee) addEinkauf(idee.zutaten || []);
    });

    $('dsSave').addEventListener('click', function () {
      var u = {};
      var neuT = { st: selSt, von: $('dsVon').value, bis: $('dsBis').value, notiz: trim($('dsNotiz').value) };
      Object.keys(neuT).forEach(function (k) { if (!neuT[k]) delete neuT[k]; });
      if (!sameFields(neuT, t, ['st', 'von', 'bis', 'notiz'])) {
        u['tage/' + key] = Object.keys(neuT).length ? stamp(neuT) : null;
      }
      var ger = trim(essenIn.value);
      var neuE = ger ? { gericht: ger } : {};
      if (ger && selKoch) neuE.koch = selKoch;
      if (!sameFields(neuE, e, ['gericht', 'koch'])) {
        u['essen/' + key] = ger ? stamp(neuE) : null;
      }
      closeSheet();
      if (Object.keys(u).length) {
        if (!me) setTimeout(openMe, 250);
        saveMany(u);
      }
    });
  }

  /* =========================================================
     ESSEN
     ========================================================= */

  function zuletzt(k) {
    if (k === todayKey) return 'gibt’s heute';
    var n = Math.round((dateOf(todayKey) - dateOf(k)) / 86400000);
    if (n === 1) return 'zuletzt gestern';
    if (n < 14) return 'zuletzt vor ' + n + ' Tagen';
    return 'zuletzt am ' + dayNum(k);
  }

  function lastEaten() {
    var map = {};
    Object.keys(D.essen).forEach(function (k) {
      if (k > todayKey) return;
      var n = lower(gerichtOf(k));
      if (n && (!map[n] || map[n] < k)) map[n] = k;
    });
    return map;
  }

  function renderEssen() {
    var html = '';
    for (var i = 0; i < 14; i++) {
      var k = addDays(todayKey, i);
      if (i > 0 && dateOf(k).getDay() === 1) html += '<div class="list-sep">Woche ab ' + dayNum(k) + '</div>';
      var e = D.essen[k] || {}, st = stOf(k);
      html += '<button type="button" class="row' + (k === todayKey ? ' today' : '') + '" data-day="' + k + '" data-focus="essen">' +
        '<span class="rdate">' + relShort(k) + '<small>' + dayNum(k) + '</small></span>' +
        '<span class="rst" title="' + (st ? escapeHtml(STATUS[st].label) : '') + '" aria-hidden="true">' + (st ? STATUS[st].icon : '') + '</span>' +
        '<span class="rmain">' + (e.gericht
          ? '<b>' + escapeHtml(e.gericht) + '</b>' + (KOCH[e.koch] ? '<small>' + escapeHtml(KOCH[e.koch].satz) + '</small>' : '')
          : '<b class="muted">+ Abendessen planen</b>') + '</span>' +
        '<span class="rgo" aria-hidden="true">›</span></button>';
    }
    $('essenListe').innerHTML = html;

    var last = lastEaten();
    var ids = Object.keys(D.ideen).sort(function (a, b) {
      return String(D.ideen[a].name || '').localeCompare(String(D.ideen[b].name || ''), 'de');
    });
    $('ideenListe').innerHTML = ids.length ? ids.map(function (id) {
      var it = D.ideen[id];
      var z = Array.isArray(it.zutaten) ? it.zutaten : [];
      var l = last[lower(it.name)];
      var lastTxt = l ? zuletzt(l) : '';
      return '<div class="idea" data-idee="' + escapeHtml(id) + '">' +
        '<div><b>' + escapeHtml(it.name) + '</b>' +
          (z.length ? '<small>' + escapeHtml(z.join(' · ')) + '</small>' : '') +
          (lastTxt ? '<small class="last">' + escapeHtml(lastTxt) + '</small>' : '') + '</div>' +
        '<div class="idea-acts">' +
          '<button type="button" data-act="plan">📅 Einplanen</button>' +
          '<button type="button" data-act="cart"' + (z.length ? '' : ' disabled') + ' title="Zutaten auf die Einkaufsliste">🛒 Zutaten</button>' +
          '<button type="button" class="edit" data-act="edit" aria-label="Bearbeiten">✎</button>' +
        '</div></div>';
    }).join('') : '<div class="card empty-hint" style="grid-column:1/-1">Hier sammelt ihr eure Lieblingsgerichte – mit Zutaten wandern sie per Knopfdruck auf die Einkaufsliste.</div>';

    $('gerichteListe').innerHTML = ids.map(function (id) { return '<option value="' + escapeHtml(D.ideen[id].name) + '">'; }).join('');
  }

  function splitZutaten(s) {
    return String(s || '').split(/[,;\n]+/).map(trim).filter(Boolean).slice(0, 40);
  }

  $('ideeForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = trim($('ideeName').value);
    if (!name) { $('ideeName').focus(); return; }
    if (ideaByName(name)) { toast('„' + name + '“ gibt es schon'); return; }
    var o = { name: name };
    var z = splitZutaten($('ideeZutaten').value);
    if (z.length) o.zutaten = z;
    save('ideen/' + newId('ideen'), stamp(o));
    $('ideeName').value = '';
    $('ideeZutaten').value = '';
    toast('„' + name + '“ gemerkt');
  });
  $('ideeName').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && trim(this.value)) { e.preventDefault(); $('ideeZutaten').focus(); }
  });

  $('ideenListe').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    var card = e.target.closest('[data-idee]');
    if (!b || !card) return;
    var id = card.getAttribute('data-idee'), it = D.ideen[id];
    if (!it) return;
    var act = b.getAttribute('data-act');
    if (act === 'cart') addEinkauf(it.zutaten || []);
    else if (act === 'plan') openPlan(it.name);
    else if (act === 'edit') openIdeeEdit(id);
  });

  function openPlan(name) {
    var rows = '';
    for (var i = 0; i < 14; i++) {
      var k = addDays(todayKey, i), st = stOf(k), ger = gerichtOf(k);
      rows += '<button type="button" data-pick="' + k + '"><span>' + (st ? STATUS[st].icon + ' ' : '') + relShort(k) + ' ' + dayNum(k) + '</span>' +
        '<small>' + (ger ? escapeHtml(ger) : 'frei') + '</small></button>';
    }
    openSheet(
      '<div class="m-head"><div><h3 id="mTitle">Wann gibt’s ' + escapeHtml(name) + '?</h3>' +
      '<div class="sub">Tag antippen – ein schon geplantes Essen wird ersetzt.</div></div>' +
      '<button class="m-x" type="button" data-close aria-label="Schließen">✕</button></div>' +
      '<div class="pick-list">' + rows + '</div>'
    );
    modal.querySelectorAll('[data-pick]').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-pick');
        var alt = D.essen[k] || {};
        var neu = { gericht: name };
        if (alt.koch) neu.koch = alt.koch;
        closeSheet();
        save('essen/' + k, stamp(neu));
        toast(name + ' für ' + relLong(k) + ' eingeplant', function () { save('essen/' + k, alt.gericht ? alt : null); });
      });
    });
  }

  function openIdeeEdit(id) {
    var it = D.ideen[id];
    openSheet(
      '<div class="m-head"><div><h3 id="mTitle">Gericht ändern</h3></div>' +
      '<button class="m-x" type="button" data-close aria-label="Schließen">✕</button></div>' +
      '<div class="field"><label for="edName">Name</label><input id="edName" maxlength="80" value="' + escapeHtml(it.name) + '" data-autofocus></div>' +
      '<div class="field"><label for="edZ">Zutaten (mit Komma)</label><textarea id="edZ" rows="3" maxlength="300">' + escapeHtml((it.zutaten || []).join(', ')) + '</textarea></div>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn danger" id="edDel" aria-label="Löschen">🗑</button>' +
        '<button type="button" class="btn ghost" data-close>Abbrechen</button>' +
        '<button type="button" class="btn primary" id="edSave">Speichern</button>' +
      '</div><div class="modal-meta">' + escapeHtml(byLine(it)) + '</div>'
    );
    $('edSave').addEventListener('click', function () {
      var name = trim($('edName').value);
      if (!name) { $('edName').focus(); return; }
      var neu = clone(it);
      neu.name = name;
      var z = splitZutaten($('edZ').value);
      if (z.length) neu.zutaten = z; else delete neu.zutaten;
      closeSheet();
      save('ideen/' + id, neu);
    });
    $('edDel').addEventListener('click', function () {
      var alt = clone(it);
      closeSheet();
      save('ideen/' + id, null);
      toast('„' + alt.name + '“ gelöscht', function () { save('ideen/' + id, alt); });
    });
  }

  $('zufallBtn').addEventListener('click', function () {
    var ids = Object.keys(D.ideen);
    if (!ids.length) { toast('Zuerst ein paar Gerichte merken'); $('ideeName').focus(); return; }
    var last = lastEaten();
    var prev = '';
    function roll() {
      // Was in den letzten 4 Tagen dran war, kommt nur, wenn sonst nichts übrig ist
      var pool = ids.filter(function (id) {
        var l = last[lower(D.ideen[id].name)];
        return D.ideen[id].name !== prev && !(l && l >= addDays(todayKey, -4));
      });
      if (!pool.length) pool = ids.filter(function (id) { return D.ideen[id].name !== prev; });
      if (!pool.length) pool = ids;
      var it = D.ideen[pool[Math.floor(Math.random() * pool.length)]];
      prev = it.name;
      var l = last[lower(it.name)];
      $('diceName').textContent = it.name;
      $('diceSub').textContent = l ? zuletzt(l) : 'noch nie eingeplant';
      var dn = $('diceName');
      dn.style.animation = 'none'; void dn.offsetWidth; dn.style.animation = '';
    }
    openSheet(
      '<div class="m-head"><div><h3 id="mTitle">🎲 Wie wär’s mit …</h3></div>' +
      '<button class="m-x" type="button" data-close aria-label="Schließen">✕</button></div>' +
      '<div class="dice" id="diceName"></div><div class="dice-sub" id="diceSub"></div>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn ghost" id="diceAgain">Nochmal</button>' +
        '<button type="button" class="btn primary" id="diceToday">Heute kochen</button>' +
      '</div>'
    );
    roll();
    $('diceAgain').addEventListener('click', roll);
    $('diceToday').addEventListener('click', function () {
      var alt = D.essen[todayKey] || {};
      var neu = { gericht: prev };
      if (alt.koch) neu.koch = alt.koch;
      closeSheet();
      save('essen/' + todayKey, stamp(neu));
      toast(prev + ' für heute eingeplant', function () { save('essen/' + todayKey, alt.gericht ? alt : null); });
    });
  });

  /* =========================================================
     EINKAUF
     ========================================================= */

  var chipEdit = false;

  function openItems() {
    return Object.keys(D.einkauf).filter(function (id) { return !D.einkauf[id].done; });
  }
  function findOpen(text) {
    var n = lower(ohneMenge(text));
    var ids = openItems();
    for (var i = 0; i < ids.length; i++) if (lower(ohneMenge(D.einkauf[ids[i]].text)) === n) return ids[i];
    return null;
  }

  // Ein oder mehrere Einträge (Text mit Kommas oder eine Liste)
  function addEinkauf(input) {
    var parts = Array.isArray(input) ? input.map(trim).filter(Boolean) : splitZutaten(input);
    var u = {}, added = [], dupes = [], seen = {};
    parts.forEach(function (p) {
      p = p.slice(0, 80);
      var n = lower(ohneMenge(p));
      if (seen[n] || findOpen(p)) { dupes.push(p); return; }
      seen[n] = true;
      u['einkauf/' + newId('einkauf')] = stamp({ text: p });
      var vk = verlaufKey(p), old = D.verlauf[vk] || {};
      u['verlauf/' + vk] = { name: ohneMenge(p), n: (old.n || 0) + 1, ts: Date.now() };
      added.push(p);
    });
    if (added.length) saveMany(u);
    if (added.length === 1) toast('„' + added[0] + '“ steht auf der Liste');
    else if (added.length) toast(added.length + ' Sachen auf die Liste gesetzt');
    else if (dupes.length) toast(dupes.length === 1 ? '„' + dupes[0] + '“ steht schon drauf' : 'Steht schon alles drauf');
    return added.length;
  }

  $('einkaufForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('einkaufInput');
    if (!trim(inp.value)) { inp.focus(); return; }
    addEinkauf(inp.value);
    inp.value = '';
    inp.focus();
  });

  function itemHtml(id) {
    var it = D.einkauf[id];
    var meta = it.done
      ? 'erledigt' + (it.doneBy && LEUTE[it.doneBy] ? ' von ' + LEUTE[it.doneBy].name : '') + (it.doneTs ? ' · ' + ago(it.doneTs) : '')
      : byLine(it);
    return '<div class="item' + (it.done ? ' done' : '') + '" data-item="' + escapeHtml(id) + '">' +
      '<button type="button" class="chk" data-act="toggle" aria-label="' + (it.done ? 'Wieder offen' : 'Abhaken') + ': ' + escapeHtml(it.text) + '">✓</button>' +
      '<button type="button" class="it-text" data-act="edit"><span>' + escapeHtml(it.text) + '</span>' +
        (meta ? '<small>' + escapeHtml(meta) + '</small>' : '') + '</button>' +
      '<button type="button" class="it-x" data-act="del" aria-label="Löschen: ' + escapeHtml(it.text) + '">×</button>' +
    '</div>';
  }

  function renderEinkauf() {
    var open = openItems().sort(function (a, b) { return (D.einkauf[a].ts || 0) - (D.einkauf[b].ts || 0); });
    var done = Object.keys(D.einkauf).filter(function (id) { return D.einkauf[id].done; })
      .sort(function (a, b) { return (D.einkauf[b].doneTs || 0) - (D.einkauf[a].doneTs || 0); });

    var badge = $('einkaufBadge');
    badge.hidden = !open.length;
    badge.textContent = open.length;

    // Nach Regal gruppieren, in der Reihenfolge eines Supermarkts
    var groups = {};
    open.forEach(function (id) {
      var k = katOf(D.einkauf[id]);
      (groups[k] = groups[k] || []).push(id);
    });
    var html = '';
    KATS.concat([KAT_SONST]).forEach(function (k) {
      if (!groups[k.id]) return;
      html += '<div class="shop-group"><h3><i aria-hidden="true">' + k.icon + '</i>' + escapeHtml(k.label) + '</h3>' +
        '<div class="card items">' + groups[k.id].map(itemHtml).join('') + '</div></div>';
    });
    if (!open.length) {
      html = '<div class="card empty-hint">' + (done.length ? '🎉 Alles erledigt!' : 'Die Liste ist leer.') +
        '<br>Oben eintippen oder einen Vorschlag antippen.</div>';
    }
    if (done.length) {
      html += '<div class="done-head"><h2 class="sec-h">Erledigt (' + done.length + ')</h2>' +
        '<button type="button" class="pill-btn" id="clearDone">Erledigte entfernen</button></div>' +
        '<div class="card items">' + done.slice(0, 30).map(itemHtml).join('') + '</div>';
    }
    $('einkaufListe').innerHTML = html;

    // Vorschläge: was oft gekauft wird und gerade nicht auf der Liste steht
    var offenNamen = {};
    open.forEach(function (id) { offenNamen[verlaufKey(D.einkauf[id].text)] = true; });
    var vs = Object.keys(D.verlauf).filter(function (k) { return !offenNamen[k] && D.verlauf[k] && D.verlauf[k].name; })
      .sort(function (a, b) {
        var x = D.verlauf[a], y = D.verlauf[b];
        return ((y.n || 0) - (x.n || 0)) || ((y.ts || 0) - (x.ts || 0));
      }).slice(0, 14);
    $('vorschlaege').innerHTML = vs.length
      ? vs.map(function (k) {
          return '<button type="button" class="chip' + (chipEdit ? ' x' : '') + '" data-vk="' + escapeHtml(k) + '">' +
            '<span class="plus" aria-hidden="true">' + (chipEdit ? '×' : '+') + '</span>' + escapeHtml(D.verlauf[k].name) + '</button>';
        }).join('') +
        '<button type="button" class="chip tool" id="chipEditBtn">' + (chipEdit ? 'Fertig' : '✎') + '</button>'
      : '';
  }

  $('vorschlaege').addEventListener('click', function (e) {
    if (e.target.closest('#chipEditBtn')) { chipEdit = !chipEdit; renderEinkauf(); return; }
    var c = e.target.closest('[data-vk]');
    if (!c) return;
    var k = c.getAttribute('data-vk'), v = D.verlauf[k];
    if (!v) return;
    if (chipEdit) save('verlauf/' + k, null);
    else addEinkauf([v.name]);
  });

  function toggleItem(id) {
    var it = clone(D.einkauf[id]);
    if (!it) return;
    if (it.done) { delete it.done; delete it.doneBy; delete it.doneTs; }
    else { it.done = true; it.doneBy = me || ''; it.doneTs = Date.now(); }
    save('einkauf/' + id, it);
  }

  $('einkaufListe').addEventListener('click', function (e) {
    if (e.target.closest('#clearDone')) {
      var u = {}, alt = {};
      Object.keys(D.einkauf).forEach(function (id) {
        if (D.einkauf[id].done) { u['einkauf/' + id] = null; alt['einkauf/' + id] = clone(D.einkauf[id]); }
      });
      var n = Object.keys(u).length;
      saveMany(u);
      toast(n + (n === 1 ? ' Eintrag' : ' Einträge') + ' entfernt', function () { saveMany(alt); });
      return;
    }
    var b = e.target.closest('[data-act]'), row = e.target.closest('[data-item]');
    if (!b || !row) return;
    var id = row.getAttribute('data-item');
    if (!D.einkauf[id]) return;
    var act = b.getAttribute('data-act');
    if (act === 'toggle') toggleItem(id);
    else if (act === 'edit') openItemEdit(id);
    else if (act === 'del') {
      var alt1 = clone(D.einkauf[id]);
      save('einkauf/' + id, null);
      toast('„' + alt1.text + '“ gelöscht', function () { save('einkauf/' + id, alt1); });
    }
  });

  function openItemEdit(id) {
    var it = D.einkauf[id];
    var auto = autoKat(it.text);
    var cur = it.kat || '';
    openSheet(
      '<div class="m-head"><div><h3 id="mTitle">Eintrag ändern</h3></div>' +
      '<button class="m-x" type="button" data-close aria-label="Schließen">✕</button></div>' +
      '<div class="field"><label for="edText">Was</label><input id="edText" maxlength="80" value="' + escapeHtml(it.text) + '" data-autofocus></div>' +
      '<div class="field"><label for="edKat">Regal</label><select id="edKat">' +
        '<option value="">Automatisch (' + escapeHtml(katById(auto).label) + ')</option>' +
        KATS.concat([KAT_SONST]).map(function (k) {
          return '<option value="' + k.id + '"' + (cur === k.id ? ' selected' : '') + '>' + k.icon + ' ' + escapeHtml(k.label) + '</option>';
        }).join('') +
      '</select></div>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn danger" id="edDel" aria-label="Löschen">🗑</button>' +
        '<button type="button" class="btn ghost" data-close>Abbrechen</button>' +
        '<button type="button" class="btn primary" id="edSave">Speichern</button>' +
      '</div><div class="modal-meta">' + escapeHtml(byLine(it)) + '</div>'
    );
    $('edText').addEventListener('input', function () {
      $('edKat').options[0].textContent = 'Automatisch (' + katById(autoKat(this.value)).label + ')';
    });
    $('edSave').addEventListener('click', function () {
      var text = trim($('edText').value);
      if (!text) { $('edText').focus(); return; }
      var neu = clone(it);
      neu.text = text.slice(0, 80);
      var k = $('edKat').value;
      if (k) neu.kat = k; else delete neu.kat;
      closeSheet();
      save('einkauf/' + id, neu);
    });
    $('edDel').addEventListener('click', function () {
      var alt = clone(it);
      closeSheet();
      save('einkauf/' + id, null);
      toast('„' + alt.text + '“ gelöscht', function () { save('einkauf/' + id, alt); });
    });
  }

  $('shareBtn').addEventListener('click', function () {
    var open = openItems().sort(function (a, b) { return (D.einkauf[a].ts || 0) - (D.einkauf[b].ts || 0); });
    if (!open.length) { toast('Die Liste ist leer'); return; }
    var text = '🛒 Einkaufsliste\n' + open.map(function (id) { return '• ' + D.einkauf[id].text; }).join('\n');
    if (navigator.share) {
      navigator.share({ text: text }).catch(function () { /* abgebrochen */ });
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Liste kopiert – jetzt einfügen'); },
        function () { toast('Kopieren hat nicht geklappt'); });
    } else {
      window.prompt('Zum Kopieren:', text);
    }
  });

  /* =========================================================
     NOTIZEN
     ========================================================= */

  function linkify(escaped) {
    return escaped.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)"'])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  function renderNotizen(calm) {
    var ids = Object.keys(D.notizen).sort(function (a, b) {
      var x = D.notizen[a], y = D.notizen[b];
      return ((y.pin ? 1 : 0) - (x.pin ? 1 : 0)) || ((y.ts || 0) - (x.ts || 0));
    });
    var box = $('notizListe');
    box.classList.toggle('calm', !!calm);
    box.innerHTML = ids.length ? ids.map(function (id) {
      var n = D.notizen[id];
      return '<div class="note' + (n.pin ? ' pin' : '') + '" data-note="' + escapeHtml(id) + '">' +
        '<div class="note-text">' + linkify(escapeHtml(n.text)) + '</div>' +
        '<div class="note-foot"><small>' + escapeHtml(byLine(n)) + '</small>' +
          '<div class="note-acts">' +
            '<button type="button" data-act="pin" class="' + (n.pin ? 'on' : '') + '" aria-label="' + (n.pin ? 'Nicht mehr anheften' : 'Anheften') + '" title="Anheften">📌</button>' +
            '<button type="button" data-act="edit" aria-label="Bearbeiten" title="Bearbeiten">✎</button>' +
            '<button type="button" data-act="del" aria-label="Löschen" title="Löschen">🗑</button>' +
          '</div></div></div>';
    }).join('') : '<div class="card empty-hint" style="grid-column:1/-1">Noch keine Notizen. Alles, was ihr beide wissen solltet, kommt hierher.</div>';
  }

  $('notizForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var text = String($('notizInput').value).trim();
    if (!text) { $('notizInput').focus(); return; }
    save('notizen/' + newId('notizen'), stamp({ text: text.slice(0, 2000) }));
    $('notizInput').value = '';
    toast('Notiz gespeichert');
  });

  $('notizListe').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'), card = e.target.closest('[data-note]');
    if (!b || !card) return;
    var id = card.getAttribute('data-note'), n = D.notizen[id];
    if (!n) return;
    var act = b.getAttribute('data-act');
    if (act === 'pin') {
      var neu = clone(n);
      if (neu.pin) delete neu.pin; else neu.pin = true;
      save('notizen/' + id, neu);
    } else if (act === 'del') {
      var alt = clone(n);
      save('notizen/' + id, null);
      toast('Notiz gelöscht', function () { save('notizen/' + id, alt); });
    } else if (act === 'edit') {
      openSheet(
        '<div class="m-head"><div><h3 id="mTitle">Notiz bearbeiten</h3></div>' +
        '<button class="m-x" type="button" data-close aria-label="Schließen">✕</button></div>' +
        '<div class="field"><textarea id="edNote" rows="7" maxlength="2000" aria-label="Notiz" data-autofocus>' + escapeHtml(n.text) + '</textarea></div>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn ghost" data-close>Abbrechen</button>' +
          '<button type="button" class="btn primary" id="edSave">Speichern</button>' +
        '</div><div class="modal-meta">' + escapeHtml(byLine(n)) + '</div>'
      );
      $('edSave').addEventListener('click', function () {
        var text = String($('edNote').value).trim();
        if (!text) { $('edNote').focus(); return; }
        var neu2 = clone(n);
        neu2.text = text.slice(0, 2000);
        closeSheet();
        if (neu2.text !== n.text) save('notizen/' + id, stamp(neu2));
      });
    }
  });

  /* =========================================================
     ALLES ZEICHNEN
     ========================================================= */

  var firstRender = true;
  function renderAll() {
    todayKey = keyOfDate(new Date());
    var calm = !firstRender;
    renderToday();
    renderKalender(calm);
    renderNext();
    renderEssen();
    renderEinkauf();
    renderNotizen(calm);
    firstRender = false;
  }

  // Nach dem Aufwachen (Handy aus der Tasche): neues Datum, "vor 5 Min." frisch
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') renderAll();
  });

  $('footerInfo').innerHTML = 'Zusammen · für ' + GAST.name + ' &amp; ' + GASTGEBER.name + '<br>Stand ' + APP_STAND;

  renderMe();
  renderLegend();
  setTab(tab);
  renderAll();
  startSync();
  if (!me) setTimeout(openMe, 600);
})();
</script>
</body>
</html>
