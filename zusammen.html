<!DOCTYPE html>
<html lang="de" class="n-themed">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zusammen</title>
  <meta name="description" content="Tobias &amp; Daniel: wann Tobias bei Daniel ist, was es zu essen gibt, die gemeinsame Einkaufsliste und Notizen.">

  <!-- Eigenes App-Manifest & Icons für „Zum Startbildschirm hinzufügen" -->
  <link rel="manifest" href="zusammen.webmanifest">
  <meta name="theme-color" content="#0b1411" data-design>
  <link rel="icon" type="image/svg+xml" href="icons/zusammen.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/zusammen-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/zusammen-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/zusammen-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" data-design>
  <meta name="apple-mobile-web-app-title" content="Zusammen">

  <!-- Design-Auswahl von der Startseite (Farben, Schriften, Übergänge) -->
  <script src="design.js"></script>
  <link rel="stylesheet" href="design.css">

  <style>
    :root {
      /* Farbe dieser App im Design „Papier & Farbe“ */
      --n-app: #d9468f;

      /* Wer ist wann da – die drei Zustände im Kalender */
      --st-da: var(--n-accent);
      --st-nacht: var(--n-info);
      --st-viel: var(--n-warn);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--n-font);
      background-color: var(--n-bg);
      color: var(--n-text);
      min-height: 100vh;
      background-image: var(--n-bg-deco);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      padding-bottom: 40px;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--n-accent-2); outline-offset: 2px; }
    [hidden] { display: none !important; }

    /* ---------- Kopfleiste ---------- */
    .top-nav {
      width: 100%;
      padding: max(15px, env(safe-area-inset-top)) 20px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--n-nav);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--n-line);
      position: sticky;
      top: 0;
      z-index: 100;
      animation: n-fade 0.6s ease backwards;
    }
    .top-nav a.home {
      color: var(--n-text);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--n-surface);
      padding: 8px 16px 8px 10px;
      border-radius: var(--n-r-pill);
      border: 1px solid var(--n-line);
      transition: background 0.2s, transform 0.4s var(--n-ease);
      white-space: nowrap;
    }
    .top-nav a.home:hover { background: var(--n-surface-2); }
    .top-nav a.home:active { transform: scale(0.96); }
    .n-back {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--n-active-bg);
      color: var(--n-active-fg);
      font-size: 0.85rem;
      transition: transform 0.4s var(--n-ease);
    }
    html[data-design="raster"] .n-back { border-radius: 0; }
    .top-nav a.home:hover .n-back { transform: translateX(-3px); }
    .nav-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--n-font-display);
      font-weight: var(--n-display-weight);
      font-stretch: var(--n-display-stretch);
      text-transform: var(--n-display-case);
      font-size: 1.15rem;
      letter-spacing: var(--n-display-track);
      white-space: nowrap;
    }
    .me-btn {
      background: var(--n-surface);
      border: 1px solid var(--n-line);
      border-radius: var(--n-r-pill);
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, transform 0.15s;
    }
    .me-btn:hover { background: var(--n-surface-2); }
    .me-btn:active { transform: scale(0.95); }
    .me-btn.unset { color: var(--n-accent-2); border-color: var(--n-accent); }

    .container { max-width: 820px; margin: 0 auto; padding: 22px 16px 0; }

    /* ---------- Verbindung ---------- */
    .sync-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; font-size: 0.82rem; }
    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--n-muted);
      font-weight: 600;
      background: var(--n-surface);
      border: 1px solid var(--n-line);
      padding: 6px 13px;
      border-radius: var(--n-r-pill);
    }
    .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--n-faint); flex-shrink: 0; }
    .status.live i { background: var(--n-ok); box-shadow: 0 0 8px var(--n-ok); }
    .status.live { color: var(--n-ok); }
    .status.err i { background: var(--n-bad); }
    .status.err { color: var(--n-bad); }
    html[data-design="raster"] .status i { border-radius: 0; }

    .notice {
      background: color-mix(in srgb, var(--n-bad) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--n-bad) 32%, transparent);
      color: var(--n-bad);
      border-radius: var(--n-r);
      padding: 11px 14px;
      margin-bottom: 16px;
      font-size: 0.88rem;
      font-weight: 300;
      line-height: 1.5;
    }

    /* ---------- Reiter ---------- */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: var(--n-surface);
      border: 1px solid var(--n-line);
      border-radius: var(--n-r-lg);
      padding: 6px;
      margin-bottom: 20px;
    }
    .tabs button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent;
      border: none;
      border-radius: calc(var(--n-r-lg) - 5px);
      padding: 10px 8px;
      color: var(--n-muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.3s var(--n-ease), color 0.3s;
    }
    .tabs button:hover { color: var(--n-text); background: var(--n-surface-2); }
    .tabs button.active { background: var(--n-active-bg); color: var(--n-active-fg); }
    .tabs .ti { font-size: 1.05rem; line-height: 1; }
    .tabs .badge {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: var(--n-r-pill);
      background: var(--n-accent);
      color: var(--n-on-accent);
      font-size: 0.72rem;
      font-weight: 800;
      display: inline-grid;
      place-items: center;
      font-variant-numeric: tabular-nums;
    }
    .tabs button.active .badge { background: var(--n-active-fg); color: var(--n-active-bg); }

    .pane { animation: var(--n-enter) 0.55s var(--n-enter-ease) backwards; }

    /* ---------- Gemeinsame Bausteine ---------- */
    .sec-h {
      font-family: var(--n-label-font);
      text-transform: var(--n-label-case);
      letter-spacing: var(--n-label-track);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--n-muted);
      margin: 26px 0 10px;
    }
    .sec-h-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 26px 0 10px; }
    .sec-h-row .sec-h { margin: 0; }

    .card {
      background: var(--n-surface);
      border: 1px solid var(--n-line);
      border-radius: var(--n-r-lg);
      box-shadow: var(--n-shadow);
    }
    .list { padding: 4px 16px; }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 0;
      background: none;
      border: none;
      border-bottom: 1px solid var(--n-line);
      text-align: left;
      cursor: pointer;
    }
    .row:last-child { border-bottom: none; }
    .row:hover .rmain b { color: var(--n-accent-2); }
    .row .rdate { width: 62px; flex-shrink: 0; font-weight: 700; font-size: 0.9rem; line-height: 1.25; }
    .row .rdate small { display: block; color: var(--n-muted); font-weight: 300; font-size: 0.76rem; font-variant-numeric: tabular-nums; }
    .row.today .rdate { color: var(--n-accent-2); }
    .row .rst { width: 24px; flex-shrink: 0; text-align: center; font-size: 1rem; }
    .row .rmain { flex: 1; min-width: 0; line-height: 1.35; }
    .row .rmain b { display: block; font-weight: 600; transition: color 0.2s; overflow-wrap: anywhere; }
    .row .rmain small { display: block; color: var(--n-muted); font-weight: 300; font-size: 0.8rem; margin-top: 1px; }
    .row .rmain .muted { color: var(--n-faint); font-weight: 400; }
    .row .rgo { color: var(--n-faint); flex-shrink: 0; font-size: 1.1rem; }
    .list-sep {
      font-family: var(--n-label-font);
      text-transform: var(--n-label-case);
      letter-spacing: var(--n-label-track);
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--n-faint);
      padding: 14px 0 4px;
      border-bottom: 1px solid var(--n-line);
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--n-surface);
      border: 1px solid var(--n-line);
      color: var(--n-muted);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: var(--n-r-pill);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .pill-btn:hover { background: var(--n-surface-2); color: var(--n-text); border-color: var(--n-line-2); }
    .pill-btn.on { background: var(--n-active-bg); color: var(--n-active-fg); border-color: transparent; }

    .btn {
      border: none;
      border-radius: var(--n-r);
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, filter 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: var(--n-accent); color: var(--n-on-accent); }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.ghost { background: var(--n-surface-2); color: var(--n-text); border: 1px solid var(--n-line); }
    .btn.danger { background: color-mix(in srgb, var(--n-bad) 14%, transparent); color: var(--n-bad); border: 1px solid color-mix(in srgb, var(--n-bad) 35%, transparent); }

    .input, .field input, .field select, .field textarea {
      width: 100%;
      background: var(--n-field);
      border: 1px solid var(--n-line-2);
      border-radius: var(--n-r-sm);
      padding: 11px 12px;
      font-size: 1rem;
      color: var(--n-text);
    }
    .input:focus, .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: var(--n-accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--n-accent) 22%, transparent);
    }
    textarea { resize: vertical; line-height: 1.45; }

    .empty-hint { text-align: center; color: var(--n-muted); font-weight: 300; padding: 26px 12px; line-height: 1.55; font-size: 0.92rem; }

    /* ---------- Heute ---------- */
    .today-card { padding: 18px; margin-bottom: 22px; }
    .tc-kicker {
      font-family: var(--n-label-font);
      text-transform: var(--n-label-case);
      letter-spacing: var(--n-label-track);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--n-muted);
    }
    .tc-main {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      margin: 10px 0 14px;
      padding: 0;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
    }
    .tc-ico {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      border-radius: var(--n-r);
      background: var(--n-field);
      border: 1px solid var(--n-line);
    }
    .tc-main.st-da .tc-ico { background: color-mix(in srgb, var(--st-da) 20%, transparent); border-color: color-mix(in srgb, var(--st-da) 45%, transparent); }
    .tc-main.st-nacht .tc-ico { background: color-mix(in srgb, var(--st-nacht) 20%, transparent); border-color: color-mix(in srgb, var(--st-nacht) 45%, transparent); }
    .tc-main.st-vielleicht .tc-ico { border-style: dashed; border-color: var(--st-viel); }
    .tc-main b {
      display: block;
      font-family: var(--n-font-display);
      font-weight: var(--n-display-weight);
      font-stretch: var(--n-display-stretch);
      text-transform: var(--n-display-case);
      letter-spacing: var(--n-display-track);
      font-size: 1.3rem;
      line-height: 1.2;
    }
    html[data-design="loch"] .tc-main b { font-weight: 400; }
    html[data-design="raster"] .tc-main b { font-size: 1.1rem; }
    .tc-main small { display: block; color: var(--n-muted); font-weight: 300; font-size: 0.86rem; margin-top: 3px; }
    .tc-grid { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 10px; }
    .tc-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      padding: 11px 12px;
      background: var(--n-field);
      border: 1px solid var(--n-line);
      border-radius: var(--n-r);
      text-align: left;
      line-height: 1.3;
    }
    button.tc-item { cursor: pointer; transition: border-color 0.2s, transform 0.3s var(--n-ease); }
    button.tc-item:hover { border-color: var(--n-line-2); transform: translateY(-2px); }
    .tc-lbl { font-size: 0.74rem; color: var(--n-muted); font-weight: 600; }
    .tc-val { font-weight: 700; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tc-val.muted { color: var(--n-faint); font-weight: 400; }
    .tc-item small { color: var(--n-muted); font-weight: 300; font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tc-shift { display: flex; justify-content: space-between; gap: 8px; font-size: 0.84rem; font-variant-numeric: tabular-nums; }
    .tc-shift span { color: var(--n-muted); }
    .tc-shift b { font-weight: 600; white-space: nowrap; }
    .tc-shift b.free { color: var(--n-ok); font-weight: 500; }
    .tc-shift b.unk { color: var(--n-faint); font-weight: 300; }

    /* ---------- Kalender ---------- */
    .month-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .month-name {
      font-family: var(--n-font-display);
      font-size: 1.8rem;
      font-weight: var(--n-display-weight);
      font-stretch: var(--n-display-stretch);
      text-transform: var(--n-display-case);
      letter-spacing: var(--n-display-track);
      line-height: 1.1;
      text-align: center;
    }
    .month-name span { color: var(--n-muted); font-weight: 300; margin-left: 6px; }
    html[data-design="loch"] .month-name { font-weight: 300; font-size: 2.1rem; }
    html[data-design="loch"] .month-name span { font-style: italic; color: var(--n-accent); font-weight: 400; }
    html[data-design="raster"] .month-name span { color: var(--n-accent); font-weight: 800; }
    .icon-btn {
      background: var(--n-surface);
      border: 1px solid var(--n-line);
      border-radius: var(--n-r);
      padding: 8px 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .icon-btn:hover { background: var(--n-surface-2); border-color: var(--n-line-2); }
    .icon-btn:active { transform: scale(0.94); }

    .cal-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .cal-stats { font-size: 0.85rem; color: var(--n-muted); font-weight: 300; }
    .cal-stats b { color: var(--n-text); font-weight: 700; font-variant-numeric: tabular-nums; }
    .quick-hint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding: 10px 12px 10px 14px;
      border-radius: var(--n-r);
      background: color-mix(in srgb, var(--n-accent) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--n-accent) 35%, transparent);
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .quick-hint button { flex-shrink: 0; }

    .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
    .weekdays { margin-bottom: 7px; }
    .weekdays div {
      text-align: center;
      font-family: var(--n-label-font);
      text-transform: var(--n-label-case);
      letter-spacing: var(--n-label-track);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--n-muted);
    }
    .day {
      position: relative;
      min-height: 78px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 7px 4px 6px;
      background: var(--n-surface);
      border: 1px solid var(--n-line);
      border-radius: var(--n-r);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.35s var(--n-ease), border-color 0.2s, background 0.2s;
      animation: var(--n-enter) 0.5s var(--n-enter-ease) backwards;
    }
    .day:hover { transform: translateY(-2px); border-color: var(--n-line-2); }
    .day:active { transform: scale(0.95); }
    .grid.calm .day { animation: none; }
    .grid > .day:nth-child(n+8) { animation-delay: 30ms; }
    .grid > .day:nth-child(n+15) { animation-delay: 60ms; }
    .grid > .day:nth-child(n+22) { animation-delay: 90ms; }
    .grid > .day:nth-child(n+29) { animation-delay: 120ms; }
    .day.empty { background: transparent; border-color: transparent; pointer-events: none; }
    .day.weekend { background: transparent; }
    html[data-design="papier"] .day.weekend { border-style: dashed; }
    .day.past { opacity: 0.55; }
    .day.today { border-color: var(--n-accent); box-shadow: 0 0 0 1px var(--n-accent); opacity: 1; }
    html[data-design="raster"] .day.today { box-shadow: inset 0 3px 0 var(--n-accent); }
    .day.st-da { background: color-mix(in srgb, var(--st-da) 18%, transparent); border-color: color-mix(in srgb, var(--st-da) 45%, transparent); border-style: solid; }
    .day.st-nacht { background: color-mix(in srgb, var(--st-nacht) 18%, transparent); border-color: color-mix(in srgb, var(--st-nacht) 45%, transparent); border-style: solid; }
    .day.st-vielleicht { border: 1px dashed var(--st-viel); }
    .day.today.st-da, .day.today.st-nacht { border-color: var(--n-accent); }
    .day .dnum { font-size: 0.82rem; font-weight: 600; color: var(--n-muted); line-height: 1.1; }
    .day.today .dnum, .day[class*="st-"] .dnum { color: var(--n-text); }
    .day .stay { font-size: 1.05rem; line-height: 1.2; min-height: 1.3rem; }
    .day .meal { position: absolute; top: 4px; right: 5px; font-size: 0.62rem; line-height: 1; }
    .day .note-dot { position: absolute; top: 6px; left: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--n-accent-2); }
    html[data-design="raster"] .day .note-dot { border-radius: 0; }
    .who { display: flex; gap: 3px; margin-top: auto; }
    .w {
      width: 15px;
      height: 15px;
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 0.56rem;
      font-weight: 800;
      border-radius: 4px;
      border: 1px solid var(--n-line-2);
      color: var(--n-muted);
      line-height: 1;
    }
    .w.on { background: var(--n-text); border-color: var(--n-text); color: var(--n-bg); }
    .w.none { border-style: dotted; color: var(--n-faint); opacity: 0.6; }
    html[data-design="raster"] .w { border-radius: 0; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      justify-content: center;
      margin: 16px 0 4px;
      color: var(--n-muted);
      font-size: 0.8rem;
      font-weight: 300;
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend .w { display: inline-grid; }

    /* ---------- Essen ---------- */
    .ideas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .idea {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 13px 14px 12px;
      background: var(--n-surface);
      border: 1px solid var(--n-line);
      border-radius: var(--n-r-lg);
      box-shadow: var(--n-shadow);
      min-width: 0;
    }
    .idea b { display: block; font-weight: 700; font-size: 1rem; line-height: 1.3; overflow-wrap: anywhere; }
    .idea small { display: block; color: var(--n-muted); font-weight: 300; font-size: 0.8rem; line-height: 1.4; margin-top: 3px; }
    .idea .last { color: var(--n-faint); }
    .idea-acts { display: flex; gap: 6px; margin-top: auto; }
    .idea-acts button {
      flex: 1;
      background: var(--n-field);
      border: 1px solid var(--n-line);
      border-radius: var(--n-r-sm);
      padding: 7px 4px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--n-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .idea-acts button:hover:not(:disabled) { background: var(--n-surface-2); color: var(--n-text); }
    .idea-acts button:disabled { opacity: 0.4; cursor: default; }
    .idea-acts button.edit { flex: 0 0 38px; }

    .add-form { display: grid; gap: 8px; padding: 12px; margin-bottom: 12px; }
    .add-form .row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

    /* ---------- Einkauf ---------- */
    .add-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    .add-bar .input { flex: 1; font-size: 1.02rem; padding: 13px 14px; border-radius: var(--n-r); }
    .add-bar .btn { width: 52px; padding: 0; font-size: 1.5rem; line-height: 1; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .chips:empty { display: none; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--n-field);
      border: 1px solid var(--n-line);
      color: var(--n-text);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 6px 11px;
      border-radius: var(--n-r-pill);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .chip:hover { background: var(--n-surface-2); border-color: var(--n-line-2); }
    .chip:active { transform: scale(0.94); }
    .chip .plus { color: var(--n-accent-2); font-weight: 700; }
    .chip.x .plus { color: var(--n-bad); }
    .chip.tool { color: var(--n-muted); border-style: dashed; }

    .shop-group { margin-bottom: 14px; }
    .shop-group h3 {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--n-label-font);
      text-transform: var(--n-label-case);
      letter-spacing: var(--n-label-track);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--n-muted);
      margin: 0 2px 6px;
    }
    .shop-group h3 i { font-style: normal; font-size: 0.9rem; letter-spacing: 0; }
    .items { padding: 2px 6px 2px 14px; }
    .item { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--n-line); min-height: 50px; }
    .item:last-child { border-bottom: none; }
    .chk {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid var(--n-line-2);
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: transparent;
      font-size: 0.8rem;
      font-weight: 800;
      transition: background 0.2s, border-color 0.2s, transform 0.2s var(--n-spring);
    }
    .chk:hover { border-color: var(--n-accent); }
    .chk:active { transform: scale(0.85); }
    html[data-design="raster"] .chk { border-radius: 0; }
    .item.done .chk { background: var(--n-ok); border-color: var(--n-ok); color: var(--n-bg); }
    .it-text { flex: 1; min-width: 0; background: none; border: none; text-align: left; cursor: pointer; padding: 10px 0; line-height: 1.3; }
    .it-text span { display: block; font-size: 1rem; font-weight: 500; overflow-wrap: anywhere; }
    .it-text small { display: block; color: var(--n-faint); font-weight: 300; font-size: 0.74rem; margin-top: 1px; }
    .item.done .it-text span { text-decoration: line-through; color: var(--n-muted); font-weight: 300; }
    .it-x {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      background: none;
      border: none;
      border-radius: var(--n-r-sm);
      color: var(--n-faint);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .it-x:hover { color: var(--n-bad); background: color-mix(in srgb, var(--n-bad) 10%, transparent); }
    .done-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 2px 8px; }
    .done-head .sec-h { margin: 0; }
    .list-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

    /* ---------- Notizen ---------- */
    .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
    .note {
      padding: 14px 15px 10px;
      background: var(--n-surface);
      border: 1px solid var(--n-line);
      border-radius: var(--n-r-lg);
      box-shadow: var(--n-shadow);
      min-width: 0;
      animation: var(--n-enter) 0.5s var(--n-enter-ease) backwards;
    }
    .notes.calm .note { animation: none; }
    .note.pin { border-color: color-mix(in srgb, var(--n-accent) 55%, transparent); background: color-mix(in srgb, var(--n-accent) 7%, var(--n-surface)); }
    html[data-design="papier"] .note.pin { background: #fff7d6; }
    .note-text { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .note-text a { color: var(--n-accent-2); }
    .note-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--n-line); }
    .note-foot small { color: var(--n-faint); font-size: 0.74rem; font-weight: 300; }
    .note-acts { display: flex; gap: 2px; flex-shrink: 0; }
    .note-acts button {
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      border-radius: var(--n-r-sm);
      cursor: pointer;
      font-size: 0.9rem;
      opacity: 0.6;
      transition: opacity 0.2s, background 0.2s;
    }
    .note-acts button:hover { opacity: 1; background: var(--n-surface-2); }
    .note-acts button.on { opacity: 1; }

    /* ---------- Fenster ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: var(--n-overlay);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }
    .overlay.open { display: flex; animation: n-fade 0.25s ease; }
    .modal {
      background: var(--n-solid);
      border: 1px solid var(--n-line-2);
      border-radius: var(--n-r-lg);
      width: 100%;
      max-width: 440px;
      padding: 22px;
      max-height: 88vh;
      max-height: 88dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
      animation: pop 0.45s var(--n-ease);
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.6);
    }
    @keyframes pop { from { opacity: 0; transform: translateY(24px) scale(0.96); } to { opacity: 1; transform: none; } }
    .m-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .modal h3 {
      font-family: var(--n-font-display);
      font-size: 1.45rem;
      font-weight: var(--n-display-weight);
      font-stretch: var(--n-display-stretch);
      text-transform: var(--n-display-case);
      letter-spacing: var(--n-display-track);
      line-height: 1.15;
    }
    .modal .sub { color: var(--n-muted); font-weight: 300; font-size: 0.9rem; margin-top: 3px; line-height: 1.45; }
    .m-x {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--n-field);
      border: 1px solid var(--n-line);
      border-radius: 50%;
      color: var(--n-muted);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .m-x:hover { background: var(--n-surface-2); color: var(--n-text); }
    html[data-design="raster"] .m-x { border-radius: 0; }
    .m-sec {
      font-family: var(--n-label-font);
      text-transform: var(--n-label-case);
      letter-spacing: var(--n-label-track);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--n-muted);
      margin: 18px 0 8px;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-family: var(--n-label-font);
      text-transform: var(--n-label-case);
      letter-spacing: var(--n-label-track);
      font-size: 0.7rem;
      color: var(--n-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; min-width: 0; }

    .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .seg button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: var(--n-field);
      border: 1px solid var(--n-line);
      border-radius: var(--n-r-sm);
      padding: 9px 4px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--n-muted);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .seg button .si { font-size: 1.15rem; line-height: 1; }
    .seg button:hover { color: var(--n-text); border-color: var(--n-line-2); }
    .seg button.on { background: color-mix(in srgb, var(--n-accent) 16%, transparent); border-color: var(--n-accent); color: var(--n-text); }
    .seg.small button { padding: 8px 4px; }

    .shifts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .shift { padding: 9px 11px; background: var(--n-field); border: 1px solid var(--n-line); border-radius: var(--n-r-sm); line-height: 1.3; }
    .shift span { display: block; font-size: 0.74rem; color: var(--n-muted); font-weight: 600; }
    .shift b { font-size: 0.92rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .shift b.free { color: var(--n-ok); }
    .shift b.unk { color: var(--n-faint); font-weight: 300; }
    .lunch { margin-top: 10px; font-size: 0.8rem; color: var(--n-muted); font-weight: 300; line-height: 1.45; }
    .lunch b { font-weight: 600; color: var(--n-text); }

    .link-btn {
      background: none;
      border: none;
      color: var(--n-accent-2);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 0;
      text-align: left;
    }
    .link-btn:hover { text-decoration: underline; }

    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions .btn { flex: 1; }
    .modal-actions .btn.danger { flex: 0 0 auto; }
    .modal-meta { margin-top: 12px; text-align: center; font-size: 0.76rem; color: var(--n-faint); font-weight: 300; }
    .modal-meta:empty { display: none; }

    .me-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .me-grid button {
      padding: 22px 10px;
      background: var(--n-field);
      border: 1px solid var(--n-line-2);
      border-radius: var(--n-r);
      font-family: var(--n-font-display);
      font-weight: var(--n-display-weight);
      font-stretch: var(--n-display-stretch);
      text-transform: var(--n-display-case);
      font-size: 1.35rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .me-grid button:hover { border-color: var(--n-accent); }
    .me-grid button:active { transform: scale(0.96); }
    .me-grid button.on { background: var(--n-active-bg); color: var(--n-active-fg); border-color: transparent; }

    .pick-list { display: grid; gap: 6px; }
    .pick-list button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--n-field);
      border: 1px solid var(--n-line);
      border-radius: var(--n-r-sm);
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .pick-list button:hover { border-color: var(--n-accent); }
    .pick-list button small { color: var(--n-muted); font-weight: 300; font-size: 0.8rem; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .dice {
      text-align: center;
      padding: 18px 8px 8px;
      font-family: var(--n-font-display);
      font-weight: var(--n-display-weight);
      font-stretch: var(--n-display-stretch);
      text-transform: var(--n-display-case);
      letter-spacing: var(--n-display-track);
      font-size: 1.8rem;
      line-height: 1.15;
      animation: n-pop 0.5s var(--n-spring);
    }
    .dice-sub { text-align: center; color: var(--n-muted); font-size: 0.85rem; font-weight: 300; min-height: 1.2em; }

    /* ---------- Kurzmeldung unten ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 300;
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: calc(100vw - 32px);
      padding: 11px 14px 11px 16px;
      background: var(--n-active-bg);
      color: var(--n-active-fg);
      border-radius: var(--n-r);
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.55);
    }
    .toast.show { animation: toast-in 0.4s var(--n-ease); }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .toast button {
      background: none;
      border: 1px solid currentColor;
      border-radius: var(--n-r-sm);
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    footer { text-align: center; color: var(--n-muted); font-size: 0.82rem; opacity: 0.75; padding: 30px 20px 10px; line-height: 1.5; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ---------- Handy: Reiter wandern nach unten ---------- */
    @media (max-width: 700px) {
      body { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
      .top-nav { padding: max(12px, env(safe-area-inset-top)) 12px 12px; }
      .top-nav a.home { padding: 7px 12px 7px 8px; }
      .nav-title { font-size: 1.02rem; gap: 7px; }
      html[data-design="raster"] .nav-title { font-size: 0.88rem; }
      .me-btn { padding: 7px 11px; font-size: 0.84rem; }
      .container { padding: 16px 12px 0; }

      .tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 150;
        margin: 0;
        gap: 2px;
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
        border: 0;
        border-top: 1px solid var(--n-line);
        border-radius: 0;
        background: var(--n-nav);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .tabs button { flex-direction: column; gap: 3px; padding: 7px 2px 6px; font-size: 0.7rem; border-radius: var(--n-r); }
      .tabs button.active { background: transparent; color: var(--n-text); }
      .tabs .ti {
        font-size: 1.2rem;
        width: 50px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: var(--n-r-pill);
        transition: background 0.3s var(--n-ease);
      }
      .tabs button.active .ti { background: color-mix(in srgb, var(--n-accent) 24%, transparent); }
      .tabs .badge { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 18px; height: 18px; font-size: 0.66rem; }
      .tabs button.active .badge { background: var(--n-accent); color: var(--n-on-accent); }
      .toast { bottom: calc(86px + env(safe-area-inset-bottom)); }

      .today-card { padding: 15px; }
      .tc-main b { font-size: 1.15rem; }
      .tc-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .tc-grid .tc-item.wide { grid-column: span 2; }
      .month-name { font-size: 1.4rem; }
      html[data-design="loch"] .month-name { font-size: 1.6rem; }
      .weekdays, .grid { gap: 4px; }
      .day { min-height: 66px; padding: 5px 2px 4px; border-radius: var(--n-r-sm); }
      .day .dnum { font-size: 0.74rem; }
      .day .stay { font-size: 0.95rem; }
      .w { width: 13px; height: 13px; font-size: 0.5rem; border-radius: 3px; }
      .ideas, .notes { grid-template-columns: 1fr; }
      .modal { padding: 18px; }
      .overlay { padding: 12px; }
    }
    @media (max-width: 400px) {
      .me-btn .me-long { display: none; }
    }
    @media (max-width: 360px) {
      .nav-title .t-long { display: none; }
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="index.html" class="home"><span class="n-back" aria-hidden="true">←</span> Hub</a>
    <div class="nav-title"><img class="n-app-icon" src="icons/zusammen.svg" alt=""> <span class="t-long">Zusammen</span></div>
    <button class="me-btn" id="meBtn" type="button" title="Wer bist du?">👤</button>
  </div>

  <!-- Firebase (Realtime Database, dieselbe Datenbank wie bei WM Wetten und dem Dienstplan) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Die Dienstpläne von Tobias und Daniel – dieselbe Datei wie im Kalender -->
  <script src="dienstplan-daten.js"></script>

  <!-- Mittagsmenüs aus dem Haus (Tobias) – damit abends nicht dasselbe auf den Tisch kommt -->
  <script src="essensplan-daten.js"></script>

  <div class="container">

    <div class="sync-bar">
      <div class="status" id="statusPill"><i></i><span id="statusText">Verbinde …</span></div>
    </div>

    <div id="noticeArea"></div>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Bereiche">
      <button type="button" role="tab" data-tab="kalender"><span class="ti" aria-hidden="true">📅</span><span class="tl">Kalender</span></button>
      <button type="button" role="tab" data-tab="essen"><span class="ti" aria-hidden="true">🍝</span><span class="tl">Essen</span></button>
      <button type="button" role="tab" data-tab="einkauf"><span class="ti" aria-hidden="true">🛒</span><span class="tl">Einkauf</span><b class="badge" id="einkaufBadge" hidden></b></button>
      <button type="button" role="tab" data-tab="notizen"><span class="ti" aria-hidden="true">📝</span><span class="tl">Notizen</span></button>
    </nav>

    <!-- ============ Kalender ============ -->
    <section class="pane" data-pane="kalender" role="tabpanel" aria-label="Kalender">
      <div class="card today-card" id="todayCard"></div>

      <div class="month-bar">
        <button class="icon-btn" id="prevBtn" type="button" aria-label="Vorheriger Monat">‹</button>
        <div class="month-name" id="monthName">—</div>
        <button class="icon-btn" id="nextBtn" type="button" aria-label="Nächster Monat">›</button>
      </div>

      <div class="cal-tools">
        <div class="cal-stats" id="calStats"></div>
        <button class="pill-btn" id="quickBtn" type="button">✎ Schnell eintragen</button>
      </div>
      <div class="quick-hint" id="quickHint" hidden>
        <span>Tippe auf die Tage: leer → 🏠 da → 🌙 übernachtet → ❓ vielleicht → leer.</span>
        <button class="pill-btn on" id="quickDone" type="button">Fertig</button>
      </div>

      <div class="weekdays" aria-hidden="true">
        <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
      </div>
      <div class="grid" id="grid"></div>

      <div class="legend" id="legend"></div>

      <h2 class="sec-h">Als Nächstes</h2>
      <div class="card list" id="nextList"></div>
    </section>

    <!-- ============ Essen ============ -->
    <section class="pane" data-pane="essen" role="tabpanel" aria-label="Essen" hidden>
      <h2 class="sec-h" style="margin-top:0">Abendessen · die nächsten zwei Wochen</h2>
      <div class="card list" id="essenListe"></div>

      <div class="sec-h-row">
        <h2 class="sec-h">Unsere Gerichte</h2>
        <button class="pill-btn" id="zufallBtn" type="button">🎲 Was essen wir?</button>
      </div>
      <form class="card add-form" id="ideeForm" autocomplete="off">
        <input class="input" id="ideeName" placeholder="Gericht, z. B. Spaghetti Bolognese" maxlength="80" enterkeyhint="next">
        <div class="row2">
          <input class="input" id="ideeZutaten" placeholder="Zutaten (optional)" maxlength="300" enterkeyhint="done">
          <button class="btn primary" type="submit">Merken</button>
        </div>
      </form>
      <div class="ideas" id="ideenListe"></div>
    </section>

    <!-- ============ Einkauf ============ -->
    <section class="pane" data-pane="einkauf" role="tabpanel" aria-label="Einkaufsliste" hidden>
      <form class="add-bar" id="einkaufForm" autocomplete="off">
        <input class="input" id="einkaufInput" placeholder="Was brauchen wir?" maxlength="200" enterkeyhint="done" aria-label="Neuer Eintrag">
        <button class="btn primary" type="submit" aria-label="Hinzufügen">+</button>
      </form>
      <div class="chips" id="vorschlaege"></div>
      <div id="einkaufListe"></div>
      <div class="list-actions">
        <button class="pill-btn" id="shareBtn" type="button">📤 Liste teilen</button>
      </div>
    </section>

    <!-- ============ Notizen ============ -->
    <section class="pane" data-pane="notizen" role="tabpanel" aria-label="Notizen" hidden>
      <form class="card add-form" id="notizForm">
        <textarea class="input" id="notizInput" rows="3" maxlength="2000" placeholder="Neue Notiz … z. B. „Schlüssel liegt beim Nachbarn“ oder „Mama hat am 12. Geburtstag“"></textarea>
        <button class="btn primary" type="submit">Notiz speichern</button>
      </form>
      <div class="notes" id="notizListe"></div>
    </section>

    <footer id="footerInfo"></footer>
