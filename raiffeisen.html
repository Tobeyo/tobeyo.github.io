<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mein ELBA</title>
<meta name="description" content="Prank-App">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mein ELBA">
<style>
:root{
  --yellow:#FFE500;
  --bg:#000000;
  --c1:#1c1c1e;
  --c2:#2c2c2e;
  --c3:#3a3a3c;
  --text:#ffffff;
  --muted:#8e8e93;
  --muted2:#636366;
  --green:#7bc47f;
  --red:#ff453a;
  --link:#4a9eff;
  --purple:#5c3a63;
  --line:rgba(255,255,255,0.09);
  --sat:env(safe-area-inset-top);
  --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;font-size:17px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
#root{max-width:520px;margin:0 auto;min-height:100vh;position:relative;}
.hide{display:none !important;}

/* buttons */
.btn-y{background:var(--yellow);color:#111;font-weight:700;border-radius:12px;padding:17px;width:100%;font-size:17px;transition:transform .1s;}
.btn-y:active{transform:scale(.985);}
.btn-y:disabled{background:var(--c3);color:var(--muted2);cursor:default;}
.btn-d{background:var(--c2);color:#fff;font-weight:600;border-radius:12px;padding:16px;width:100%;font-size:16px;}
.btn-ghost{color:#fff;font-weight:600;padding:15px;width:100%;font-size:16px;text-align:center;}
.danger{color:var(--red);font-weight:600;text-align:center;padding:15px;width:100%;}

/* ============ WELCOME ============ */
#welcome{min-height:100vh;display:flex;flex-direction:column;}
.hero{position:relative;height:52vh;min-height:360px;overflow:hidden;
  background:linear-gradient(150deg,#7a8fa0 0%,#9aa88c 40%,#c9a06a 75%,#8d6b4a 100%);}
.hero::before{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 70% 25%,rgba(255,255,255,.35),transparent 55%),
             radial-gradient(ellipse at 20% 80%,rgba(40,60,80,.45),transparent 60%);}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;
  background:linear-gradient(to bottom,transparent,rgba(0,0,0,.55));}
.hero .oes{position:absolute;z-index:3;top:calc(22px + var(--sat));left:20px;width:118px;height:118px;border-radius:50%;
  background:var(--yellow);color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;line-height:1.1;box-shadow:0 6px 18px rgba(0,0,0,.28);}
.hero .oes small{font-size:12px;font-weight:600;}
.hero .oes b{font-size:25px;line-height:1;margin:1px 0;}
.hero .info{position:absolute;z-index:3;top:calc(24px + var(--sat));right:20px;width:44px;height:44px;border-radius:50%;
  background:rgba(60,60,60,.65);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
  font-size:19px;font-style:italic;font-weight:600;color:#fff;}
.hero .joe{position:absolute;z-index:3;top:128px;left:118px;width:66px;height:66px;border-radius:50% 50% 50% 6px;
  background:#a8813c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:23px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);}
.hero .rlogo{position:absolute;z-index:4;left:50%;bottom:-42px;transform:translateX(-50%);width:112px;height:112px;
  border-radius:4px;box-shadow:0 10px 26px rgba(0,0,0,.45);}
.wbody{flex:1;padding:66px 18px calc(22px + var(--sab));display:flex;flex-direction:column;}
.wcard{background:var(--c2);border-radius:20px;padding:24px 18px 14px;text-align:center;}
.wcard h2{font-size:25px;font-weight:600;margin-bottom:24px;}
.wpay{display:flex;gap:13px;margin-top:auto;padding-top:26px;}
.paychip{flex:1;border-radius:28px;padding:15px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;}
.paychip.a{background:#fff;color:#111;}
.paychip.b{background:#1a63c9;color:#fff;}
.homebar{width:135px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:14px auto 0;}

/* ============ LOGIN ============ */
#login{min-height:100vh;display:flex;flex-direction:column;padding:0 18px calc(24px + var(--sab));}
.navbar{display:flex;align-items:center;justify-content:center;height:60px;margin-top:var(--sat);position:relative;}
.navbar h1{font-size:19px;font-weight:700;}
.navbar .circ{position:absolute;width:46px;height:46px;border-radius:50%;background:var(--c2);
  display:flex;align-items:center;justify-content:center;}
.navbar .circ.l{left:0;} .navbar .circ.r{right:0;}
.li-text{font-size:22px;line-height:1.38;margin:26px 2px 0;font-weight:400;}
.codebox{margin-top:34px;background:var(--c2);border-bottom:2px solid var(--yellow);border-radius:6px 6px 0 0;
  padding:11px 14px 9px;display:flex;align-items:flex-end;gap:10px;}
.codebox .cbin{flex:1;}
.codebox label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px;}
.codebox input{width:100%;background:none;border:none;outline:none;color:#fff;font-size:20px;letter-spacing:5px;
  padding:3px 0;font-variant-numeric:tabular-nums;}
.codebox input::placeholder{letter-spacing:normal;color:var(--muted2);}
.codebox .eye{padding:4px;color:#c8c8cc;}
.li-err{color:var(--red);font-size:14px;min-height:20px;margin-top:9px;padding-left:2px;}
.li-forgot{text-align:center;font-weight:700;font-size:17px;margin-top:22px;}
.li-btn{margin-top:62px;}
.li-btn .btn-y:disabled{background:var(--yellow);color:#8a8a8a;}
.bio{text-align:center;color:var(--muted);font-size:14px;margin-top:16px;}

/* ============ APP ============ */
#app{display:none;min-height:100vh;padding-bottom:112px;}
.appbar{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;
  height:58px;padding:var(--sat) 16px 0;margin-top:var(--sat);}
.appbar .ttl{font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px;}
.appbar .out{position:absolute;right:16px;width:44px;height:44px;border-radius:50%;background:var(--c2);
  display:flex;align-items:center;justify-content:center;}
.rlogo-sm{display:inline-flex;align-items:center;justify-content:center;background:var(--yellow);border-radius:3px;}
.h1big{font-size:28px;font-weight:800;padding:22px 18px 12px;letter-spacing:-.3px;}
.h1big.row{display:flex;align-items:center;justify-content:space-between;}
.h1big .lnk{font-size:17px;font-weight:600;color:var(--link);text-decoration:underline;}

/* promo */
.promo{position:relative;margin-top:4px;}
.ptrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;}
.ptrack::-webkit-scrollbar{display:none;}
.pslide{min-width:100%;scroll-snap-align:start;display:flex;height:152px;}
.pslide .pic{width:32%;position:relative;background-size:cover;background-position:center;}
.pslide .txt{flex:1;padding:15px 16px;display:flex;flex-direction:column;justify-content:center;}
.pslide .txt b{font-size:17px;line-height:1.26;font-weight:700;}
.pslide .txt span{font-size:13.5px;opacity:.82;margin-top:7px;line-height:1.3;}
.parr{position:absolute;top:50%;transform:translateY(-50%);color:var(--yellow);font-size:30px;font-weight:800;
  z-index:2;padding:6px 8px;line-height:1;text-shadow:0 1px 6px rgba(0,0,0,.5);}
.parr.l{left:2px;} .parr.r{left:calc(32% - 30px);}
.pdots{display:flex;gap:8px;justify-content:center;padding:14px 0 2px;}
.pdots i{width:8px;height:8px;border-radius:50%;background:#48484a;}
.pdots i.on{background:#fff;}

/* account card */
.acct{background:var(--c2);border-radius:16px;margin:0 14px 14px;overflow:hidden;border:2px solid transparent;}
.acct.hl{border-color:var(--yellow);}
.acct .main{padding:15px 17px 13px;position:relative;}
.acct .ty{color:var(--muted);font-size:15px;}
.acct .ho{font-size:20px;font-weight:600;margin-top:1px;}
.acct .ib{color:var(--muted);font-size:15.5px;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:.2px;}
.acct .brow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:15px;}
.acct .bal{font-size:25px;font-weight:700;color:var(--green);}
.acct .bal.neg{color:var(--red);}
.acct .av{text-align:right;color:var(--muted);font-size:13.5px;}
.acct .av b{display:block;color:#c8c8cc;font-size:16px;font-weight:600;margin-top:1px;}
.acct .cbadge{position:absolute;top:13px;right:14px;}
.acct .foot{border-top:1px solid var(--line);display:flex;align-items:stretch;}
.acct .foot .tf{flex:1;padding:15px 17px;font-size:17.5px;font-weight:700;text-align:left;}
.acct .foot .dots{width:54px;font-size:21px;color:#d0d0d4;border-left:1px solid var(--line);}
.morebtn{display:block;width:100%;text-align:center;color:#e4e4e8;font-size:17.5px;line-height:1.4;padding:10px 20px 6px;}
.morebtn .cv{display:block;font-size:19px;color:var(--muted);margin-top:2px;}

/* lists */
.list{background:var(--c2);border-radius:14px;margin:0 14px 18px;overflow:hidden;}
.row{display:flex;align-items:center;gap:14px;padding:16px 15px;position:relative;width:100%;text-align:left;}
.row+.row::before{content:"";position:absolute;top:0;left:54px;right:0;height:1px;background:var(--line);}
.row .ico{width:26px;display:flex;justify-content:center;flex-shrink:0;color:#c8c8cc;}
.row .lbl{flex:1;font-size:17px;}
.row .lbl small{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;font-weight:400;}
.row .val{color:var(--muted);font-size:15px;}
.row .chev{color:var(--muted2);font-size:19px;}
.prow{background:var(--c2);border-radius:14px;margin:0 14px 13px;padding:15px;display:flex;align-items:center;gap:14px;}
.av-c{width:52px;height:52px;border-radius:50%;background:#8e8e93;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.prow .nm{flex:1;font-size:20px;font-weight:500;}
.invite{background:var(--purple);border-radius:14px;margin:0 14px 20px;padding:17px;display:flex;align-items:center;gap:14px;color:#eddcf2;}
.invite .t{flex:1;font-size:16.5px;line-height:1.32;}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;color:var(--yellow);font-weight:700;
  font-size:16px;width:calc(100% - 28px);margin:0 14px 18px;background:var(--c2);border-radius:14px;}

/* contact quick actions */
.qarow{display:flex;justify-content:space-around;margin:10px 10px 26px;}
.qa{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;}
.qa .c{width:62px;height:62px;border-radius:50%;background:var(--c2);display:flex;align-items:center;justify-content:center;}
.qa span{font-size:15px;}

/* tabbar */
.tabbar{position:fixed;bottom:calc(12px + var(--sab));left:50%;transform:translateX(-50%);width:calc(100% - 20px);
  max-width:500px;background:rgba(48,48,50,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:32px;display:flex;padding:9px 4px;z-index:40;box-shadow:0 8px 28px rgba(0,0,0,.55);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10.5px;padding:4px 0;position:relative;}
.tab.active{color:#fff;}
.tab .ti{position:relative;display:flex;align-items:center;justify-content:center;width:52px;height:30px;}
.tab.active .ti::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.16);border-radius:15px;}
.tab .ti svg{position:relative;}
.tab .bdg{position:absolute;top:-2px;right:8px;background:#ff3b30;color:#fff;font-size:10px;font-weight:700;
  min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;z-index:2;}

/* pages */
.page{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);z-index:60;overflow-y:auto;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,.28,1);padding-bottom:40px;}
.page.open{transform:translateX(0);}
.pbar{position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);display:flex;align-items:center;
  height:56px;padding:var(--sat) 8px 0;margin-top:var(--sat);z-index:5;}
.pbar .bk{width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--yellow);}
.pbar h1{font-size:17.5px;font-weight:700;flex:1;text-align:center;padding-right:46px;}
.pbar .act{position:absolute;right:12px;font-size:15px;color:var(--yellow);font-weight:600;}
.pbody{padding:6px 18px;}

/* forms */
.fld{margin-bottom:17px;}
.fld label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:7px;padding-left:2px;}
.fld input,.fld select,.fld textarea{width:100%;background:var(--c2);border:1.5px solid transparent;border-radius:12px;
  padding:15px;color:#fff;font-size:16px;outline:none;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--yellow);}
.fld select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 15px center;}
.fld .hint{font-size:12.5px;color:var(--muted2);margin-top:6px;padding-left:2px;}
.frow{display:flex;gap:12px;} .frow .fld{flex:1;}
.facts{margin-top:24px;display:flex;flex-direction:column;gap:11px;}
.note{background:var(--c1);border-radius:12px;padding:14px 15px;margin-bottom:18px;color:var(--muted);font-size:13.5px;line-height:1.5;}
.seg{display:flex;background:var(--c1);border-radius:11px;padding:3px;margin-bottom:18px;}
.seg button{flex:1;padding:10px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--muted);}
.seg button.on{background:var(--c3);color:#fff;}
.sw{width:52px;height:31px;border-radius:16px;background:var(--c3);position:relative;transition:.2s;flex-shrink:0;}
.sw.on{background:#34c759;}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s;}
.sw.on::after{transform:translateX(21px);}

/* transactions */
.srch{display:flex;align-items:center;gap:10px;background:var(--c2);border-radius:11px;padding:11px 14px;margin:2px 0 6px;}
.srch input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:16px;}
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.chip{padding:8px 14px;border-radius:18px;background:var(--c2);font-size:14px;white-space:nowrap;color:#d8d8dc;}
.chip.on{background:var(--yellow);color:#111;font-weight:700;}
.daylbl{font-size:13px;font-weight:700;color:var(--muted);padding:16px 0 7px;text-transform:uppercase;letter-spacing:.4px;}
.tx{display:flex;align-items:center;gap:13px;padding:12px 0;width:100%;text-align:left;}
.tx .ci{width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tx .m{flex:1;min-width:0;}
.tx .m b{font-size:16.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx .m span{font-size:13.5px;color:var(--muted);}
.tx .a{font-weight:700;font-size:16.5px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.tx .a.pos{color:var(--green);}
.txsep{height:1px;background:var(--line);margin-left:56px;}
.dhead{padding:8px 18px 16px;}
.dhead .t{color:var(--muted);font-size:15px;}
.dhead .b{font-size:33px;font-weight:800;color:var(--green);margin-top:2px;letter-spacing:-.5px;}
.dhead .b.neg{color:var(--red);}
.dhead .i{color:var(--muted);font-size:14.5px;margin-top:6px;}
.dactions{display:flex;gap:10px;margin-top:14px;}
.dactions button{flex:1;background:var(--c2);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;
  align-items:center;gap:7px;font-size:12.5px;font-weight:600;}
.empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:15px;}

/* review / success */
.rev{background:var(--c2);border-radius:14px;padding:2px 16px;margin-bottom:20px;}
.rev .r{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);}
.rev .r:last-child{border-bottom:none;}
.rev .k{color:var(--muted);font-size:15px;flex-shrink:0;}
.rev .v{text-align:right;font-weight:600;word-break:break-word;}
.rev .v.amt{color:var(--yellow);font-size:21px;font-weight:800;}
.succ{display:flex;flex-direction:column;align-items:center;text-align:center;padding:15vh 24px 24px;}
.chk{width:94px;height:94px;border-radius:50%;background:#34c759;display:flex;align-items:center;justify-content:center;
  margin-bottom:24px;animation:pop .42s cubic-bezier(.2,1.4,.5,1);}
@keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}
.succ h2{font-size:24px;margin-bottom:10px;}
.succ p{color:var(--muted);font-size:16px;line-height:1.5;margin-bottom:4px;}

/* card visual */
.bank-card{border-radius:16px;padding:18px;height:200px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(135deg,#2b2b2d,#161617);border:1px solid #3a3a3c;position:relative;overflow:hidden;margin-bottom:18px;}
.bank-card.blocked{opacity:.5;}
.bank-card .yl{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:3px;background:var(--yellow);
  display:flex;align-items:center;justify-content:center;}
.bank-card .num{font-size:21px;letter-spacing:2.5px;font-variant-numeric:tabular-nums;}
.bank-card .bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#c8c8cc;}
.bank-card .chip{width:38px;height:28px;border-radius:5px;background:linear-gradient(135deg,#d9c46a,#a8873a);padding:0;}
.blocked-tag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;
  font-weight:800;color:var(--red);letter-spacing:2px;}

/* bars (finanzmanager) */
.bar{height:9px;border-radius:5px;background:var(--c3);overflow:hidden;margin-top:8px;}
.bar i{display:block;height:100%;border-radius:5px;}
.catrow{padding:13px 0;border-bottom:1px solid var(--line);}
.catrow:last-child{border-bottom:none;}
.catrow .top{display:flex;align-items:center;gap:11px;}
.catrow .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;}
.catrow .nm{flex:1;font-size:16px;}
.catrow .vl{font-weight:700;font-variant-numeric:tabular-nums;}
.statgrid{display:flex;gap:12px;margin-bottom:18px;}
.stat{flex:1;background:var(--c2);border-radius:14px;padding:15px;}
.stat .l{font-size:13px;color:var(--muted);}
.stat .v{font-size:21px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums;}

/* sheet */
.bd{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:75;opacity:0;pointer-events:none;transition:.28s;}
.bd.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--c1);
  border-radius:20px 20px 0 0;z-index:80;transform:translateY(110%);transition:transform .32s cubic-bezier(.32,.72,.28,1);
  padding:10px 0 calc(14px + var(--sab));}
.sheet.open{transform:translateY(0);}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:#48484a;margin:0 auto 8px;}
.sheet h3{font-size:17px;font-weight:700;padding:10px 18px;text-align:center;color:var(--muted);}
.sheet .si{display:flex;align-items:center;gap:14px;padding:16px 20px;font-size:17px;width:100%;text-align:left;}
.sheet .si:active{background:var(--c2);}
.sheet .si .ico{width:24px;display:flex;justify-content:center;color:#c8c8cc;}

.toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(16px);background:#48484a;color:#fff;

/* ---------- login (Signaturcode, wie im Original: Textfeld + Anmelden) ---------- */
function vLogin(){
  const n=state.pin.length;
  return `<div id="login">
    <div class="navbar"><button class="circ l" id="lBack">${sv('<polyline points="15 18 9 12 15 6"/>','#fff',2.4,22)}</button><h1>Login</h1></div>
    <div class="li-text">Bitte geben Sie Ihren ${n}-stelligen push-TAN Signaturcode der Verfügernummer <b>${esc(state.profile.verfnr)}</b> ein.</div>
    <div class="codebox">
      <div class="cbin"><label>Signaturcode</label>
        <input id="liCode" type="password" inputmode="numeric" autocomplete="off" maxlength="${n}" placeholder=""></div>
      <button class="eye" id="liEye">${IC.eye}</button>
    </div>
    <div class="li-err" id="liErr"></div>
    <div class="li-forgot" id="liForgot">Signaturcode vergessen</div>
    <div class="li-btn"><button class="btn-y" id="liGo" disabled>Anmelden</button></div>
    ${state.settings.bioLogin?'<div class="bio">oder mit Face ID anmelden</div>':''}
  </div>`;
}
function bindLogin(){
  const i=document.getElementById('liCode'),b=document.getElementById('liGo'),e=document.getElementById('liErr');
  document.getElementById('lBack').onclick=scrWelcome;
  document.getElementById('liForgot').onclick=()=>toast('Hinweis: Standard-Code ist 0000');
  let vis=false;
  document.getElementById('liEye').onclick=()=>{vis=!vis;i.type=vis?'text':'password';
    document.getElementById('liEye').innerHTML=vis?IC.eyeOff:IC.eye;};
  i.addEventListener('input',()=>{i.value=i.value.replace(/\D/g,'');b.disabled=i.value.length!==state.pin.length;e.textContent='';});
  b.onclick=()=>{if(i.value===state.pin){enterApp();}
    else{e.textContent='Der eingegebene Signaturcode ist nicht korrekt.';i.value='';b.disabled=true;
      if(navigator.vibrate)navigator.vibrate(180);}};
  setTimeout(()=>i.focus(),250);
}

function appbar(t){return `<div class="appbar"><div class="ttl">${RLOGO(26)} ${esc(t)}</div>
  <button class="out" id="btnOut">${IC.out}</button></div>`;}
function tabbar(){
  const unread=state.messages.filter(m=>!m.read).length;
  const t=(k,ic,l,b)=>`<button class="tab ${tab===k?'active':''}" data-go="${k}">
    <span class="ti">${b?`<span class="bdg">${b}</span>`:''}${ic(tab===k?'#fff':'#8e8e93')}</span><span>${l}</span></button>`;
  return `<nav class="tabbar">${t('over',IC.tOver,'Übersicht',state.accounts.length?1:0)}
    ${t('manage',IC.tGear,'Verwalten')}${t('disc',IC.tDisc,'Entdecken')}
    ${t('contact',IC.tChat,'Kontakt',unread||'')}${t('fin',IC.tFin,'Finanzmanager')}</nav>`;
}

/* ---------- FINANZMANAGER ---------- */
function tFin(){
  const all=state.accounts.flatMap(a=>a.tx||[]);
  const inc=all.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const exp=all.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  const wealth=totalBalance()+state.secondary.reduce((s,x)=>s+x.value,0);
  const by={};all.filter(t=>t.amount<0).forEach(t=>{const k=t.cat||'sonstiges';by[k]=(by[k]||0)+Math.abs(t.amount);});
  const max=Math.max(1,...Object.values(by));
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{const c=CATS[k]||CATS.sonstiges;
    return `<div class="catrow"><div class="top"><span class="dot" style="background:${c.c}22;color:${c.c}">${c.e}</span>
      <span class="nm">${c.l}</span><span class="vl">${fmt(v)}</span></div>
      <div class="bar"><i style="width:${Math.round(v/max*100)}%;background:${c.c}"></i></div></div>`;}).join('');
  return appbar('Finanzmanager')+`
    <div class="h1big">Vermögen</div>
    <div class="list" style="padding:16px 16px 18px">
      <div style="color:var(--muted);font-size:14px">Gesamtvermögen</div>

    </div>
    <div class="pbody" style="padding-top:0">
      <div class="statgrid">
        <div class="stat"><div class="l">Einnahmen</div><div class="v" style="color:var(--green)">+${fmt(inc)}</div></div>
        <div class="stat"><div class="l">Ausgaben</div><div class="v" style="color:var(--red)">−${fmt(exp)}</div></div>
      </div>
    </div>

    <div class="list" style="padding:2px 16px">${rows||'<div class="empty">Noch keine Ausgaben.</div>'}</div>`;
}

/* ==========================================================================

function openPage(html,after){
  const p=document.createElement('div');p.className='page';p.innerHTML=html;
  document.body.appendChild(p);requestAnimationFrame(()=>p.classList.add('open'));
  p.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closePage(p));
  after&&after(p);return p;
}
function closePage(p){p.classList.remove('open');setTimeout(()=>p.remove(),300);paint();}
const pbar=(t,act='')=>`<div class="pbar"><button class="bk" data-close>‹</button><h1>${esc(t)}</h1>${act}</div>`;

let sheetEl=null;
function openSheet(title,items){
  closeSheet();
  const bd=document.getElementById('bd');
  const s=document.createElement('div');s.className='sheet';
  s.innerHTML=`<div class="grab"></div>${title?`<h3>${esc(title)}</h3>`:''}`+
    items.map((it,i)=>`<button class="si" data-i="${i}"><span class="ico">${it.ic||''}</span><span>${esc(it.l)}</span></button>`).join('');
  document.body.appendChild(s);sheetEl=s;
  requestAnimationFrame(()=>{s.classList.add('open');bd.classList.add('open');});
  bd.onclick=closeSheet;
  s.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];closeSheet();it.fn&&it.fn();});
}
function closeSheet(){const bd=document.getElementById('bd');bd.classList.remove('open');
  if(sheetEl){const s=sheetEl;s.classList.remove('open');setTimeout(()=>s.remove(),320);sheetEl=null;}}

        <button data-act="ed">${IC.edit}<span>Bearbeiten</span></button>
      </div>
    </div>
    <div class="pbody" style="padding-top:0">

      </div>
      <div id="txlist"></div>
    </div>`,p=>{
      const draw=()=>{
        let list=(a.tx||[]).slice().sort((x,y)=>y.date.localeCompare(x.date));
        if(q)list=list.filter(t=>(t.title+' '+(t.purpose||'')).toLowerCase().includes(q));
        if(fc==='in')list=list.filter(t=>t.amount>0);
        else if(fc==='out')list=list.filter(t=>t.amount<0);
        else if(fc.startsWith('c:'))list=list.filter(t=>(t.cat||'sonstiges')===fc.slice(2));
        let h='',last='';
        list.forEach(t=>{if(t.date!==last){h+=`<div class="daylbl">${dLabel(t.date)}</div>`;last=t.date;}
          const c=cat(t);
          h+=`<button class="tx" data-tx="${t.id}"><span class="ci" style="background:${c.c}22;color:${c.c}">${c.e}</span>
            <span class="m"><b>${esc(t.title)}</b><span>${esc(t.purpose||c.l)}</span></span>
            <span class="a ${t.amount>0?'pos':''}">${t.amount>0?'+':''}${fmt(t.amount)}</span></button><div class="txsep"></div>`;});
        p.querySelector('#txlist').innerHTML=h||'<div class="empty">Keine Umsätze gefunden.</div>';
        p.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>pgTxDetail(a,b.dataset.tx));
      };
      p.querySelector('#txq').addEventListener('input',e=>{q=e.target.value.toLowerCase().trim();draw();});
      p.querySelectorAll('#txf .chip').forEach(b=>b.onclick=()=>{fc=b.dataset.f;
        p.querySelectorAll('#txf .chip').forEach(x=>x.classList.toggle('on',x===b));draw();});
      p.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
        const k=b.dataset.act;
        if(k==='tr'){closePage(p);pgTransfer(a.id);}
        else if(k==='cp'){navigator.clipboard?.writeText(a.iban);toast('IBAN kopiert');}
        else if(k==='sh'){toast('Kontodaten geteilt');}
        else if(k==='ed'){closePage(p);pgEditAccount(a.id);}
      });
      draw();
    });
}

      p.querySelector('#tSign').onclick=()=>signCode('Überweisung unterschreiben',()=>{

          state.templates.push({id:uid(),name:d.name,iban:d.iban,purpose:d.purpose});
        f.balance=Math.round((f.balance-d.amount)*100)/100;
        f.available=Math.round(((f.available??f.balance)-d.amount)*100)/100;
        f.tx=f.tx||[];f.tx.unshift({id:uid(),title:d.name,purpose:d.purpose||'Überweisung',amount:-d.amount,
          date:d.date,cat:'ueberweisung',iban:d.iban});
        const tg=state.accounts.find(x=>x.iban.replace(/\s/g,'')===d.iban.replace(/\s/g,'')&&x.id!==f.id);
        if(tg){tg.balance=Math.round((tg.balance+d.amount)*100)/100;
          tg.available=Math.round(((tg.available??tg.balance)+d.amount)*100)/100;tg.tx=tg.tx||[];
          tg.tx.unshift({id:uid(),title:f.holder,purpose:d.purpose||'Überweisung',amount:d.amount,date:d.date,cat:'einkommen'});}
        save();closePage(p);pgSuccess('Überweisung erfolgreich',`${eur(d.amount)} an ${d.name}`,'wurde erfolgreich beauftragt.');
      });
    });
}

      <div class="row"><span class="lbl">Version</span><span class="val">Prank 2.0</span></div>
      <div class="row"><span class="lbl">Datenspeicherung</span><span class="val">nur lokal</span></div>
    </div>
    <button class="btn-y" data-close>Schließen</button></div>`);
}

/* ==========================================================================
   BINDINGS
   ========================================================================== */
function bindTabs(){
  document.getElementById('btnOut')?.addEventListener('click',()=>scrWelcome());
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>pgTransfer(b.dataset.tr));
  document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>{
    const a=state.accounts.find(x=>x.id===b.dataset.sheet);
    openSheet(a.type+' · '+a.iban.slice(-9),[
      {l:'Umsätze anzeigen',ic:IC.chart,fn:()=>pgAccount(a.id)},
      {l:'Neue Überweisung',ic:IC.send,fn:()=>pgTransfer(a.id)},
      {l:'Dauerauftrag anlegen',ic:IC.repeat,fn:()=>pgStandingNew()},
      {l:'IBAN kopieren',ic:IC.copy,fn:()=>{navigator.clipboard?.writeText(a.iban);toast('IBAN kopiert');}},
      {l:'Konto bearbeiten',ic:IC.edit,fn:()=>pgEditAccount(a.id)}
    ]);});
  document.querySelectorAll('.acct .main').forEach((m,i)=>{
    const a=state.accounts[i];if(a)m.onclick=()=>pgAccount(a.id);});
  document.getElementById('moreBtn')?.addEventListener('click',()=>{showSecondary=!showSecondary;paint();});
  const tr=document.getElementById('ptrack');
  if(tr)tr.addEventListener('scroll',()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);
    document.querySelectorAll('#pdots i').forEach((d,x)=>d.classList.toggle('on',x===i));});

  document.querySelector('[data-profile]')?.addEventListener('click',pgProfile);
  document.querySelectorAll('[data-editacct]').forEach(b=>b.onclick=()=>pgEditAccount(b.dataset.editacct));
  document.querySelector('[data-addacct]')?.addEventListener('click',()=>pgEditAccount(null));
  document.querySelector('[data-appset]')?.addEventListener('click',pgAppSettings);
  document.querySelector('[data-sec]')?.addEventListener('click',pgSecurity);
  document.querySelector('[data-alerts]')?.addEventListener('click',pgAlerts);
  document.querySelector('[data-legal]')?.addEventListener('click',pgLegal);
  document.querySelector('[data-cards]')?.addEventListener('click',pgCards);
  document.querySelector('[data-raipay]')?.addEventListener('click',pgRaiPay);
  document.querySelector('[data-standing]')?.addEventListener('click',pgStanding);
  document.querySelector('[data-templates]')?.addEventListener('click',pgTemplates);
  document.querySelector('[data-hotline]')?.addEventListener('click',pgHotlines);
  document.querySelector('[data-branch]')?.addEventListener('click',pgBranch);
  document.querySelectorAll('[data-msgs]').forEach(b=>b.onclick=pgMessages);
  document.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.qa;
    if(k==='msg')pgNewMessage();else if(k==='apt')pgAppointment();
    else if(k==='call')toast('Anruf an '+state.berater.tel);else toast('Rückruf angefordert');});
  document.querySelector('[data-reset]')?.addEventListener('click',()=>{
    if(confirm('Prank komplett zurücksetzen? Alle Einstellungen gehen verloren.')){
      state=structuredClone(DEFAULT_STATE);save();toast('Zurückgesetzt');scrWelcome();}});
}

/* boot */
scrWelcome();
</script>
</body>
</html>
