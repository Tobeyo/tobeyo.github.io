<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nessie-Garden 3D</title>
  
  <meta name="theme-color" content="#1a1b26">
  <link rel="icon" type="image/png" href="logo.png">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

    :root {
      --bg-color: #0f1015;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-1: #27e08a; /* Green */
      --accent-2: #13c4d8; /* Cyan */
      --danger: #ff4757;
      --text-main: #ffffff;
      --text-muted: #a0a4b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(39, 224, 138, 0.1), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(19, 196, 216, 0.1), transparent 25%);
      overflow-x: hidden;
    }

    /* Navigation */
    .top-nav {
      width: 100%;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-nav a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      transition: all 0.2s;
    }

    .top-nav a:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .wither-timer {
      font-weight: 800;
      color: var(--accent-2);
      background: rgba(0,0,0,0.5);
      padding: 5px 12px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      font-variant-numeric: tabular-nums;
    }
    .wither-timer.danger { color: var(--danger); animation: pulse 2s infinite; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .user-info { font-weight: 600; color: var(--accent-1); }

    /* Login View */
    #loginView {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    
    .login-box {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--card-border);
      text-align: center;
      width: 100%;
      backdrop-filter: blur(10px);
    }

    input[type="text"] {
      width: 100%;
      padding: 15px;
      margin: 20px 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      font-family: inherit;
    }
    
    input[type="text"]:focus { outline: none; border-color: var(--accent-1); }

    .btn {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn.danger { background: var(--danger); color: white; }

    /* Main App */
    #appView {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 800px;
      padding: 20px;
      gap: 20px;
      flex-grow: 1;
    }

    .hidden { display: none !important; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      background: var(--card-bg);
      padding: 5px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      cursor: pointer;
      border-radius: 12px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.3s;
    }
    .tab.active {
      background: rgba(255,255,255,0.1);
      color: var(--text-main);
    }

    /* Views */
    .view-content { display: none; flex-direction: column; gap: 20px; animation: fadeIn 0.4s ease; flex-grow: 1; }
    .view-content.active { display: flex; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Timer View */
    .timer-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .circle-timer {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: 8px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      font-variant-numeric: tabular-nums;
    }
    .circle-timer::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 8px solid var(--accent-1);
      border-color: var(--accent-1) var(--accent-1) transparent transparent;
      transform: rotate(45deg);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .circle-timer.running::after {
      opacity: 1;
      animation: spin 60s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(405deg); } }

    .time-display { font-size: 4rem; font-weight: 800; }
    .selected-plant-preview { font-size: 3rem; margin-bottom: -10px; }

    .controls { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; width: 100%; }
    
    .selector {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--card-border);
      padding: 10px 15px;
      border-radius: 12px;
      color: white;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
    .selector option { background: var(--bg-color); }

    /* Plant Picker */
    .plant-picker {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding: 10px 0;
      width: 100%;
      justify-content: center;
    }
    .plant-option {
      font-size: 2rem;
      cursor: pointer;
      opacity: 0.5;
      transition: transform 0.2s, opacity 0.2s;
    }
    .plant-option:hover { transform: scale(1.2); }
    .plant-option.selected { opacity: 1; transform: scale(1.3); }

    /* Garden View 3D */
    .garden-status {
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 15px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .garden-status h3 { color: var(--accent-1); margin: 0; }
    .garden-status.withered h3 { color: var(--text-muted); }

    #garden3D {
      width: 100%;
      height: 400px;
      background: #000;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      overflow: hidden;
      position: relative;
    }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    
    #placementOverlay {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-1);
      color: black;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      pointer-events: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 10;
    }

    /* Tags View */
    .tags-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tag-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .add-tag-form {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .add-tag-form input { margin: 0; flex-grow: 1; }
    .add-tag-form button { width: auto; padding: 0 20px; }

  </style>
</head>
<body>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <div class="top-nav hidden" id="topNav">
    <a href="index.html"><span>🏠</span> Nessie-Hub</a>
    <div class="wither-timer" id="witherTimerDisplay">Lädt...</div>
    <div class="user-info" id="navUser"></div>
  </div>

  <div id="loginView">
    <div class="login-box">
      <h2>Willkommen im 3D-Garten!</h2>
      <p style="color:var(--text-muted); margin-top:10px;">Gib deinen Namen ein, um deinen Garten zu laden.</p>
      <input type="text" id="nameInput" placeholder="Dein Name..." autocomplete="off">
      <button class="btn" id="loginBtn">Eintreten 🌱</button>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="tabs">
      <div class="tab active" data-target="viewTimer">⏱️ Pflanzen</div>
      <div class="tab" data-target="viewGarden">🌳 3D Garten</div>
      <div class="tab" data-target="viewTags">🏷️ Tags</div>
    </div>

    <!-- Timer View -->
    <div class="view-content active" id="viewTimer">
      <div class="timer-container">
        <div class="plant-picker" id="plantPicker">
          <span class="plant-option selected" data-plant="tree">🌳</span>
          <span class="plant-option" data-plant="pine">🌲</span>
          <span class="plant-option" data-plant="cactus">🌵</span>
          <span class="plant-option" data-plant="flower">🌻</span>
          <span class="plant-option" data-plant="mushroom">🍄</span>
        </div>

        <div class="circle-timer" id="circleTimer">
          <div class="selected-plant-preview" id="previewPlant">🌳</div>
          <div class="time-display" id="timeDisplay">25:00</div>
        </div>

        <div class="controls" id="preControls">
          <select class="selector" id="timeSelector">
            <option value="0.083333">5 Sekunden (Test)</option>
            <option value="1">1 Minute</option>
            <option value="10">10 Minuten</option>
            <option value="25" selected>25 Minuten</option>
            <option value="45">45 Minuten</option>
            <option value="60">60 Minuten</option>
          </select>
          <select class="selector" id="tagSelector">
            <option value="Allgemein">Allgemein</option>
          </select>
        </div>

        <button class="btn" id="startBtn">Lernen & Pflanzen starten!</button>
        <button class="btn danger hidden" id="cancelBtn">Abbrechen (Pflanze verwelkt! 🥀)</button>
      </div>
    </div>

    <!-- Garden View -->
    <div class="view-content" id="viewGarden">
      <div class="garden-status" id="gardenStatus">
        <h3 id="gardenTitle">Mein Garten</h3>
        <p id="gardenDesc" style="color:var(--text-muted); font-size:0.9rem; margin:0;">Klicke und ziehe zum Drehen</p>
      </div>
      <div id="garden3D">
        <div id="placementOverlay" class="hidden">Klicke auf ein Feld, um zu pflanzen!</div>
      </div>
    </div>

    <!-- Tags View -->
    <div class="view-content" id="viewTags">
      <div class="tags-list" id="tagsList">
        <!-- Tags will be injected here -->
      </div>
      <div class="add-tag-form">
        <input type="text" id="newTagInput" placeholder="Neuer Tag (z.B. Lesen)">
        <button class="btn" id="addTagBtn">Hinzufügen</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      databaseURL: "https://garden-eab95-default-rtdb.europe-west1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // App State
    let currentUser = "";
    let userKey = "";
    let tags = ["Allgemein"];
    let plants = [];
    let lastWatered = 0;
    
    // Timer State
    let timerInterval = null;
    let clockInterval = null;
    let timeLeft = 0;
    let selectedPlantType = "tree";
    let selectedPlantEmoji = "🌳";
    let isRunning = false;
    let placementMode = false;
    let plantToPlace = null;

    // DOM Elements
    const el = id => document.getElementById(id);
    const timeDisplay = el("timeDisplay");
    const previewPlant = el("previewPlant");
    const circleTimer = el("circleTimer");
    const startBtn = el("startBtn");
    const cancelBtn = el("cancelBtn");
    const preControls = el("preControls");
    const timeSelector = el("timeSelector");
    const tagSelector = el("tagSelector");

    // Login Logic
    const savedName = localStorage.getItem("wm2026_name");
    if (savedName) { el("nameInput").value = savedName; }

    function login() {
      const name = el("nameInput").value.trim();
      if (!name) return;
      currentUser = name;
      userKey = name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      localStorage.setItem("wm2026_name", name);
      
      el("loginView").classList.add("hidden");
      el("topNav").classList.remove("hidden");
      el("appView").classList.remove("hidden");
      el("navUser").textContent = currentUser;

      init3D();
      loadUserData();
      startGlobalClock();
    }
    el("loginBtn").addEventListener("click", login);
    el("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

    // Tabs Logic
    function switchTab(targetId) {
      if(isRunning && targetId !== 'viewTimer') {
        alert("Ein Timer läuft gerade! Konzentriere dich auf deine Aufgabe.");
        return;
      }
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
      document.querySelector(`.tab[data-target="${targetId}"]`).classList.add('active');
      el(targetId).classList.add('active');
      
      if(targetId === 'viewGarden') {
        rebuild3DScene();
      }
      if(targetId === 'viewTags') renderTags();
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.target));
    });

    // Firebase Data Loading
    function loadUserData() {
      const ref = db.ref(`users/${userKey}`);
      ref.on("value", snapshot => {
        const data = snapshot.val() || {};
        tags = data.tags || ["Allgemein"];
        plants = data.plants ? Object.values(data.plants) : [];
        lastWatered = data.lastWatered || Date.now(); // default to now if brand new
        
        updateTagSelectors();
        renderTags();
        if(!placementMode && el('viewGarden').classList.contains('active')) {
          rebuild3DScene();
        }
      });
    }

    function startGlobalClock() {
      if(clockInterval) clearInterval(clockInterval);
      clockInterval = setInterval(updateWitherCountdown, 1000);
      updateWitherCountdown();
    }

    function updateWitherCountdown() {
      const now = Date.now();
      const msSince = now - lastWatered;
      const msLimit = 24 * 60 * 60 * 1000; // 24 hours
      const msLeft = msLimit - msSince;
      
      const display = el("witherTimerDisplay");
      
      if(msLeft <= 0) {
        display.textContent = "Garten ist ausgetrocknet! 🥀";
        display.classList.add("danger");
      } else {
        const h = Math.floor(msLeft / (1000 * 60 * 60));
        const m = Math.floor((msLeft % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((msLeft % (1000 * 60)) / 1000);
        display.textContent = `💧 ${h}h ${m}m ${s}s`;
        display.classList.remove("danger");
      }
    }

    // Timer Logic
    function updateDisplay() {
      const m = Math.floor(timeLeft / 60).toString().padStart(2, "0");
      const s = (timeLeft % 60).toString().padStart(2, "0");
      timeDisplay.textContent = `${m}:${s}`;
    }

    timeSelector.addEventListener("change", () => {
      if(!isRunning) {
        timeLeft = Math.round(parseFloat(timeSelector.value) * 60);
        updateDisplay();
      }
    });

    document.querySelectorAll('.plant-option').forEach(opt => {
      opt.addEventListener('click', () => {
        if(isRunning) return;
        document.querySelectorAll('.plant-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedPlantType = opt.dataset.plant;
        selectedPlantEmoji = opt.textContent;
        previewPlant.textContent = selectedPlantEmoji;
      });
    });

    startBtn.addEventListener("click", () => {
      timeLeft = Math.round(parseFloat(timeSelector.value) * 60);
      isRunning = true;
      startBtn.classList.add("hidden");
      preControls.classList.add("hidden");
      cancelBtn.classList.remove("hidden");
      circleTimer.classList.add("running");
      updateDisplay();

      timerInterval = setInterval(() => {
        timeLeft--;
        updateDisplay();
        if(timeLeft <= 0) {
          finishTimer(true);
        }
      }, 1000);
    });

    cancelBtn.addEventListener("click", () => {
      if(confirm("Willst du wirklich abbrechen? Deine Pflanze wird verwelken! 🥀")) {
        finishTimer(false);
      }
    });

    function finishTimer(success) {
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.classList.remove("hidden");
      preControls.classList.remove("hidden");
      cancelBtn.classList.add("hidden");
      circleTimer.classList.remove("running");
      
      timeLeft = Math.round(parseFloat(timeSelector.value) * 60);
      updateDisplay();

      if(success) {
        // Enter Placement Mode
        plantToPlace = {
          type: selectedPlantType,
          tag: tagSelector.value,
          duration: parseFloat(timeSelector.value),
          success: true
        };
        placementMode = true;
        el("placementOverlay").classList.remove("hidden");
        switchTab("viewGarden");
      } else {
        // Failed - Place withered plant randomly or simply save it
        const newPlant = {
          type: "withered",
          tag: tagSelector.value,
          duration: parseFloat(timeSelector.value),
          success: false,
          x: Math.floor(Math.random()*10 - 5),
          z: Math.floor(Math.random()*10 - 5),
          ts: Date.now()
        };
        savePlant(newPlant);
        alert("Schade, deine Pflanze ist leider verwelkt. 🥀");
      }
    }

    function savePlant(p) {
      const ref = db.ref(`users/${userKey}`);
      ref.child("plants").push(p);
      if(p.success) {
        lastWatered = Date.now();
        ref.child("lastWatered").set(lastWatered);
        updateWitherCountdown();
      }
    }

    // Tags Logic
    function updateTagSelectors() {
      tagSelector.innerHTML = tags.map(t => `<option value="${t}">${t}</option>`).join("");
    }

    function renderTags() {
      el("tagsList").innerHTML = tags.map(t => `<div class="tag-item"><span>🏷️ ${t}</span></div>`).join("");
    }

    el("addTagBtn").addEventListener("click", () => {
      const nt = el("newTagInput").value.trim();
      if(nt && !tags.includes(nt)) {
        tags.push(nt);
        db.ref(`users/${userKey}/tags`).set(tags);
        el("newTagInput").value = "";
      }
    });

    // ---------------------------------------------------------
    // 3D Scene Logic (Three.js)
    // ---------------------------------------------------------
    let scene, camera, renderer, controls;
    let raycaster, mouse;
    let gridHelper, placementIndicator;
    let plantGroup;

    // Materials (Healthy vs Withered)
    const colors = {
      trunk: 0x8b5a2b,
      leaf: 0x27e08a,
      pine: 0x145a32,
      cactus: 0x1e8449,
      flowerCore: 0xf1c40f,
      flowerPetal: 0xe74c3c,
      mushroomStump: 0xecf0f1,
      mushroomCap: 0xe74c3c,
      withered: 0x7f8c8d,
      ground: 0x2e4053
    };

    function createMat(color, isWithered) {
      return new THREE.MeshLambertMaterial({ 
        color: isWithered ? colors.withered : color 
      });
    }

    function init3D() {
      const container = el('garden3D');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f1015);
      scene.fog = new THREE.Fog(0x0f1015, 10, 50);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 10, 15);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground
      controls.minDistance = 5;
      controls.maxDistance = 30;

      // Lights
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
      hemiLight.position.set(0, 200, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Ground
      const groundGeo = new THREE.PlaneGeometry(100, 100);
      const groundMat = new THREE.MeshLambertMaterial({ color: colors.ground });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Grid helper (for visual)
      gridHelper = new THREE.GridHelper(20, 20, 0xffffff, 0xffffff);
      gridHelper.material.opacity = 0.2;
      gridHelper.material.transparent = true;
      scene.add(gridHelper);

      // Placement Indicator
      const indGeo = new THREE.PlaneGeometry(1, 1);
      const indMat = new THREE.MeshBasicMaterial({ color: 0x27e08a, opacity: 0.5, transparent: true, side: THREE.DoubleSide });
      placementIndicator = new THREE.Mesh(indGeo, indMat);
      placementIndicator.rotation.x = -Math.PI / 2;
      placementIndicator.position.y = 0.01;
      placementIndicator.visible = false;
      scene.add(placementIndicator);

      plantGroup = new THREE.Group();
      scene.add(plantGroup);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // Events
      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('mousemove', onMouseMove);
      renderer.domElement.addEventListener('click', onClick);

      animate();
    }

    function onWindowResize() {
      const container = el('garden3D');
      if(container.clientWidth === 0) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function onMouseMove(event) {
      if(!placementMode) {
        placementIndicator.visible = false;
        return;
      }
      
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const planeZ = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      const target = new THREE.Vector3();
      raycaster.ray.intersectPlane(planeZ, target);

      if (target) {
        const x = Math.round(target.x);
        const z = Math.round(target.z);
        // Constrain to grid
        if(Math.abs(x) <= 10 && Math.abs(z) <= 10) {
          placementIndicator.position.set(x, 0.01, z);
          placementIndicator.visible = true;
        } else {
          placementIndicator.visible = false;
        }
      }
    }

    function onClick(event) {
      if(!placementMode || !placementIndicator.visible) return;
      
      // Prevent placing on exact same spot if we want to be strict, but for now just place it
      const x = placementIndicator.position.x;
      const z = placementIndicator.position.z;

      const p = {
        type: plantToPlace.type,
        tag: plantToPlace.tag,
        duration: plantToPlace.duration,
        success: plantToPlace.success,
        x: x,
        z: z,
        ts: Date.now()
      };

      savePlant(p);
      
      placementMode = false;
      placementIndicator.visible = false;
      el("placementOverlay").classList.add("hidden");
      alert("Pflanze erfolgreich gesetzt!");
      rebuild3DScene(); // Render instantly locally
    }

    // 3D Plant Generators
    function generatePlantMesh(type, isWithered) {
      const group = new THREE.Group();
      
      if (type === "tree") {
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1), createMat(colors.trunk, isWithered));
        trunk.position.y = 0.5;
        trunk.castShadow = true;
        const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8), createMat(colors.leaf, isWithered));
        leaves.position.y = 1.3;
        leaves.castShadow = true;
        group.add(trunk, leaves);
      } 
      else if (type === "pine") {
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.6), createMat(colors.trunk, isWithered));
        trunk.position.y = 0.3;
        trunk.castShadow = true;
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2, 8), createMat(colors.pine, isWithered));
        leaves.position.y = 1.5;
        leaves.castShadow = true;
        group.add(trunk, leaves);
      }
      else if (type === "cactus") {
        const mat = createMat(colors.cactus, isWithered);
        const main = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.5), mat);
        main.position.y = 0.75;
        main.castShadow = true;
        const arm1 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.5), mat);
        arm1.position.set(0.4, 0.8, 0);
        arm1.rotation.z = Math.PI/4;
        const arm2 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.4), mat);
        arm2.position.set(-0.4, 0.5, 0);
        arm2.rotation.z = -Math.PI/4;
        group.add(main, arm1, arm2);
      }
      else if (type === "flower") {
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1), createMat(colors.leaf, isWithered));
        stem.position.y = 0.5;
        const core = new THREE.Mesh(new THREE.SphereGeometry(0.2), createMat(colors.flowerCore, isWithered));
        core.position.y = 1;
        group.add(stem, core);
        const petalMat = createMat(colors.flowerPetal, isWithered);
        for(let i=0; i<5; i++) {
          const petal = new THREE.Mesh(new THREE.SphereGeometry(0.15), petalMat);
          const angle = (i/5) * Math.PI * 2;
          petal.position.set(Math.cos(angle)*0.25, 1, Math.sin(angle)*0.25);
          group.add(petal);
        }
      }
      else if (type === "mushroom") {
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 0.6), createMat(colors.mushroomStump, isWithered));
        stem.position.y = 0.3;
        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16, 0, Math.PI*2, 0, Math.PI/2), createMat(colors.mushroomCap, isWithered));
        cap.position.y = 0.6;
        cap.scale.y = 0.5;
        group.add(stem, cap);
      }
      else if (type === "withered" || !type) {
        // A dead stump
        const stump = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 0.4), createMat(colors.trunk, true));
        stump.position.y = 0.2;
        stump.rotation.z = 0.2;
        group.add(stump);
      }

      // Slightly randomize rotation for organic look
      group.rotation.y = Math.random() * Math.PI * 2;
      return group;
    }

    function rebuild3DScene() {
      if(!scene) return;
      onWindowResize(); // Ensure canvas size is correct

      // Clear existing plants
      while(plantGroup.children.length > 0){ 
        plantGroup.remove(plantGroup.children[0]); 
      }

      const now = Date.now();
      const msSince = now - lastWatered;
      const isGlobalWithered = msSince > (24 * 60 * 60 * 1000) && plants.length > 0;

      if(isGlobalWithered) {
        el("gardenTitle").textContent = "Ausgetrockneter Garten 🍂";
        el("gardenStatus").classList.add("withered");
      } else {
        el("gardenTitle").textContent = "Mein Garten 🌸";
        el("gardenStatus").classList.remove("withered");
      }

      plants.forEach(p => {
        // If it's a failed session, it's always withered. 
        // If it's successful, it's withered ONLY if global withered state is true.
        const isWithered = !p.success || isGlobalWithered;
        
        // Ensure x, z exist (backwards compatibility for old 2D data)
        const x = p.x || Math.floor(Math.random() * 10 - 5);
        const z = p.z || Math.floor(Math.random() * 10 - 5);

        // Fallback type mapper if old data used emojis
        let type = p.type;
        if(!type) {
          if(p.plant === "🌻") type = "flower";
          else if(p.plant === "🌲") type = "pine";
          else if(p.plant === "🌵") type = "cactus";
          else if(p.plant === "🥀") type = "withered";
          else type = "tree";
        }

        const mesh = generatePlantMesh(type, isWithered);
        mesh.position.set(x, 0, z);
        plantGroup.add(mesh);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      if(controls) controls.update();
      if(renderer && scene && camera) renderer.render(scene, camera);
    }

    // Init display
    updateDisplay();

  </script>
</body>
</html>
