<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nessie-Garden</title>
  
  <meta name="theme-color" content="#1a1b26">
  <link rel="icon" type="image/png" href="logo.png">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

    :root {
      --bg-color: #0f1015;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-1: #27e08a; /* Green */
      --accent-2: #13c4d8; /* Cyan */
      --danger: #ff4757;
      --text-main: #ffffff;
      --text-muted: #a0a4b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(39, 224, 138, 0.1), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(19, 196, 216, 0.1), transparent 25%);
    }

    /* Navigation */
    .top-nav {
      width: 100%;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-nav a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      transition: all 0.2s;
    }

    .top-nav a:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .user-info { font-weight: 600; color: var(--accent-1); }

    /* Login View */
    #loginView {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    
    .login-box {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--card-border);
      text-align: center;
      width: 100%;
      backdrop-filter: blur(10px);
    }

    input[type="text"] {
      width: 100%;
      padding: 15px;
      margin: 20px 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      font-family: inherit;
    }
    
    input[type="text"]:focus { outline: none; border-color: var(--accent-1); }

    .btn {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn.danger { background: var(--danger); color: white; }

    /* Main App */
    #appView {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      gap: 30px;
      flex-grow: 1;
    }

    .hidden { display: none !important; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      background: var(--card-bg);
      padding: 5px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      cursor: pointer;
      border-radius: 12px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.3s;
    }
    .tab.active {
      background: rgba(255,255,255,0.1);
      color: var(--text-main);
    }

    /* Views */
    .view-content { display: none; flex-direction: column; gap: 20px; animation: fadeIn 0.4s ease; }
    .view-content.active { display: flex; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Timer View */
    .timer-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .circle-timer {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: 8px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      font-variant-numeric: tabular-nums;
    }
    .circle-timer::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 8px solid var(--accent-1);
      border-color: var(--accent-1) var(--accent-1) transparent transparent;
      transform: rotate(45deg);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .circle-timer.running::after {
      opacity: 1;
      animation: spin 60s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(405deg); } }

    .time-display { font-size: 4rem; font-weight: 800; }
    .selected-plant-preview { font-size: 3rem; margin-bottom: -10px; }

    .controls { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; width: 100%; }
    
    .selector {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--card-border);
      padding: 10px 15px;
      border-radius: 12px;
      color: white;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
    .selector option { background: var(--bg-color); }

    /* Plant Picker */
    .plant-picker {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding: 10px 0;
      width: 100%;
      justify-content: center;
    }
    .plant-option {
      font-size: 2rem;
      cursor: pointer;
      opacity: 0.5;
      transition: transform 0.2s, opacity 0.2s;
    }
    .plant-option:hover { transform: scale(1.2); }
    .plant-option.selected { opacity: 1; transform: scale(1.3); }

    /* Garden View */
    .garden-status {
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 20px;
    }
    .garden-status h3 { color: var(--accent-1); margin-bottom: 5px; }
    .garden-status.withered h3 { color: var(--text-muted); }

    .garden-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 15px;
      background: rgba(0,0,0,0.2);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      min-height: 200px;
    }
    .garden-plot {
      aspect-ratio: 1;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      position: relative;
    }
    .garden-plot.withered-plant {
      filter: grayscale(100%) opacity(0.6);
    }
    .garden-plot .tag-tooltip {
      position: absolute;
      bottom: -25px;
      background: black;
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .garden-plot:hover .tag-tooltip { opacity: 1; }

    /* Tags View */
    .tags-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tag-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .add-tag-form {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .add-tag-form input { margin: 0; flex-grow: 1; }
    .add-tag-form button { width: auto; padding: 0 20px; }

  </style>
</head>
<body>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <div class="top-nav hidden" id="topNav">
    <a href="index.html"><span>🏠</span> Nessie-Hub</a>
    <div class="user-info" id="navUser"></div>
  </div>

  <div id="loginView">
    <div class="login-box">
      <h2>Willkommen im Garten!</h2>
      <p style="color:var(--text-muted); margin-top:10px;">Gib deinen Namen ein, um deinen Garten zu laden.</p>
      <input type="text" id="nameInput" placeholder="Dein Name..." autocomplete="off">
      <button class="btn" id="loginBtn">Eintreten 🌱</button>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="tabs">
      <div class="tab active" data-target="viewTimer">⏱️ Pflanzen</div>
      <div class="tab" data-target="viewGarden">🌳 Mein Garten</div>
      <div class="tab" data-target="viewTags">🏷️ Tags</div>
    </div>

    <!-- Timer View -->
    <div class="view-content active" id="viewTimer">
      <div class="timer-container">
        <div class="plant-picker" id="plantPicker">
          <span class="plant-option selected" data-plant="🌻">🌻</span>
          <span class="plant-option" data-plant="🌲">🌲</span>
          <span class="plant-option" data-plant="🌵">🌵</span>
          <span class="plant-option" data-plant="🌷">🌷</span>
          <span class="plant-option" data-plant="🍄">🍄</span>
          <span class="plant-option" data-plant="🌴">🌴</span>
        </div>

        <div class="circle-timer" id="circleTimer">
          <div class="selected-plant-preview" id="previewPlant">🌻</div>
          <div class="time-display" id="timeDisplay">25:00</div>
        </div>

        <div class="controls" id="preControls">
          <select class="selector" id="timeSelector">
            <option value="1">1 Minute (Test)</option>
            <option value="10">10 Minuten</option>
            <option value="25" selected>25 Minuten</option>
            <option value="45">45 Minuten</option>
            <option value="60">60 Minuten</option>
          </select>
          <select class="selector" id="tagSelector">
            <option value="Allgemein">Allgemein</option>
          </select>
        </div>

        <button class="btn" id="startBtn">Lernen & Pflanzen starten!</button>
        <button class="btn danger hidden" id="cancelBtn">Abbrechen (Pflanze verwelkt! 🥀)</button>
      </div>
    </div>

    <!-- Garden View -->
    <div class="view-content" id="viewGarden">
      <div class="garden-status" id="gardenStatus">
        <h3>Lade Garten...</h3>
        <p>Einen Moment bitte.</p>
      </div>
      <div class="garden-grid" id="gardenGrid">
        <!-- Plants will be injected here -->
      </div>
    </div>

    <!-- Tags View -->
    <div class="view-content" id="viewTags">
      <div class="tags-list" id="tagsList">
        <!-- Tags will be injected here -->
      </div>
      <div class="add-tag-form">
        <input type="text" id="newTagInput" placeholder="Neuer Tag (z.B. Lesen)">
        <button class="btn" id="addTagBtn">Hinzufügen</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      databaseURL: "https://garden-eab95-default-rtdb.europe-west1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // App State
    let currentUser = "";
    let userKey = "";
    let tags = ["Allgemein"];
    let plants = [];
    let lastWatered = 0;
    
    // Timer State
    let timerInterval = null;
    let timeLeft = 0;
    let selectedPlant = "🌻";
    let isRunning = false;

    // DOM Elements
    const el = id => document.getElementById(id);
    const timeDisplay = el("timeDisplay");
    const previewPlant = el("previewPlant");
    const circleTimer = el("circleTimer");
    const startBtn = el("startBtn");
    const cancelBtn = el("cancelBtn");
    const preControls = el("preControls");
    const timeSelector = el("timeSelector");
    const tagSelector = el("tagSelector");

    // Login Logic
    const savedName = localStorage.getItem("wm2026_name");
    if (savedName) { el("nameInput").value = savedName; }

    function login() {
      const name = el("nameInput").value.trim();
      if (!name) return;
      currentUser = name;
      userKey = name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      localStorage.setItem("wm2026_name", name);
      
      el("loginView").classList.add("hidden");
      el("topNav").classList.remove("hidden");
      el("appView").classList.remove("hidden");
      el("navUser").textContent = currentUser;

      loadUserData();
    }
    el("loginBtn").addEventListener("click", login);
    el("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

    // Tabs Logic
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        if(isRunning && tab.dataset.target !== 'viewTimer') {
          alert("Ein Timer läuft gerade! Konzentriere dich auf deine Pflanze.");
          return;
        }
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
        tab.classList.add('active');
        el(tab.dataset.target).classList.add('active');
        
        if(tab.dataset.target === 'viewGarden') renderGarden();
        if(tab.dataset.target === 'viewTags') renderTags();
      });
    });

    // Firebase Data Loading
    function loadUserData() {
      const ref = db.ref(`users/${userKey}`);
      ref.on("value", snapshot => {
        const data = snapshot.val() || {};
        tags = data.tags || ["Allgemein"];
        plants = data.plants ? Object.values(data.plants) : [];
        lastWatered = data.lastWatered || 0;
        
        updateTagSelectors();
        renderGarden();
        renderTags();
      });
    }

    // Timer Logic
    function updateDisplay() {
      const m = Math.floor(timeLeft / 60).toString().padStart(2, "0");
      const s = (timeLeft % 60).toString().padStart(2, "0");
      timeDisplay.textContent = `${m}:${s}`;
    }

    timeSelector.addEventListener("change", () => {
      if(!isRunning) {
        timeLeft = parseInt(timeSelector.value) * 60;
        updateDisplay();
      }
    });

    document.querySelectorAll('.plant-option').forEach(opt => {
      opt.addEventListener('click', () => {
        if(isRunning) return;
        document.querySelectorAll('.plant-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedPlant = opt.dataset.plant;
        previewPlant.textContent = selectedPlant;
      });
    });

    startBtn.addEventListener("click", () => {
      timeLeft = parseInt(timeSelector.value) * 60;
      isRunning = true;
      startBtn.classList.add("hidden");
      preControls.classList.add("hidden");
      cancelBtn.classList.remove("hidden");
      circleTimer.classList.add("running");
      updateDisplay();

      timerInterval = setInterval(() => {
        timeLeft--;
        updateDisplay();
        if(timeLeft <= 0) {
          finishTimer(true);
        }
      }, 1000);
    });

    cancelBtn.addEventListener("click", () => {
      if(confirm("Willst du wirklich abbrechen? Deine Pflanze wird verwelken! 🥀")) {
        finishTimer(false);
      }
    });

    function finishTimer(success) {
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.classList.remove("hidden");
      preControls.classList.remove("hidden");
      cancelBtn.classList.add("hidden");
      circleTimer.classList.remove("running");
      
      timeLeft = parseInt(timeSelector.value) * 60;
      updateDisplay();

      const newPlant = {
        plant: success ? selectedPlant : "🥀",
        tag: tagSelector.value,
        duration: parseInt(timeSelector.value),
        ts: Date.now(),
        success: success
      };

      const ref = db.ref(`users/${userKey}`);
      ref.child("plants").push(newPlant);
      
      if(success) {
        ref.child("lastWatered").set(Date.now());
        alert("Glückwunsch! Deine Pflanze ist erfolgreich gewachsen! 🌳");
      } else {
        alert("Schade, deine Pflanze ist leider verwelkt. 🥀");
      }
    }

    // Garden View
    function renderGarden() {
      const now = Date.now();
      const hoursSinceWatered = (now - lastWatered) / (1000 * 60 * 60);
      const isWithered = hoursSinceWatered > 24 && plants.length > 0;

      const statusEl = el("gardenStatus");
      if(plants.length === 0) {
        statusEl.className = "garden-status";
        statusEl.innerHTML = `<h3>Dein Garten ist leer.</h3><p>Starte einen Timer, um deine erste Pflanze zu setzen!</p>`;
      } else if (isWithered) {
        statusEl.className = "garden-status withered";
        statusEl.innerHTML = `<h3>Dein Gehirn trocknet aus! 🍂</h3><p>Du hast seit über 24 Stunden nicht gelernt. Lerne jetzt, um den Garten wieder aufblühen zu lassen!</p>`;
      } else {
        statusEl.className = "garden-status";
        statusEl.innerHTML = `<h3>Blühender Garten 🌸</h3><p>Du hast dein Gehirn gut gewässert! Weiter so.</p>`;
      }

      const grid = el("gardenGrid");
      grid.innerHTML = plants.sort((a,b) => b.ts - a.ts).map(p => {
        let displayPlant = p.plant;
        let extraClass = "";
        if (p.success && isWithered) {
          extraClass = "withered-plant";
        }
        
        return `<div class="garden-plot ${extraClass}">
          ${displayPlant}
          <div class="tag-tooltip">${p.tag} (${p.duration}m)</div>
        </div>`;
      }).join("");
    }

    // Tags Logic
    function updateTagSelectors() {
      tagSelector.innerHTML = tags.map(t => `<option value="${t}">${t}</option>`).join("");
    }

    function renderTags() {
      el("tagsList").innerHTML = tags.map(t => `<div class="tag-item"><span>🏷️ ${t}</span></div>`).join("");
    }

    el("addTagBtn").addEventListener("click", () => {
      const nt = el("newTagInput").value.trim();
      if(nt && !tags.includes(nt)) {
        tags.push(nt);
        db.ref(`users/${userKey}/tags`).set(tags);
        el("newTagInput").value = "";
      }
    });

    // Init display
    updateDisplay();

  </script>
</body>
</html>
